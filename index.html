/* ============================================================
   SESSÃO
   ============================================================ */
let SES = null;
let relogio = null;

const mmss = seg => Math.floor(Math.max(0,seg)/60) + ":" + String(Math.floor(Math.max(0,seg)%60)).padStart(2,"0");

function pararRelogio(){ if(relogio){ clearInterval(relogio); relogio = null; } }

/* O cronômetro para enquanto a explicação está na tela.

   O tempo existe para medir quanto se leva para RESOLVER, e ler por que a
   resposta é aquela não é resolver — é a parte que mais vale a pena da sessão,
   e correr contra o relógio aqui é o incentivo errado. Ao tocar em Continuar o
   relógio volta do ponto em que parou: o fim da sessão é empurrado para a
   frente pelo tanto que ficou parado, então nada de tempo é perdido nem
   ganhado.

   O que impede de usar a pausa para consultar a resposta em outro lugar é que
   ela só existe DEPOIS de responder — nunca antes. */
function pausarRelogio(){
  /* No desafio o relógio não para. Ele é o critério de desempate, e pausar
     enquanto se lê a explicação abriria a mesma porta de sair e voltar.
     Na prova antiga também não: o tempo declarado é o tempo que a professora
     deu, e um simulado com pausa não simula nada. */
  if(SES && (SES.desafio || SES.prova)) return;
  if(!SES || !SES.fim || SES.pausa) return;
  SES.pausa = Date.now();
  pararRelogio();
}
function voltarRelogio(){
  if(!SES || !SES.fim || !SES.pausa) return;
  SES.fim += Date.now() - SES.pausa;
  SES.pausa = null;
  tocarRelogio();
}
function tocarRelogio(){
  pararRelogio();
  if(!SES || !SES.fim) return;
  const passo = () => {
    /* a sessão pode ter sido abandonada entre dois tiques — sair da bateria,
       trocar de tela, zerar o progresso. Sem esta guarda o relógio continuava
       batendo em cima de uma sessão que não existe mais. */
    if(!SES || !SES.fim || SES.pausa){ pararRelogio(); return; }
    const falta = Math.round((SES.fim - Date.now())/1000);
    const el = document.querySelector("#cron");
    if(el){
      el.textContent = "⏱ " + mmss(falta);
      el.classList.toggle("apertado", falta <= 30);
    }
    if(falta <= 0) encerrarPorTempo();
  };
  passo();
  relogio = setInterval(passo, 1000);
}

function encerrarPorTempo(){
  pararRelogio();
  const pendentes = [];
  SES.fila.forEach(it => {
    if(!SES.vistos.includes(it.id) && !pendentes.some(x => x.id === it.id)) pendentes.push(it);
  });
  pendentes.forEach(it => { registrar(it.id, false); SES.vistos.push(it.id); });
  SES.estourou = pendentes.length;
  SES.i = SES.fila.length;
  S.historico[hoje()] = (S.historico[hoje()] || 0) + pendentes.length;
  salvar();
  telaFim();
}

function iniciarSessao(){
  const { fila, modo } = montarSessao();
  if(!fila.length){
    caixaAviso("Nada para estudar aqui",
      "Este recorte está sem exercício disponível agora. Tente outro modo na aba Estudar.");
    return;
  }
  const furou = !!(S.proximaSessao && Date.now() < S.proximaSessao);   // começou antes da espera acabar
  const foco = focoValeRanking();
  SES = { fila, i:0, acertos:0, total:fila.length, respondido:false, vistos:[], estourou:0, log:[],
          inicio:Date.now(), valeRanking: !furou && foco.vale, xpAntes: S.xpSemana, modo,
          motivoSemRanking: furou ? "a espera entre sessões ainda não acabou" : foco.porque };
  SES.fim = S.segPorQuestao ? Date.now() + S.segPorQuestao * 1000 * fila.length : null;
  /* A espera é disparada AQUI, no clique, e não no fim da bateria. Dois motivos:
     1) quem estuda fora do ranking enquanto espera não pode zerar o relógio do ranking;
     2) desistir da bateria no meio e recomeçar não devolve a chance de nota cheia.

     E ela só corre para a sessão que de fato vale ranking. Estava correndo em
     qualquer sessão, o que era incoerente e a Isabela pegou: ela fez uma bateria
     de um assunto só, que já saía avisada como fora do ranking, e mesmo assim
     ficou meia hora sem poder fazer uma que valesse. Cobrava o preço do ranking
     por uma sessão que não dava o prêmio dele. */
  if(SES.valeRanking && !SES.desafio && S.esperaMin > 0){
    S.proximaSessao = Date.now() + S.esperaMin * 60000; salvar();
  }
  render();
  tocarRelogio();
}

/* A barra de progresso virou dez blocos, um por exercício. Barra lisa mostra que
   você avançou, mas não quantos faltam — e saber que faltam dois muda o ânimo
   de quem está na oitava questão. */
function barraHTML(){
  const total = SES.total || SES.fila.length;
  const feitos = (SES.vistos || []).length;
  let blocos = "";
  for(let i = 0; i < total; i++) blocos += `<i class="${i < feitos ? "ok" : ""}"></i>`;
  return `<div class="bar" id="barra">${blocos}</div>`;
}
/* O raio da sequência só aparece a partir do segundo acerto seguido, que é
   quando o bônus começa de fato. Fica no canto de cima da questão, perto de
   onde os olhos já estão. */
function raioHTML(){
  const n = SES && SES.seq || 0;
  if(n < 2) return "";
  return `<span class="raio" title="${n} acertos seguidos">⚡ ×${multiploDaSequencia(n).toFixed(1).replace(".", ",")}</span>`;
}
/* Relógio e aviso de ranking moram no rodapé, numa faixa fina que continua
   visível enquanto se lê a explicação — parado, para ficar claro que o tempo
   não está correndo ali. */
function barraTempoHTML(){
  if(!SES) return "";
  const parado = !!SES.pausa;
  const semRanking = SES.valeRanking === false;
  /* A ofensiva já morou aqui, preenchendo o espaço do relógio quando a bateria
     era sem tempo. A Isabela cortou, com razão: ela mede o dia, não a questão,
     e ali em cima do "❌ Quase" parecia que o erro tinha mexido nela. Ofensiva é
     assunto da tela inicial. Sem relógio e sem aviso de ranking, esta faixa
     simplesmente não existe. */
  if(!SES.fim && !semRanking) return "";
  return `<div class="tempoBar">
    ${SES.fim ? `<span class="cron ${parado ? "parado" : ""}" id="cron">⏱ ${
        mmss(Math.max(0, Math.round((SES.fim - (SES.pausa || Date.now())) / 1000)))}</span>` : ""}
    ${parado ? `<span class="tbNota">tempo parado enquanto você lê</span>` : ""}
    ${semRanking ? `<span class="semrank" title="Este recorte não pontua no ranking">sem ranking</span>` : ""}
  </div>`;
}
function render(){
  if(SES.i >= SES.fila.length) return telaFim();
  const it = SES.fila[SES.i];
  /* A barra de cima é só dos tracinhos, e a razão é aritmética: com o relógio,
     o aviso de "sem ranking" e o raio da sequência disputando a mesma linha,
     sobravam uns 90 pixels para dez tracinhos — que viravam risquinhos verticais
     impossíveis de contar. Saber que faltam dois é a única coisa que essa barra
     precisa dizer, então ela ficou com a linha inteira.
     O relógio desceu para o rodapé e o raio foi para o canto da questão. */
  montarTela('<div class="q" id="q"></div>', {
    topo: `<div class="topbar">
             <button class="xbtn" id="sair">✕</button>
             ${(SES.log && SES.log.length) ? `<button class="xbtn" id="voltarQ" title="Rever as questões que já passaram" aria-label="Rever as questões anteriores">‹</button>` : ""}
             ${barraHTML()}
           </div>`,
    rodape: barraTempoHTML(), comNav:false });
  $("#sair").onclick = () => caixaConfirma("Sair da bateria?",
    "O que você já respondeu fica salvo — as questões que sobraram voltam na próxima vez.",
    "Sair", () => { pararRelogio(); aba = "inicio"; telaInicio(); });
  const bv = $("#voltarQ"); if(bv) bv.onclick = () => telaRever(SES.log.length - 1);
  SES.respondido = false;
  if(SES.fim) tocarRelogio();
  const desenhar = { vf:rVF, mcq:rMCQ, multi:rMulti, escrita:rEscrita, cloze:rCloze,
                     ordem:rOrdem, relacionar:rRel, discursiva:rDiscursiva, vfjust:rVFJust }[it.t];
  if(!desenhar){
    /* Tipo que este app ainda não sabe desenhar — banco novo em programa velho.
       Melhor dizer isso e seguir do que quebrar a bateria inteira. */
    $("#q").innerHTML = cabecalho(it, enunciadoDe(it) || "Exercício")
      + `<p class="dica">Este exercício é de um tipo que esta versão do app ainda não abre.
         Atualize o app (feche e abra de novo) para respondê-lo.</p>`;
    $(".foot").innerHTML = `<button class="btn" id="pula">Pular</button>`;
    $("#pula").onclick = () => { SES.i++; render(); };
    return;
  }
  desenhar(it);
  ligarImagensDaQuestao();
  const bt = $("#btInfo");
  if(bt) bt.onclick = () => {
    const cx = $("#boxFonte");
    cx.classList.toggle("hide");
    bt.classList.toggle("on", !cx.classList.contains("hide"));
    ligarCue();
  };
  ligarCue();
}

const ROTULO_FONTE = {
  simulado:"📄 Questão de prova antiga",
  guia:"📋 Guia de estudos da professora",
  dirigido:"📝 Estudo dirigido da monitoria",
  lista:"📚 Lista de questões da professora",
  aula:"🖥️ Slide da aula",
  audio:"🎧 Áudio da revisão da professora",
  elaborada:"✍️ Elaborada a partir do material",
  corrigido:"✅ Resposta sua, com visto da professora",
  livro:"📖 Livro-texto, conferido na bibliografia"
};
function blocoFonte(it){
  const f = it.fonte;
  if(!f) return "";
  if(typeof f === "string")
    return `<div class="fonte hide" id="boxFonte"><b class="rot">Origem</b><p>${esc(f)}</p></div>`;
  return `<div class="fonte hide" id="boxFonte">
      <b class="rot">${ROTULO_FONTE[f.t] || "Origem"}</b>
      ${f.ref ? `<div class="ref">${esc(f.ref)}</div>` : ""}
      ${f.txt ? `<p>${f.txt}</p>` : ""}
    </div>`;
}
function cabecalho(it, titulo){
  const d = discPorId[it.disc];
  return `<div class="qhead">
      <div class="qtag">${TITULO_TIPO[it.t]}${d ? " · " + esc(d.nome) : ""}</div>
      <span class="raiobox">${raioHTML()}</span>
      ${it.fonte ? `<button class="info" id="btInfo" title="De onde veio esta questão" aria-label="De onde veio esta questão">i</button>` : ""}
    </div>
    ${imagemDaQuestao(it)}
    <div class="qtitle">${esc(titulo)}</div>
    ${blocoFonte(it)}`;
}
/* Lâmina de histologia, foto de equipamento, ECG — qualquer questão pode ter
   uma imagem. Fica entre a tag e o enunciado, igual o caso clínico (apoio).
   Toque abre em tamanho cheio, pra dar pra ver detalhe de verdade. */
function imagemDaQuestao(it){
  if(!it.imagem) return "";
  return `<button class="qImgBtn" data-ver-imagem="${esc(it.imagem)}" aria-label="Ver imagem em tamanho cheio">
    <img src="${esc(it.imagem)}" alt="${esc(it.imagemAlt || "Imagem da questão")}" class="qImg" loading="lazy"></button>`;
}
function ligarImagensDaQuestao(){
  document.querySelectorAll("[data-ver-imagem]").forEach(b => b.onclick = () => {
    abrirCaixa(`<img src="${esc(b.dataset.verImagem)}" style="width:100%;border-radius:10px;display:block">`,
      "", "", "caixaImagem");
  });
}
function pedirVerificar(fn, ativo){
  $(".foot").innerHTML = barraTempoHTML()
    + `<button class="btn" id="ver" ${ativo?"":"disabled"}>Verificar</button>`;
  $("#ver").onclick = fn;
}
function atualizaVerificar(ativo){ const b = $("#ver"); if(b) b.disabled = !ativo; ligarCue(); }

function concluir(it, acertou, textoExtra){
  if(SES.respondido) return;
  SES.respondido = true;
  if(!SES.vistos) SES.vistos = [];
  virarODia();
  let ganho = 0;
  try{
    ganho = registrar(it.id, acertou);
  }catch(e){
    console.error("Erro ao registrar progresso:", e);
  }
  const primeiraVez = !SES.vistos.includes(it.id);   // repetição do erro não conta como acerto de primeira
  if(primeiraVez) SES.vistos.push(it.id);
  if(acertou && primeiraVez) SES.acertos++;
  /* Numa prova antiga, a objetiva é 0 ou o valor cheio. A discursiva já gravou
     a nota dela antes de chegar aqui, então só grava quem ainda não gravou. */
  if(SES.prova){
    const f = (S.provasFeitas || {})[SES.prova.id];
    if(!f || !f.respostas || !f.respostas[it.id])
      guardarRespostaDeProva(it, acertou ? valorDaQuestao(it) : 0, {});
  }
  S.feitosHoje++;
  S.historico[hoje()] = (S.historico[hoje()] || 0) + 1;
  /* O histórico sobe primeiro: é dele que a ofensiva é contada. */
  arrumarOfensiva(S);
  /* O andamento do desafio fica guardado a cada resposta: quem fechar o app no
     meio volta com os acertos que já tinha e o tempo que sobrou. */
  if(SES.desafio) S.desafioEmCurso = { id:SES.desafio.id, fim:SES.fim, acertos:SES.acertos,
    feitas:SES.vistos.slice(), seq:SES.seq || 0, xpDaSeq:SES.xpDaSeq || 0,
    maiorSeq:SES.maiorSeq || 0, xpGanho:SES.xpGanho || 0 };
  salvar();

  const exp = textoExtra || it.exp || it.just || "";
  if(!SES.log) SES.log = [];
  SES.log.push({ id: it.id, acertou, exp });     // guarda para a pessoa poder reler depois
  pausarRelogio();                       // agora é hora de ler, não de correr
  rodapeFeedback(it, acertou, exp, null, ganho);
  const barra = $("#barra");
  if(barra) barra.outerHTML = barraHTML();
  const cx = document.querySelector(".raiobox");
  if(cx) cx.innerHTML = raioHTML();      // a sequência pode ter crescido ou zerado
}

/* ---------- rodapé de feedback e reporte de problema ---------- */
function avancar(it, acertou){
  /* A questão errada NÃO volta no fim da mesma bateria.

     Ela voltava, e isso era herança de quando a sessão não tinha tamanho fixo.
     Com a bateria de dez, criava três problemas que a Isabela viu de uma vez:
     a sessão passava de dez sem aviso, a barra continuava com dez tracinhos, e
     a sequência de acertos engordava com repetições — dava para errar quatro,
     acertar as mesmas quatro logo depois e sair com "7 seguidas" tendo acertado
     6 de 10 de primeira. Os números não se contradiziam por engano de conta:
     contavam coisas diferentes, e a tela não dizia isso.

     Além do mais, repetir a mesma questão três minutos depois de ler a resposta
     testa memória curta, que é justamente o que este app existe para não fazer.
     Quem errou já sai com a caixa zerada e volta a ver a questão amanhã.

     Se um dia fizer falta, é esta linha que volta:
       if(!acertou && SES.fila.filter(x => x.id === it.id).length < 2) SES.fila.push(it); */
  SES.i++;
  voltarRelogio();
  render();
}
/* Qual exercício do BANCO esta questão é. Numa prova antiga, as objetivas são
   exercícios que já existem no banco, com o id prefixado pelo id da prova — e é
   o exercício original que a marca "revisar sempre" precisa pegar, porque é ele
   que volta nas baterias. A discursiva não tem original: ela só existe dentro
   da prova, e por isso não pode ser marcada. */
function idNoBanco(it){
  if(!it) return null;
  if(porId[it.id]) return it.id;
  if(it.ref && porId[it.ref]) return it.ref;
  const corte = String(it.id).indexOf("__");
  if(corte > 0){
    const base = String(it.id).slice(corte + 2);
    if(porId[base]) return base;
  }
  return null;
}

function rodapeFeedback(it, acertou, exp, aviso, ganho){
  const jaReportou = (S.reportes || []).some(r => r.id === it.id);
  const seq = SES ? (SES.seq || 0) : 0;
  const naProva = !!(SES && SES.prova);
  /* Numa prova antiga não existe XP, então não existe selo de XP. E na
     discursiva não existe "Isso aí" nem "Quase": a nota e o que faltou já estão
     escritos na correção, logo acima. Repetir um veredito de acertou/errou aqui
     embaixo, numa questão que quase sempre é parcial, só confundiria. */
  const selo = (ganho == null || naProva) ? "" : `<span class="xpg">+${ganho} XP${
    seq >= 2 ? ` <b>⚡ ${seq} seguidas</b>` : ""}</span>`;
  const semVeredito = naProva && (it.t === "discursiva" || it.t === "vfjust");
  const idBanco = naProva ? idNoBanco(it) : it.id;
  $(".foot").innerHTML = `
    ${barraTempoHTML()}
    ${semVeredito ? "" : (aviso ? `<div class="fb good"><p>${aviso}</p></div>` : `
    <div class="fb ${acertou?"good":"bad"}">
      <h3>${acertou ? "✅ Isso aí!" : "❌ Quase"}${selo}</h3>
      ${exp ? `<p>${exp}</p>` : ""}
      ${(!acertou && ganho != null && !naProva && SES && SES.perdeuSeq)
        ? `<p class="perdeu">A sequência de ${SES.perdeuSeq} zerou.</p>` : ""}
    </div>`)}
    ${idBanco ? `<label class="revisar ${marcada(idBanco) ? "on" : ""}" id="lbRev">
      <input type="checkbox" id="ckRev" ${marcada(idBanco) ? "checked" : ""}>
      <span class="cx">${marcada(idBanco) ? "✓" : ""}</span>
      <span class="tx"><b>Revisar sempre</b><span id="txRev">${marcada(idBanco)
        ? "volta a cada " + plural(TETO_MARCADA, "dia", "dias") + ", mesmo acertando"
        : "questão de prova, ou que você sabe que precisa rever"}</span></span>
    </label>` : ""}
    <div class="acoes">
      <button class="btn ${acertou?"":"danger"}" id="prox">Continuar</button>
      <button class="flag ${jaReportou?"neutra":""}" id="btRep"
        title="${jaReportou ? "Você já reportou esta questão" : "Reportar um problema nesta questão"}"
        aria-label="Reportar problema nesta questão">${jaReportou ? "✓" : "🚩"}</button>
    </div>`;
  ligarCue();
  $("#prox").onclick = () => avancar(it, acertou);
  $("#btRep").onclick = () => painelReporte(it, acertou, exp);
  const ck = $("#ckRev");
  if(ck) ck.onchange = () => {
    const on = marcar(idBanco, ck.checked);
    $("#lbRev").classList.toggle("on", on);
    $("#lbRev").querySelector(".cx").textContent = on ? "✓" : "";
    $("#txRev").textContent = on
      ? "volta a cada " + plural(TETO_MARCADA, "dia", "dias") + ", mesmo acertando"
      : "questão de prova, ou que você sabe que precisa rever";
  };
}

const MOTIVOS = [
  ["gabarito", "A resposta dada como certa está errada"],
  ["erro",     "Tem um erro no conteúdo da questão"],
  ["ambigua",  "Está confusa ou tem mais de uma resposta possível"],
  ["fonte",    "Não bate com o que a professora ensinou"],
  ["ofensiva", "É ofensiva ou inadequada"],
  ["outro",    "Outro motivo"]
];
function painelReporte(it, acertou, exp){
  let motivo = null;
  $(".foot").innerHTML = `
    <div class="rep">
      <h3>🚩 O que houve com esta questão?</h3>
      ${MOTIVOS.map(m => `<button class="mot" data-m="${m[0]}">${m[1]}</button>`).join("")}
      <textarea id="obs" rows="2" placeholder="Quer explicar melhor? (opcional)"></textarea>
    </div>
    <div class="acoes">
      <button class="btn danger" id="enviarRep" disabled>Enviar</button>
      <button class="flag neutra" id="cancelRep" aria-label="Cancelar">✕</button>
    </div>`;
  ligarCue();
  document.querySelectorAll(".mot").forEach(b => b.onclick = () => {
    document.querySelectorAll(".mot").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); motivo = b.dataset.m;
    $("#enviarRep").disabled = false;
  });
  $("#cancelRep").onclick = () => rodapeFeedback(it, acertou, exp);
  $("#enviarRep").onclick = () => {
    if(!motivo) return;
    const obs = ($("#obs").value || "").trim().slice(0, 500);
    S.reportes = (S.reportes || []).filter(r => r.id !== it.id);
    S.reportes.push({ id: it.id, disc: it.disc, prova: it.prova, tipo: it.t,
      motivo, obs, quando: hoje() });
    salvar();
    publicarReporte(it, motivo, obs);
    rodapeFeedback(it, acertou, exp,
      "🚩 Anotado, obrigada. A organizadora do grupo já recebe isso do lado dela.");
  };
}
/* Publica o reporte no grupo (regra 5 — relatório de bandeira de verdade).
   Antes, o reporte só existia no aparelho de quem clicou, guardado em
   `S.reportes` — a Isabela nunca via nada sem a pessoa lembrar de exportar e
   mandar manualmente. Agora todo reporte também vai para
   `grupos/{grupo}/reportes`, e a organizadora vê tudo em #organizar. Melhor
   esforço: se falhar (sem rede, sem grupo), o reporte continua salvo local
   em `S.reportes` normalmente — não trava a experiência de quem reportou. */
async function publicarReporte(it, motivo, obs){
  if(!N.ligado || !N.usuario || !N.grupo) return;
  try{
    await N.api.addDoc(cole("grupos", N.grupo, "reportes"), {
      questaoId: it.id, disc: it.disc || null, prova: it.prova || null, tipo: it.t || null,
      motivo, obs: obs || "",
      nomeDe: (S.apelido || "").trim() || (N.usuario.displayName || "").trim() || "alguém",
      uid: N.usuario.uid, lido:false, quando: hoje(),
      criadoEm: N.api.serverTimestamp(), criadoEmMs: Date.now()
    });
  }catch(e){ /* sem rede ou sem permissão: fica só local, tenta de novo não é crítico aqui */ }
}

/* ---------- 1. Verdadeiro ou falso ---------- */
function rVF(it){
  if(it.itens && it.itens.length) return rVFBloco(it);
  $("#q").innerHTML = cabecalho(it, "A afirmação é verdadeira ou falsa?") +
    `<div class="stem">${esc(it.frase)}</div>
     <div class="vfgrid">
       <button class="opt" data-v="1"><span>Verdadeiro</span></button>
       <button class="opt" data-v="0"><span>Falso</span></button>
     </div>`;
  $(".foot").innerHTML = barraTempoHTML();   // V/F responde no toque: rodapé é só o relógio
  document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
    if(SES.respondido) return;
    const resp = b.dataset.v === "1", acertou = resp === it.correta;
    document.querySelectorAll("[data-v]").forEach(x => {
      if((x.dataset.v === "1") === it.correta) x.classList.add("ok");
      else if(x === b) x.classList.add("no");
    });
    concluir(it, acertou, (it.correta ? "<b>Verdadeiro.</b> " : "<b>Falso.</b> ") + esc(it.just));
  });
}

/* ---------- 1b. Verdadeiro ou falso — bloco de várias afirmações ----------

   Pedido novo: uma questão de prova pode trazer várias afirmações V/F sob o
   MESMO número — "questão 09, dez afirmações, 1 ponto cada" — e não dez
   questões soltas. `it.itens` é a lista de afirmações (`{frase, correta,
   just}` cada uma), e a questão continua sendo uma só no banco.

   A nota é parcial, item por item — é a reprodução fiel de como a prova de
   papel pontua ("cada afirmação vale X"). Por isso esta tela não responde no
   toque como a V/F simples: junta as respostas de todas as afirmações e só
   fecha quando a pessoa tocar em "Verificar", com todas respondidas. */
function rVFBloco(it){
  const val = valorDaQuestao(it);
  const n = it.itens.length;
  const porItem = Math.round((val / n) * 100) / 100;
  const resp = new Array(n).fill(null);
  $("#q").innerHTML = cabecalho(it, it.enunciado || "Julgue cada afirmação como verdadeira ou falsa.") +
    `<p class="dica">Vale ${plural(val, "ponto", "pontos")} — ${plural(porItem, "ponto", "pontos")} por afirmação certa.</p>
     <div class="vfbloco">${it.itens.map((s, k) => `
       <div class="vfitem" data-item="${k}">
         <div class="stem"><b>${k + 1}.</b> ${esc(s.frase)}</div>
         <div class="vfgrid">
           <button class="opt" data-item="${k}" data-v="1"><span>Verdadeiro</span></button>
           <button class="opt" data-item="${k}" data-v="0"><span>Falso</span></button>
         </div>
       </div>`).join("")}</div>`;
  pedirVerificar(() => {
    if(SES.respondido) return;
    if(resp.some(r => r === null)) return;
    document.querySelectorAll(".vfitem [data-v]").forEach(b => b.disabled = true);
    let acertos = 0;
    it.itens.forEach((s, k) => {
      const certo = resp[k] === s.correta;
      if(certo) acertos++;
      document.querySelectorAll(`.vfitem[data-item="${k}"] [data-v]`).forEach(x => {
        const ehVerdadeiro = x.dataset.v === "1";
        if(ehVerdadeiro === s.correta) x.classList.add("ok");
        else if(ehVerdadeiro === resp[k]) x.classList.add("no");
      });
    });
    const nota = Math.round((acertos / n) * val * 100) / 100;
    guardarRespostaDeProva(it, nota, { itens: resp });
    const texto = `Você acertou ${acertos} de ${n} afirmações — ${nota} de ${val} pontos.<br><br>` +
      it.itens.map((s, k) => `${resp[k] === s.correta ? "✅" : "❌"} <b>${
        s.correta ? "Verdadeiro." : "Falso."}</b> ${esc(s.just || "")}`).join("<br><br>");
    concluir(it, acertos === n, texto);
  }, false);
  document.querySelectorAll(".vfitem [data-v]").forEach(b => b.onclick = () => {
    if(SES.respondido) return;
    const k = +b.dataset.item;
    resp[k] = b.dataset.v === "1";
    document.querySelectorAll(`.vfitem[data-item="${k}"] [data-v]`).forEach(x => x.classList.toggle("sel", x === b));
    atualizaVerificar(resp.every(r => r !== null));
  });
}

/* ---------- 1c. Verdadeiro ou falso — com justificativa quando Falso ----------

   Pedido novo (prova de Fisiologia, 2026-08-23): a prova de papel cobrava, em
   cada afirmação marcada Falsa, uma justificativa escrita — não bastava
   acertar "F", tinha que explicar por quê. `it.itens` tem o mesmo formato do
   vf-bloco ({frase, correta, just} cada), a diferença é o que acontece
   quando alguém marca "Falso": aparece uma caixa de texto para justificar.

   A nota não é calculada aqui no cliente item a item, feito o vf-bloco — vai
   inteira para a correção da IA, exatamente como a discursiva. O texto que
   junta a escolha (V/F) e a justificativa de cada afirmação vira "a
   resposta", e as mesmas três funções que já existiam (pedirCorrecao,
   mostrarCorrecaoDoClaude, mostrarSemCorrecao) corrigem sem precisar de
   nenhuma mudança nelas — elas só olham it.id, it.gab e valorDaQuestao(it),
   nunca it.t. É o mesmo truque de reaproveitamento usado para o vf-bloco. */
function rVFJust(it){
  const val = valorDaQuestao(it);
  const n = it.itens.length;
  const resp = new Array(n).fill(null);
  $("#q").innerHTML = cabecalho(it, it.enunciado || "Julgue cada afirmação. Se marcar Falso, justifique.") +
    `<p class="dica">Vale ${plural(val, "ponto", "pontos")}. Toda afirmação marcada Falso precisa de justificativa.</p>
     <div class="vfbloco">${it.itens.map((s, k) => `
       <div class="vfitem" data-item="${k}">
         <div class="stem"><b>${k + 1}.</b> ${esc(s.frase)}</div>
         <div class="vfgrid">
           <button class="opt" data-item="${k}" data-v="1"><span>Verdadeiro</span></button>
           <button class="opt" data-item="${k}" data-v="0"><span>Falso</span></button>
         </div>
         <div class="justBox hide" id="justBox${k}">
           <textarea class="resposta alta" id="txtJust${k}" rows="3"
             placeholder="Por que esta afirmação é falsa?"
             aria-label="Justificativa da afirmação ${k + 1}"></textarea>
         </div>
       </div>`).join("")}</div>
     <p class="pista" id="contaLetras">0 caracteres de justificativa</p>
     <div id="correcao"></div>`;
  const justCampo = k => $("#txtJust" + k);
  const pronto = () => resp.every(r => r !== null)
    && resp.every((r, k) => r !== false || justCampo(k).value.trim().length >= 5);
  const atualizaContagem = () => {
    const total = it.itens.reduce((soma, s, k) => soma + (resp[k] === false ? justCampo(k).value.trim().length : 0), 0);
    $("#contaLetras").textContent = total + " caracteres de justificativa";
  };
  document.querySelectorAll(".vfitem [data-v]").forEach(b => b.onclick = () => {
    if(SES.respondido) return;
    const k = +b.dataset.item;
    resp[k] = b.dataset.v === "1";
    document.querySelectorAll(`.vfitem[data-item="${k}"] [data-v]`).forEach(x => x.classList.toggle("sel", x === b));
    $("#justBox" + k).classList.toggle("hide", resp[k] !== false);
    if(resp[k] !== false) justCampo(k).value = "";
    atualizaContagem();
    atualizaVerificar(pronto());
  });
  it.itens.forEach((s, k) => { justCampo(k).oninput = () => { atualizaContagem(); atualizaVerificar(pronto()); }; });
  pedirVerificar(async () => {
    if(SES.respondido) return;
    if(!pronto()) return;
    document.querySelectorAll(".vfitem [data-v]").forEach(b => b.disabled = true);
    document.querySelectorAll(".vfitem textarea").forEach(t => t.disabled = true);
    const texto = it.itens.map((s, k) =>
      `${k + 1}. ${s.frase}\nMinha resposta: ${resp[k] ? "Verdadeiro" : "Falso"}` +
      (resp[k] === false ? `\nMinha justificativa: ${justCampo(k).value.trim()}` : "")
    ).join("\n\n");
    $(".foot").innerHTML = barraTempoHTML() + `<button class="btn" disabled>Corrigindo…</button>`;
    let c = null, porque = "Este aparelho está sem conexão com o grupo, então não deu para corrigir agora.";
    if(correcaoLigada()){
      c = await pedirCorrecao(it, texto);
      if(!c) porque = N.erroCorrecao
        || "Não deu para falar com a correção agora. Pode ser a internet, ou o limite de correções do dia.";
    }
    if(c) mostrarCorrecaoDoClaude(it, texto, c);
    else  mostrarSemCorrecao(it, texto, porque);
  }, false);
}

/* ---------- 2. Múltipla escolha ---------- */
/* linha de alternativa: o botão da opção + o ✕ que risca o que a pessoa já descartou */
function linhaOpcao(idx, letra, txt){
  return `<div class="optrow">
      <button class="opt" data-i="${idx}"><span class="k">${letra}</span><span>${esc(txt)}</span></button>
      <button class="risca" data-r="${idx}" title="Riscar esta alternativa" aria-label="Riscar esta alternativa">✕</button>
    </div>`;
}
function ligarRiscar(aoRiscar){
  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    if(SES.respondido) return;
    const i = +b.dataset.r;
    const alvo = document.querySelector(`.opt[data-i="${i}"]`);
    const agora = !alvo.classList.contains("riscada");
    alvo.classList.toggle("riscada", agora);
    b.classList.toggle("on", agora);
    if(agora && alvo.classList.contains("sel")) aoRiscar(i, alvo);   // riscar o que estava marcado desmarca
  });
}
function travarRiscar(){ document.querySelectorAll("[data-r]").forEach(b => b.disabled = true); }

function rMCQ(it){
  const ordem = embaralhar(it.opcoes.map((o,i) => ({o, i})));
  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    ordem.map((x, n) => linhaOpcao(x.i, "ABCDE"[n], x.o)).join("");
  let sel = null;
  pedirVerificar(() => {
    if(sel === null) return;
    travarRiscar();
    document.querySelectorAll(".opt[data-i]").forEach(x => {
      if(+x.dataset.i === it.correta) x.classList.add("ok");
      else if(+x.dataset.i === sel) x.classList.add("no");
      x.classList.remove("sel");
    });
    concluir(it, sel === it.correta, `<b>Resposta: ${esc(it.opcoes[it.correta])}</b><br>${esc(it.exp)}`);
  }, false);
  document.querySelectorAll(".opt[data-i]").forEach(b => b.onclick = () => {
    if(SES.respondido) return;
    document.querySelectorAll(".opt[data-i]").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel"); sel = +b.dataset.i; atualizaVerificar(true);
  });
  ligarRiscar((i, alvo) => { alvo.classList.remove("sel"); sel = null; atualizaVerificar(false); });
}

/* ---------- 2b. Marque todas as corretas ---------- */
function rMulti(it){
  const ordem = embaralhar(it.opcoes.map((o,i) => ({o, i})));
  const gab = new Set(it.corretas);
  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<p class="dica">Pode haver mais de uma certa — marque todas.</p>` +
    ordem.map((x, n) => linhaOpcao(x.i, "ABCDE"[n], x.o)).join("");
  const sel = new Set();
  pedirVerificar(() => {
    if(!sel.size) return;
    travarRiscar();
    document.querySelectorAll(".opt[data-i]").forEach(x => {
      const i = +x.dataset.i;
      x.classList.remove("sel");
      if(gab.has(i)) x.classList.add("ok");            // toda correta fica verde, marcada ou não
      else if(sel.has(i)) x.classList.add("no");       // marcou uma errada
    });
    const acertou = sel.size === gab.size && [...sel].every(i => gab.has(i));
    const listaOk = it.corretas.map(i => "• " + esc(it.opcoes[i])).join("<br>");
    concluir(it, acertou, `<b>${it.corretas.length > 1 ? "Corretas:" : "Correta:"}</b><br>${listaOk}<br>${esc(it.exp)}`);
  }, false);
  document.querySelectorAll(".opt[data-i]").forEach(b => b.onclick = () => {
    if(SES.respondido) return;
    const i = +b.dataset.i;
    if(sel.has(i)){ sel.delete(i); b.classList.remove("sel"); }
    else{
      sel.add(i); b.classList.add("sel");
      b.classList.remove("riscada");                   // marcar desfaz o risco
      const x = document.querySelector(`.risca[data-r="${i}"]`); if(x) x.classList.remove("on");
    }
    atualizaVerificar(sel.size > 0);
  });
  ligarRiscar((i, alvo) => { alvo.classList.remove("sel"); sel.delete(i); atualizaVerificar(sel.size > 0); });
}

/* ---------- 2c. Escrever a resposta ----------
   Comparação tolerante de propósito: a pessoa está treinando o conteúdo, não a ortografia.
   Ignora maiúscula, acento, pontuação e espaço sobrando; aceita as variantes de `aceita`;
   e perdoa UMA letra trocada, faltando ou sobrando em palavras de 6 letras ou mais —
   mas nesse caso mostra a grafia certa, para não fixar o erro. */
function normaliza(t){
  return String(t == null ? "" : t)
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")   // tira acento
    .replace(/[^a-z0-9\s]/g, " ")                       // hífen, ponto, aspas viram espaço
    .replace(/\s+/g, " ").trim()
    // "a adenosina", "o epitálamo", "no epitálamo" valem tanto quanto a palavra sozinha
    .replace(/^(?:o|a|os|as|um|uma|no|na|nos|nas|do|da|dos|das|de|em|pelo|pela)\s+/, "")
    .trim();
}
function distancia(a, b){            // Levenshtein, só até o que precisamos
  if(a === b) return 0;
  if(Math.abs(a.length - b.length) > 1) return 2;
  const m = a.length, k = b.length;
  let linha = new Array(k + 1);
  for(let j = 0; j <= k; j++) linha[j] = j;
  for(let i = 1; i <= m; i++){
    let ant = linha[0]; linha[0] = i;
    for(let j = 1; j <= k; j++){
      const tmp = linha[j];
      linha[j] = Math.min(linha[j] + 1, linha[j-1] + 1, ant + (a[i-1] === b[j-1] ? 0 : 1));
      ant = tmp;
    }
  }
  return linha[k];
}
function conferirEscrita(it, digitado){
  const d = normaliza(digitado);
  if(!d) return { certo:false, quase:false };
  const alvos = [it.resp].concat(it.aceita || []).map(normaliza);
  if(alvos.includes(d)) return { certo:true, quase:false };
  for(const a of alvos){
    if(a.length >= 6 && distancia(d, a) === 1) return { certo:true, quase:true };
  }
  return { certo:false, quase:false };
}

/* ---------- 2c. Escrever a resposta — em 3 estágios ----------
   Regra 7 (progressão de dificuldade): a primeira vez que a pessoa vê uma
   questão de identificação, ela reconhece entre alternativas; depois de
   acertar, completa só a primeira palavra; depois de acertar de novo,
   escreve tudo de cabeça. O estágio mora em `S.prog[it.id].estagio` (ver
   `registrar`) — sem precisar de nenhum campo novo no banco de questões:
   os distratores do estágio 1 vêm de outras respostas do mesmo assunto, e a
   lacuna do estágio 2 é sempre a primeira palavra, por convenção. */
function estagioDe(it){
  const p = S.prog[it.id];
  return (p && p.estagio) || 1;
}
function distratoresEscrita(it, n){
  const doTopico = (CURSO.itens || []).filter(x =>
    x.t === "escrita" && x.top === it.top && x.id !== it.id && (x.resp || "") !== (it.resp || ""));
  let pool = doTopico;
  if(pool.length < n){
    const daDisc = (CURSO.itens || []).filter(x =>
      x.t === "escrita" && x.disc === it.disc && x.top !== it.top && x.id !== it.id);
    pool = pool.concat(daDisc);
  }
  return embaralhar(pool).slice(0, n).map(x => x.resp);
}
function partirPrimeiraPalavra(resp){
  const s = (resp || "").trim();
  const i = s.indexOf(" ");
  return i < 0 ? { primeira:s, resto:"" } : { primeira:s.slice(0, i), resto:s.slice(i + 1) };
}

function rEscrita(it){
  const estagio = estagioDe(it);
  if(estagio <= 1) return rEscritaEscolha(it);
  if(estagio === 2) return rEscritaLacuna(it);
  return rEscritaLivre(it);
}

/* Estágio 1: múltipla escolha — igual à MCQ comum, mas montada na hora com
   distratores tirados de outras respostas do banco. Se o assunto não tiver
   respostas suficientes pra formar 4 opções, cai direto pro estágio 3
   (digitação livre) — melhor isso do que uma múltipla escolha capenga com
   duas alternativas só. */
function rEscritaEscolha(it){
  const distratores = distratoresEscrita(it, 3);
  if(distratores.length < 2) return rEscritaLivre(it);
  const opcoes = embaralhar([it.resp, ...distratores]);
  const certa = opcoes.indexOf(it.resp);
  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<p class="dica">Primeira vez vendo esta questão — reconheça entre as opções.</p>` +
    opcoes.map((o, n) => linhaOpcao(n, "ABCD"[n], o)).join("");
  let sel = null;
  pedirVerificar(() => {
    if(sel === null) return;
    travarRiscar();
    document.querySelectorAll(".opt[data-i]").forEach(x => {
      if(+x.dataset.i === certa) x.classList.add("ok");
      else if(+x.dataset.i === sel) x.classList.add("no");
      x.classList.remove("sel");
    });
    concluir(it, sel === certa, `<b>Resposta: ${esc(it.resp)}</b><br>${esc(it.exp)}`);
  }, false);
  document.querySelectorAll(".opt[data-i]").forEach(b => b.onclick = () => {
    if(SES.respondido) return;
    document.querySelectorAll(".opt[data-i]").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel"); sel = +b.dataset.i; atualizaVerificar(true);
  });
  ligarRiscar((i, alvo) => { alvo.classList.remove("sel"); sel = null; atualizaVerificar(false); });
}

/* Estágio 2: a resposta aparece quase inteira, só falta a primeira palavra —
   convenção simples, sem precisar marcar no banco qual pedaço é a lacuna. Se
   a resposta for uma palavra só, não tem o que lacunar parcialmente: cai
   direto pro estágio 3. */
function rEscritaLacuna(it){
  const { primeira, resto } = partirPrimeiraPalavra(it.resp);
  if(!resto) return rEscritaLivre(it);
  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<p class="dica">Você já reconheceu essa — agora complete a primeira palavra.</p>
     <p class="pista" style="font-size:16px;font-weight:800">___ ${esc(resto)}</p>
     <input class="resposta" id="txtResp" type="text" inputmode="text"
       autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
       placeholder="digite a palavra que falta" aria-label="Sua resposta">`;
  const campo = $("#txtResp");
  const responder = () => {
    if(SES.respondido) return;
    if(!campo.value.trim()) return;
    const r = conferirEscrita({ resp:primeira, aceita:[] }, campo.value);
    campo.disabled = true;
    campo.classList.add(r.certo ? "ok" : "no");
    const grafia = r.quase
      ? `<b>Quase na grafia — o certo é «${esc(it.resp)}».</b> Vou contar como acerto.<br>`
      : (r.certo ? "" : `<b>Resposta: ${esc(it.resp)}</b><br>`);
    concluir(it, r.certo, grafia + esc(it.exp));
  };
  pedirVerificar(responder, false);
  campo.oninput = () => atualizaVerificar(!!campo.value.trim());
  campo.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); responder(); } };
  setTimeout(() => { try{ campo.focus({ preventScroll:true }); }catch(e){ campo.focus(); } }, 60);
}

/* Estágio 3 (e comportamento de sempre pra quem não tem progressão aplicável):
   digitação livre da resposta inteira, de cabeça. */
function rEscritaLivre(it){
  /* "Uma palavra basta" só é verdade quando a resposta certa É uma palavra
     só — "vitamina K" e "tromboxano A2" têm duas, e prometer isso enganava
     quem via a dica e escrevia só metade da resposta. */
  const palavras = (it.resp || "").trim().split(/\s+/).filter(Boolean).length;
  const dica = palavras <= 1 ? "Escreva a resposta — uma palavra basta." : "Escreva a resposta.";
  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<p class="dica">${dica}</p>
     <input class="resposta" id="txtResp" type="text" inputmode="text"
       autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
       placeholder="digite aqui" aria-label="Sua resposta">
     ${it.pista ? `<p class="pista">💡 ${esc(it.pista)}</p>` : ""}`;
  const campo = $("#txtResp");
  const responder = () => {
    if(SES.respondido) return;
    const r = conferirEscrita(it, campo.value);
    if(!campo.value.trim()) return;
    campo.disabled = true;
    campo.classList.add(r.certo ? "ok" : "no");
    const grafia = r.quase
      ? `<b>Quase na grafia — o certo é «${esc(it.resp)}».</b> Vou contar como acerto.<br>`
      : (r.certo ? "" : `<b>Resposta: ${esc(it.resp)}</b><br>`);
    concluir(it, r.certo, grafia + esc(it.exp));
  };
  pedirVerificar(responder, false);
  campo.oninput = () => atualizaVerificar(!!campo.value.trim());
  campo.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); responder(); } };
  setTimeout(() => { try{ campo.focus({ preventScroll:true }); }catch(e){ campo.focus(); } }, 60);
}

/* ---------- 3. Completar lacunas ----------

   Duas formas de responder, e a diferença é fidelidade à prova de papel:

   - Por padrão, TOCAR num chip da lista de palavras — é o formato de sempre,
     bom para treinar reconhecimento.

   - Com `it.digitar:true`, ESCREVER cada lacuna, com a mesma tolerância de
     grafia da questão `escrita` (ignora acento/maiúscula/pontuação, perdoa
     uma letra errada em palavra de 6+). Pedido explícito da Isabela para a
     questão 05 de Farmacologia: a prova de papel pedia para ESCREVER a
     resposta na lacuna, não escolher entre alternativas — então a prova aqui
     dentro precisa cobrar a mesma coisa. Uma questão de prova que na folha
     original era de completar por extenso não pode virar múltipla escolha
     nem virar "toque no chip certo": as duas dão pista que a prova de
     verdade não dava. */
function rCloze(it){
  if(it.digitar) return rClozeDigitar(it);
  const partes = it.texto.split(/(\[\[\d+\]\])/g);
  const corpo = partes.map(p => {
    const m = p.match(/^\[\[(\d+)\]\]$/);
    return m ? `<span class="blank" data-b="${m[1]}"></span>` : esc(p);
  }).join("");

  const respostas = it.lacunas.map(l => l.resp);
  const extras = [];
  it.lacunas.forEach(l => (l.dist||[]).forEach(d => {
    if(!respostas.includes(d) && !extras.includes(d)) extras.push(d);
  }));
  const banco = embaralhar(respostas.concat(extras));

  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<div class="cloze">${corpo}</div>
     <div class="bank">${banco.map((w,i) => `<button class="chip" data-w="${i}">${esc(w)}</button>`).join("")}</div>`;

  const preenchido = new Array(it.lacunas.length).fill(null);
  const chips = [...document.querySelectorAll(".chip")];
  const blanks = [...document.querySelectorAll(".blank")];
  const completo = () => preenchido.every(x => x !== null);

  function pintar(){
    blanks.forEach((b, i) => {
      const ci = preenchido[i];
      b.textContent = ci === null ? "" : banco[ci];
      b.classList.toggle("filled", ci !== null);
    });
    chips.forEach((c, i) => c.classList.toggle("used", preenchido.includes(i)));
    atualizaVerificar(completo());
  }
  chips.forEach((c, i) => c.onclick = () => {
    if(SES.respondido) return;
    const vaga = preenchido.indexOf(null); if(vaga === -1) return;
    preenchido[vaga] = i; pintar();
  });
  blanks.forEach((b, i) => b.onclick = () => {
    if(SES.respondido) return;
    if(preenchido[i] !== null){ preenchido[i] = null; pintar(); }
  });

  pedirVerificar(() => {
    if(!completo()) return;
    let tudoOk = true;
    blanks.forEach((b, i) => {
      const dado = banco[preenchido[i]], certo = it.lacunas[i].resp;
      b.classList.remove("filled");
      if(dado === certo) b.classList.add("ok");
      else { tudoOk = false; b.classList.add("no"); b.insertAdjacentHTML("afterend", ` <span class="blank fix">${esc(certo)}</span>`); }
    });
    $(".bank").style.display = "none";
    concluir(it, tudoOk, esc(it.exp));
  }, false);
  pintar();
}

/* ---------- 3b. Completar lacunas — escrevendo ----------
   Mesmo texto com `[[n]]`, mesma lista `lacunas`, mas cada lacuna vira um
   campo de texto de verdade em vez de um chip para tocar. A correção usa
   `conferirEscrita`, a mesma função da questão `escrita` — cada `lacuna` só
   precisa dos campos que `conferirEscrita` já sabe ler (`resp`, `aceita`). */
function rClozeDigitar(it){
  let n = 0;
  const partes = it.texto.split(/(\[\[\d+\]\])/g);
  const corpo = partes.map(p => {
    const m = p.match(/^\[\[(\d+)\]\]$/);
    if(!m) return esc(p);
    const i = n++;
    return `<input class="blank blankInput" type="text" data-b="${i}"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
      aria-label="Lacuna ${i + 1}">`;
  }).join("");

  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<p class="dica">Escreva o que falta em cada lacuna.</p>
     <div class="cloze">${corpo}</div>`;

  const inputs = [...document.querySelectorAll(".blankInput")];
  const completo = () => inputs.every(inp => inp.value.trim().length > 0);
  inputs.forEach(inp => inp.oninput = () => atualizaVerificar(completo()));

  pedirVerificar(() => {
    if(SES.respondido) return;
    if(!completo()) return;
    let tudoOk = true;
    inputs.forEach((inp, i) => {
      const lac = it.lacunas[i];
      const r = conferirEscrita(lac, inp.value);
      inp.disabled = true;
      if(r.certo) inp.classList.add("ok");
      else{ tudoOk = false; inp.classList.add("no");
        inp.insertAdjacentHTML("afterend", ` <span class="blank fix">${esc(lac.resp)}</span>`); }
    });
    concluir(it, tudoOk, esc(it.exp));
  }, false);
  setTimeout(() => { try{ inputs[0].focus({ preventScroll:true }); }catch(e){} }, 60);
}

/* ---------- 4. Colocar em ordem ---------- */
function rOrdem(it){
  const baralho = embaralhar(it.seq.map((s, i) => ({s, i})));
  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<div class="slots" id="slots"></div>
     <div class="pool" id="pool">${baralho.map((x, k) => `<button class="prow" data-k="${k}">${esc(x.s)}</button>`).join("")}</div>`;

  const escolhidos = [];
  function pintar(){
    $("#slots").innerHTML = escolhidos.map((k, n) =>
      `<div class="srow" data-pos="${n}"><div class="n">${n+1}</div><div>${esc(baralho[k].s)}</div></div>`).join("");
    document.querySelectorAll("#pool .prow").forEach((b, k) => b.style.display = escolhidos.includes(k) ? "none" : "block");
    document.querySelectorAll(".srow").forEach(r => r.onclick = () => {
      if(SES.respondido) return;
      escolhidos.splice(+r.dataset.pos, 1); pintar();
    });
    atualizaVerificar(escolhidos.length === it.seq.length);
  }
  document.querySelectorAll("#pool .prow").forEach((b, k) => b.onclick = () => {
    if(SES.respondido) return;
    escolhidos.push(k); pintar();
  });

  pedirVerificar(() => {
    if(escolhidos.length !== it.seq.length) return;
    let tudoOk = true;
    escolhidos.forEach((k, n) => {
      const certo = baralho[k].i === n;
      if(!certo) tudoOk = false;
      $(`.srow[data-pos="${n}"]`).classList.add(certo ? "ok" : "no");
    });
    $("#pool").style.display = "none";
    if(!tudoOk) $("#slots").insertAdjacentHTML("afterend",
      `<div class="gab"><b style="font-size:14px">Ordem correta:</b><ol>${it.seq.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>`);
    concluir(it, tudoOk, esc(it.exp));
  }, false);
  pintar();
}

/* ---------- 5. Relacionar ---------- */
/* o gabarito do relacionar, escrito por extenso — as colunas ficam embaralhadas
   e depois de fechar tudo é difícil reler qual foi com qual */
function listaDePares(it){
  return `<div class="pares">${it.pares.map(p =>
    `<div class="par"><b>${esc(p[0])}</b><span class="seta">→</span><span>${esc(p[1])}</span></div>`).join("")}</div>`;
}
/* Formar par sobe ele pra uma área confirmada em cima — igual a "colocar em
   ordem" — e some do campo visual de baixo. Errar não avisa na hora: o par
   errado sobe do mesmo jeito, e só fica sabendo se acertou ou não quando
   tocar em Verificar. Antes isso corrigia par a par, na hora, e dava pra
   tentar de novo até acertar — a Isabela não queria esse tipo de chute. */
function rRel(it){
  const esqL = embaralhar(it.pares.map((p, i) => ({txt:p[0], i})));
  const dirL = embaralhar(it.pares.map((p, i) => ({txt:p[1], i})));
  const tot = it.pares.length;
  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<p class="dica">Toque num item da esquerda e depois no par dele à direita. Só corrige quando tocar em Verificar.</p>
     <div class="slots" id="slots"></div>
     <div class="mgrid" id="mgrid">
       <div class="mcol" id="colE"></div>
       <div class="mcol" id="colD"></div>
     </div>`;

  const formados = []; // {l, r} — índices dentro de esqL/dirL
  let selE = null;

  function pintar(){
    const usadosL = new Set(formados.map(f => f.l));
    const usadosR = new Set(formados.map(f => f.r));
    $("#slots").innerHTML = formados.map((f, n) => `
      <div class="srow" data-pos="${n}">
        <div class="n">${n + 1}</div>
        <div>${esc(esqL[f.l].txt)} ↔ ${esc(dirL[f.r].txt)}</div>
      </div>`).join("");
    $("#colE").innerHTML = esqL.map((x, k) => usadosL.has(k) ? "" :
      `<button class="mi ${selE === k ? "sel" : ""}" data-l="${k}">${esc(x.txt)}</button>`).join("");
    $("#colD").innerHTML = dirL.map((x, k) => usadosR.has(k) ? "" :
      `<button class="mi" data-r="${k}">${esc(x.txt)}</button>`).join("");
    document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => {
      if(SES.respondido) return;
      selE = +b.dataset.l; pintar();
    });
    document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
      if(SES.respondido || selE === null) return;
      formados.push({ l: selE, r: +b.dataset.r });
      selE = null; pintar();
      atualizaVerificar(formados.length === tot);
    });
    document.querySelectorAll(".srow").forEach(r => r.onclick = () => {
      if(SES.respondido) return;                    // desfaz o par: os dois voltam pra baixo
      formados.splice(+r.dataset.pos, 1); pintar();
      atualizaVerificar(formados.length === tot);
    });
  }
  pintar();

  pedirVerificar(() => {
    if(formados.length !== tot) return;
    let tudoOk = true;
    formados.forEach((f, n) => {
      /* Compara pelo TEXTO certo do lado direito, não pelo índice do par
         original — com valor repetido (duas coisas que precisam de COX-1,
         por exemplo), o índice não bate mesmo a resposta estando certa. */
      const certo = dirL[f.r].txt === it.pares[esqL[f.l].i][1];
      if(!certo) tudoOk = false;
      const el = $(`.srow[data-pos="${n}"]`);
      if(el) el.classList.add(certo ? "ok" : "no");
    });
    $("#mgrid").style.display = "none";
    concluir(it, tudoOk, listaDePares(it) + esc(it.exp));
  }, false);
}

/* ============================================================
   TELA: rever uma questão já respondida
   Só leitura: não pontua de novo nem mexe no agendamento. O objetivo é
   reler a explicação que passou rápido demais.
   ============================================================ */
function gabaritoLegivel(it){
  switch(it.t){
    case "mcq":   return `<div class="pares"><div class="par"><b>Resposta</b><span class="seta">→</span><span>${esc(it.opcoes[it.correta])}</span></div></div>`;
    case "multi": return `<div class="pares">${it.corretas.map(i =>
                    `<div class="par"><b>✓</b><span>${esc(it.opcoes[i])}</span></div>`).join("")}</div>`;
    case "vf":    return it.itens && it.itens.length
                    ? `<div class="pares">${it.itens.map((s, k) =>
                        `<div class="par"><b>${k+1}. ${s.correta ? "Verdadeiro" : "Falso"}</b><span>${esc(s.frase)}</span></div>`).join("")}</div>`
                    : `<div class="pares"><div class="par"><b>${it.correta ? "Verdadeiro" : "Falso"}</b></div></div>`;
    case "escrita": return `<div class="pares"><div class="par"><b>Resposta</b><span class="seta">→</span><span>${esc(it.resp)}</span></div></div>`;
    case "cloze": return `<div class="pares">${it.lacunas.map((l, k) =>
                    `<div class="par"><b>${k+1}</b><span class="seta">→</span><span>${esc(l.resp)}</span></div>`).join("")}</div>`;
    case "ordem": return `<div class="pares">${it.seq.map((p, k) =>
                    `<div class="par"><b>${k+1}</b><span class="seta">→</span><span>${esc(p)}</span></div>`).join("")}</div>`;
    case "relacionar": return listaDePares(it);
    case "discursiva": return (it.gab && it.gab.resposta)
                    ? `<div class="pares"><div class="par"><b>Resposta esperada</b><span class="seta">→</span><span>${esc(it.gab.resposta)}</span></div></div>` : "";
    case "vfjust": return (it.itens || []).length
                    ? `<div class="pares">${it.itens.map((s, k) =>
                        `<div class="par"><b>${k+1}. ${s.correta ? "Verdadeiro" : "Falso"}</b><span>${esc(s.frase)}</span></div>`).join("")}</div>` : "";
    default: return "";
  }
}
function telaRever(n){
  pararRelogio();
  const total = SES.log.length;
  n = Math.max(0, Math.min(total - 1, n));
  const reg = SES.log[n];
  const it = itemPorId(reg.id);
  if(!it){ render(); return; }   // não deveria acontecer, mas não trava o app se acontecer
  const titulo = it.enunciado || it.frase || "";
  const corpo = `<div class="q" id="q">
      <div class="qhead">
        <div class="qtag">Revendo · ${n + 1} de ${total}</div>
        ${it.fonte ? `<button class="info" id="btInfo" title="De onde veio esta questão" aria-label="De onde veio esta questão">i</button>` : ""}
      </div>
      <div class="qtitle">${esc(titulo)}</div>
      ${blocoFonte(it)}
      ${it.t === "cloze" ? `<p class="revtexto">${esc(it.texto.replace(/\[\[(\d+)\]\]/g, (m, k) => "___(" + (+k + 1) + ")"))}</p>` : ""}
      <div class="fb ${reg.acertou ? "good" : "bad"}" style="margin-top:14px">
        <h3>${reg.acertou ? "✅ Você acertou esta" : "❌ Esta você errou"}</h3>
      </div>
      ${gabaritoLegivel(it)}
      ${reg.exp ? `<p class="revexp">${reg.exp}</p>` : ""}
    </div>`;
  montarTela(corpo, { comNav:false,
    topo: `<div class="topbar">
             <button class="xbtn" id="fechaRev">✕</button>
             <div class="bar"><i style="width:${Math.round(100*(n+1)/total)}%"></i></div>
             <div class="cron">${n + 1}/${total}</div>
           </div>`,
    rodape: `<div class="acoes">
        <button class="btn ghost" id="revAnt" ${n === 0 ? "disabled" : ""}>‹ Anterior</button>
        <button class="btn ghost" id="revProx" ${n === total - 1 ? "disabled" : ""}>Próxima ›</button>
      </div>
      <div style="height:8px"></div>
      <button class="btn" id="revVoltar">Voltar ao exercício</button>` });
  const bt = $("#btInfo");
  if(bt) bt.onclick = () => {
    const cx = $("#boxFonte");
    cx.classList.toggle("hide");
    bt.classList.toggle("on", !cx.classList.contains("hide"));
    ligarCue();
  };
  const sair = () => { render(); };
  $("#fechaRev").onclick = sair;
  $("#revVoltar").onclick = sair;
  $("#revAnt").onclick = () => telaRever(n - 1);
  $("#revProx").onclick = () => telaRever(n + 1);
  ligarCue();
}

/* ============================================================
   TELA: fim de sessão
   ============================================================ */
function telaFim(){
  pararRelogio();
  if(SES && SES.prova) return telaProvaFim(SES.prova);
  const pc = SES.total ? Math.round(100 * SES.acertos / SES.total) : 0;
  const bateuMeta = S.feitosHoje >= S.meta;
  const respondidas = SES.vistos.length - SES.estourou;
  const segMedio = respondidas > 0 ? Math.round((Date.now() - SES.inicio) / 1000 / respondidas) : null;
  /* Bônus de tempo: só para quem acertou a sessão inteira. Rapidez com erro é
     chute, não domínio — uma questão errada apaga o bônus por completo. Duas
     faixas fixas, para dar para saber de cabeça o que se está perseguindo. */
  const semErro = SES.total > 0 && SES.acertos === SES.total;
  let bonus = 0, faixaBonus = null;
  if(SES.valeRanking !== false && !SES.estourou && semErro && segMedio != null){
    faixaBonus = BONUS_TEMPO.find(f => segMedio < f.seg) || null;
    if(faixaBonus){ bonus = faixaBonus.xp; S.xp += bonus; S.xpSemana += bonus;
                    SES.xpGanho = (SES.xpGanho || 0) + bonus; }
  }
  let novoRecorde = false;
  if(segMedio && !SES.estourou && SES.acertos === SES.total && SES.total >= 5){
    if(!S.recorde || segMedio < S.recorde){ S.recorde = segMedio; novoRecorde = true; }
  }
  /* marcos que não dá para recalcular depois: uma vez acontecidos, ficam */
  S.marcos = S.marcos || {};
  if(semErro) S.marcos.perfeitas = (S.marcos.perfeitas || 0) + 1;
  S.marcos.ofensivaMax = Math.max(S.marcos.ofensivaMax || 0, S.ofensiva || 0);
  const prox = provaMaisProxima();
  if(prox && prox.dias <= 1) S.marcos.vespera = true;
  const antesDasConquistas = S.marcos.conquistas || [];
  const agora = conquistasGanhas().map(c => c.id);
  const novasConquistas = agora.filter(id => !antesDasConquistas.includes(id));
  S.marcos.conquistas = agora;
  /* Moedas: bateria terminada (mesmo com erro) + bônus se foi tudo certo. */
  let moedasRodada = 0;
  if(SES.total > 0){
    ganharMoedas(MOEDAS_BATERIA); moedasRodada += MOEDAS_BATERIA;
    if(semErro){ ganharMoedas(MOEDAS_BATERIA_SEMERRO); moedasRodada += MOEDAS_BATERIA_SEMERRO; }
  }
  /* Moedas de conquista nova, uma vez cada. */
  if(novasConquistas.length){
    const q = novasConquistas.length * MOEDAS_CONQUISTA;
    ganharMoedas(q); moedasRodada += q;
  }
  /* Moedas de ofensiva: um múltiplo de 7 por vez, nunca repete o mesmo múltiplo.
     Cobre também quem pulou direto de 6 para 14 num dia de bateria dupla. */
  S.marcosMoedas = S.marcosMoedas || { ofensiva:0 };
  const multiploAtual = Math.floor((S.ofensiva || 0) / 7);
  if(multiploAtual > (S.marcosMoedas.ofensiva || 0)){
    const q = (multiploAtual - (S.marcosMoedas.ofensiva || 0)) * MOEDAS_OFENSIVA_7;
    ganharMoedas(q); moedasRodada += q;
    S.marcosMoedas.ofensiva = multiploAtual;
  }
  /* Vaga na liga só depois de uma bateria que vale ranking — é o que impede
     cadeira ocupada por quem não jogou. */
  if(SES.valeRanking !== false && SES.total > 0) entrarNaLiga();
  if(SES.desafio) gravarResultadoDoDesafio();
  const faltaEspera = S.proximaSessao ? Math.max(0, Math.round((S.proximaSessao - Date.now())/1000)) : 0;
  salvar();

  const corpo = `
    <div class="done">
      <div class="big">${SES.estourou ? "⏰" : pc >= 80 ? "🎉" : pc >= 50 ? "💪" : "🌱"}</div>
      <h2>${SES.estourou ? "O tempo acabou" : pc >= 80 ? "Sessão redonda!" : pc >= 50 ? "Boa, tá fixando" : "Repetição é isso aí"}</h2>
      <p>${SES.estourou
            ? plural(SES.estourou, "questão ficou sem resposta e contou como erro", "questões ficaram sem resposta e contaram como erro") + ". Elas voltam amanhã."
            : bateuMeta ? "Meta do dia batida. Volta amanhã que o app já separa o que precisa revisar."
                        : "Faltam " + (S.meta - S.feitosHoje) + " para bater a meta de hoje."}</p>
      <div class="fimGrade">
        <div><b>${SES.acertos}/${SES.total}</b><span>acertos de primeira</span></div>
        <div><b>⚡ ${SES.maiorSeq || 0}</b><span>maior sequência</span></div>
        <div><b>⭐ ${SES.xpGanho || 0}</b><span>XP nesta rodada</span></div>
        <div><b>${segMedio != null ? segMedio + "s" : "—"}</b><span>por questão</span></div>
      </div>
      ${moedasRodada ? `<p class="muted" style="margin:8px 0 0">🪙 +${moedasRodada} moedas nesta rodada · saldo: ${saldoMoedas()}</p>` : ""}
      <div>
        ${bonus ? `<span class="pill" style="color:var(--gold)">⏱ +${bonus} de bônus por velocidade —
          menos de ${faixaBonus.seg}s por questão, sem errar nenhuma</span>` : ""}
        ${(!bonus && !SES.estourou && !semErro && SES.valeRanking !== false)
          ? `<span class="pill muted">o bônus de tempo pede a sessão inteira sem erro</span>` : ""}
        ${(!bonus && semErro && segMedio != null && SES.valeRanking !== false)
          ? `<span class="pill muted">a ${segMedio}s por questão — o bônus começa abaixo de ${BONUS_TEMPO[BONUS_TEMPO.length-1].seg}s</span>` : ""}
      </div>
      ${SES.modo === "treino" ? `<p class="muted" style="margin-top:16px">Você já viu tudo o que havia de novo e nada estava vencendo:
        esta foi uma sessão de <b>treino livre</b>, com exercícios repetidos. Treina bem, mas o "dominado" quase não anda —
        ele depende de você voltar em outro dia.</p>` : ""}
      ${SES.valeRanking === false ? `<p class="muted" style="margin-top:16px">Esta sessão entrou só no seu XP total —
        para valer no ranking, é preciso respeitar a espera entre sessões.</p>` : ""}
      ${novoRecorde ? `<p style="margin-top:16px;font-weight:800;color:var(--gold)">🏅 Novo recorde de tempo, sem errar nenhuma!</p>` : ""}
      ${SES.desafio ? (() => {
        const d = SES.desafio, meu = "res" + meuLado(d), dela = "res" + outroLado(d);
        const nomeDela = d.de === (N.usuario && N.usuario.uid) ? "a pessoa desafiada" : esc(d.nomeDe || "quem te desafiou");
        if(!d[dela]) return `<div class="desFim">⚔️ <b>Resultado enviado</b>
          <span>Você fez ${SES.acertos} de ${SES.total}. Falta ${nomeDela} responder — quando
          isso acontecer, o resultado aparece na aba do grupo.</span></div>`;
        const venc = quemVenceu(d);
        const eu = N.usuario && N.usuario.uid;
        return `<div class="desFim ${venc === eu ? "ganhou" : venc === "empate" ? "" : "perdeu"}">
          ${venc === eu ? "🏆" : venc === "empate" ? "🤝" : "⚔️"}
          <b>${venc === eu ? "Você venceu!" : venc === "empate" ? "Empate" : "Você perdeu essa"}</b>
          <span>${SES.acertos} × ${d[dela].acertos} em acertos${
            d[meu] && d[dela] && d[meu].acertos === d[dela].acertos
              ? ` · ${Math.round(d[meu].ms/1000)}s contra ${Math.round(d[dela].ms/1000)}s` : ""}.
            ${venc === eu ? `Você leva ${XP_VITORIA} de bônus.` : ""}</span></div>`;
      })() : ""}
      ${novasConquistas.length ? `<div class="novaConq">
        <b>${novasConquistas.length === 1 ? "Conquista nova!" : novasConquistas.length + " conquistas novas!"}</b>
        ${novasConquistas.map(id => {
          const c = CONQUISTAS.find(x => x.id === id);
          return `<div class="cq"><span class="sel">${c.emoji}</span>
            <span class="cqtx"><b>${esc(c.nome)}</b><span>${esc(c.desc)}</span></span></div>`;
        }).join("")}
      </div>` : ""}
      ${faltaEspera > 0 ? `<p class="muted" style="margin-top:18px">A próxima sessão que vale ranking libera em <b>${mmss(faltaEspera)}</b> —
        a espera começou a correr quando você abriu esta bateria, então o tempo que você levou aqui já está descontado.</p>`
        : (S.esperaMin > 0 && SES.valeRanking === false
            ? `<p class="muted" style="margin-top:18px">A espera do ranking segue correndo normalmente — esta sessão não mexeu nela.</p>` : "")}
    </div>`;
  montarTela(corpo, { comNav:false, rodape:
    `<button class="btn" id="mais">${bateuMeta ? "Mais uma rodada" : "Continuar estudando"}</button>
     <div style="height:10px"></div>
     <button class="btn ghost" id="home">Voltar ao início</button>` });
  $("#mais").onclick = iniciarSessao;
  $("#home").onclick = telaInicio;
}

/* ---------- 8. Discursiva ----------

   Ideia de uma amiga da Isabela, e o desenho que ela pediu: a pessoa escreve
   com as palavras dela, e a correção diz o que a professora esperava — "se
   faltou algo pra ficar completo, ou se colocou coisa a mais, com risco de
   errar coisa que nem foi pedida".

   Duas correções, e o app funciona com qualquer uma das duas:

   1. Pelo Claude, quando o grupo tem a correção ligada. A chave da API não
      pode morar aqui dentro — este arquivo é público — então quem fala com o
      Claude é uma função no Firebase, com a chave guardada lá. Ver funcoes/.

   2. Por conta própria, sempre disponível. Aparece a resposta esperada
      quebrada em pontos, e a pessoa marca os que escreveu. É menos confortável
      e mais honesto do que fingir que corrigiu: quem lê o próprio texto ao
      lado do gabarito aprende bastante.

   O gabarito só aparece DEPOIS de a pessoa enviar. Antes disso, nem no HTML.

   ---- Discursiva com partes ----

   Pedido novo: uma questão com "a) ... b) ... c) ..." precisa de uma caixa de
   resposta PARA CADA PARTE — ler a) e b) juntas numa caixa só confunde quem
   está respondendo, e a pessoa perde o fio de qual parte já cobriu. Mas a nota
   continua sendo UMA só, do valor total da questão: a professora corrigia a
   questão inteira de uma vez, não parte por parte, e o gabarito (`gab.pontos`)
   já mistura pontos de partes diferentes sem separá-los.

   Então `it.partes` é só uma lista de rótulos (`["a) ...", "b) ...", ...]`)
   que desenha N caixas. Ao enviar, as respostas são coladas de volta em UM
   texto só, cada uma sob o rótulo da sua parte, e mandadas para a correção
   como se fossem uma resposta corrida — a Cloud Function nunca fica sabendo
   que existiu mais de uma caixa. Questão sem `partes` continua com uma caixa
   só, exatamente como sempre foi. */
function rDiscursiva(it){
  const g = it.gab || {};
  const val = valorDaQuestao(it);
  const partes = (it.partes && it.partes.length) ? it.partes : null;
  const boxes = partes || [null];
  const d = discPorId[it.disc];
  /* A tag ("DISCURSIVA") sempre vem primeiro, antes até do caso clínico —
     é a primeira coisa que diz que tipo de questão é essa. Com partes, o
     enunciado grande (a+b+c juntos) NÃO se repete: cada parte já aparece
     como rótulo em cima da própria caixa, e mostrar duas vezes só confunde. */
  $("#q").innerHTML =
    `<div class="qhead">
      <div class="qtag">${TITULO_TIPO[it.t]}${d ? " · " + esc(d.nome) : ""}</div>
      <span class="raiobox">${raioHTML()}</span>
      ${it.fonte ? `<button class="info" id="btInfo" title="De onde veio esta questão" aria-label="De onde veio esta questão">i</button>` : ""}
    </div>
    ${imagemDaQuestao(it)}
    ${it.apoio ? `<div class="apoio">${esc(it.apoio)}</div>` : ""}
    ${partes ? "" : `<div class="qtitle">${esc(it.enunciado || it.p)}</div>`}
    ${blocoFonte(it)}
    <p class="dica">Responda com as suas palavras. Vale ${plural(val, "ponto", "pontos")}${
       partes ? `, no total das ${plural(partes.length, "parte", "partes")}` : ""}.</p>
     ${boxes.map((rotulo, k) => `
       ${rotulo ? `<p class="parteLabel">${esc(rotulo)}</p>` : ""}
       <div class="parteBox">
         <textarea class="resposta alta" id="txtDisc${k}" rows="${partes ? 4 : 7}"
           placeholder="${partes ? "Sua resposta para esta parte" : "Digite sua resposta e ela será corrigida pela IA com base nos critérios usados nas QPs."}"
           aria-label="${rotulo ? "Sua resposta — " + esc(rotulo) : "Sua resposta"}"></textarea>
       </div>`).join("")}
     <p class="pista" id="contaLetras">0 caracteres</p>
     <div id="correcao"></div>`;
  const campos = boxes.map((_, k) => $("#txtDisc" + k));
  /* Junta as caixas num texto só, cada parte sob o rótulo dela — é isso que
     vira "a resposta" para a correção e para o que fica salvo. */
  const textoJunto = () => partes
    ? partes.map((rotulo, k) => rotulo + "\n" + (campos[k].value || "").trim()).join("\n\n").trim()
    : (campos[0].value || "").trim();
  const pronto = () => campos.every(c => c.value.trim().length > 0) && textoJunto().length >= 10;
  campos.forEach(c => c.oninput = () => {
    $("#contaLetras").textContent = campos.reduce((n, x) => n + x.value.trim().length, 0) + " caracteres";
    atualizaVerificar(pronto());
  });
  pedirVerificar(async () => {
    if(SES.respondido) return;
    if(!pronto()) return;
    const texto = textoJunto();
    campos.forEach(c => c.disabled = true);
    $(".foot").innerHTML = barraTempoHTML() + `<button class="btn" disabled>Corrigindo…</button>`;
    let c = null, porque = "Este aparelho está sem conexão com o grupo, então não deu para corrigir agora.";
    if(correcaoLigada()){
      c = await pedirCorrecao(it, texto);
      if(!c) porque = N.erroCorrecao
        || "Não deu para falar com a correção agora. Pode ser a internet, ou o limite de correções do dia.";
    }
    if(c) mostrarCorrecaoDoClaude(it, texto, c);
    else  mostrarSemCorrecao(it, texto, porque);
  }, false);
  setTimeout(() => { try{ campos[0].focus({ preventScroll:true }); }catch(e){} }, 60);
}

/* Desenha os pontos do gabarito, um por um, do jeito que a professora cobraria. */
function linhaDePonto(p, estado, comentario){
  const ic = { ok:"✅", parcial:"◐", faltou:"○" }[estado] || "○";
  return `<div class="pnt ${estado}">
    <span class="ic">${ic}</span>
    <span class="tx"><b>${esc(p.t || p)}</b>${comentario ? `<span>${esc(comentario)}</span>` : ""}</span>
  </div>`;
}

function mostrarCorrecaoDoClaude(it, texto, c){
  const val = valorDaQuestao(it);
  const nota = Math.max(0, Math.min(val, Number(c.nota) || 0));
  const g = it.gab || {};
  $("#correcao").innerHTML = `
    <div class="corr">
      <div class="cabNota"><b>${nota}</b><small>de ${val}</small>
        <span class="porQuem">corrigido pelo Claude, com o gabarito da prova</span></div>
      ${c.resumo ? `<p class="resumo">${esc(c.resumo)}</p>` : ""}
      <div class="secaoP">O que a professora esperava</div>
      ${(c.pontos || []).map(p => linhaDePonto(p, p.estado, p.comentario)).join("")}
      ${(c.aMais || []).length ? `<div class="secaoP">O que você pôs a mais</div>
        ${c.aMais.map(a => `<div class="pnt extra"><span class="ic">⚠️</span>
          <span class="tx"><b>${esc(a.t)}</b>${a.risco ? `<span>${esc(a.risco)}</span>` : ""}</span></div>`).join("")}
        <p class="muted" style="margin:8px 0 0;font-size:12.5px">Escrever o que não foi pedido não
          soma ponto, e pode tirar: se vier errado, a professora vê um erro que você não precisava
          ter cometido.</p>` : ""}
      ${g.resposta ? `<div class="secaoP">Resposta esperada</div>
        <p class="gabTexto">${esc(g.resposta)}</p>` : ""}
    </div>`;
  guardarRespostaDeProva(it, nota, { texto, comentario: c.resumo || "", porIA:true });
  concluir(it, nota >= val * 0.6, "");
