}

/* ---------- 2. Múltipla escolha ---------- */
/* linha de alternativa: o botão da opção + o ✕ que risca o que a pessoa já descartou */
function linhaOpcao(idx, letra, txt){
  return `<div class="optrow">
      <button class="opt" data-i="${idx}"><span class="k">${letra}</span><span>${esc(txt)}</span></button>
      <button class="risca" data-r="${idx}" title="Riscar esta alternativa" aria-label="Riscar esta alternativa">✕</button>
    </div>`;
}
function ligarRiscar(aoRiscar){
  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    if(SES.respondido) return;
    const i = +b.dataset.r;
    const alvo = document.querySelector(`.opt[data-i="${i}"]`);
    const agora = !alvo.classList.contains("riscada");
    alvo.classList.toggle("riscada", agora);
    b.classList.toggle("on", agora);
    if(agora && alvo.classList.contains("sel")) aoRiscar(i, alvo);   // riscar o que estava marcado desmarca
  });
}
function travarRiscar(){ document.querySelectorAll("[data-r]").forEach(b => b.disabled = true); }

function rMCQ(it){
  const ordem = embaralhar(it.opcoes.map((o,i) => ({o, i})));
  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    ordem.map((x, n) => linhaOpcao(x.i, "ABCDE"[n], x.o)).join("");
  let sel = null;
  pedirVerificar(() => {
    if(sel === null) return;
    travarRiscar();
    document.querySelectorAll(".opt[data-i]").forEach(x => {
      if(+x.dataset.i === it.correta) x.classList.add("ok");
      else if(+x.dataset.i === sel) x.classList.add("no");
      x.classList.remove("sel");
    });
    concluir(it, sel === it.correta, `<b>Resposta: ${esc(it.opcoes[it.correta])}</b><br>${esc(it.exp)}`);
  }, false);
  document.querySelectorAll(".opt[data-i]").forEach(b => b.onclick = () => {
    if(SES.respondido) return;
    document.querySelectorAll(".opt[data-i]").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel"); sel = +b.dataset.i; atualizaVerificar(true);
  });
  ligarRiscar((i, alvo) => { alvo.classList.remove("sel"); sel = null; atualizaVerificar(false); });
}

/* ---------- 2b. Marque todas as corretas ---------- */
function rMulti(it){
  const ordem = embaralhar(it.opcoes.map((o,i) => ({o, i})));
  const gab = new Set(it.corretas);
  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<p class="dica">Pode haver mais de uma certa — marque todas.</p>` +
    ordem.map((x, n) => linhaOpcao(x.i, "ABCDE"[n], x.o)).join("");
  const sel = new Set();
  pedirVerificar(() => {
    if(!sel.size) return;
    travarRiscar();
    document.querySelectorAll(".opt[data-i]").forEach(x => {
      const i = +x.dataset.i;
      x.classList.remove("sel");
      if(gab.has(i)) x.classList.add("ok");            // toda correta fica verde, marcada ou não
      else if(sel.has(i)) x.classList.add("no");       // marcou uma errada
    });
    const acertou = sel.size === gab.size && [...sel].every(i => gab.has(i));
    const listaOk = it.corretas.map(i => "• " + esc(it.opcoes[i])).join("<br>");
    concluir(it, acertou, `<b>${it.corretas.length > 1 ? "Corretas:" : "Correta:"}</b><br>${listaOk}<br>${esc(it.exp)}`);
  }, false);
  document.querySelectorAll(".opt[data-i]").forEach(b => b.onclick = () => {
    if(SES.respondido) return;
    const i = +b.dataset.i;
    if(sel.has(i)){ sel.delete(i); b.classList.remove("sel"); }
    else{
      sel.add(i); b.classList.add("sel");
      b.classList.remove("riscada");                   // marcar desfaz o risco
      const x = document.querySelector(`.risca[data-r="${i}"]`); if(x) x.classList.remove("on");
    }
    atualizaVerificar(sel.size > 0);
  });
  ligarRiscar((i, alvo) => { alvo.classList.remove("sel"); sel.delete(i); atualizaVerificar(sel.size > 0); });
}

/* ---------- 2c. Escrever a resposta ----------
   Comparação tolerante de propósito: a pessoa está treinando o conteúdo, não a ortografia.
   Ignora maiúscula, acento, pontuação e espaço sobrando; aceita as variantes de `aceita`;
   e perdoa UMA letra trocada, faltando ou sobrando em palavras de 6 letras ou mais —
   mas nesse caso mostra a grafia certa, para não fixar o erro. */
function normaliza(t){
  return String(t == null ? "" : t)
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")   // tira acento
    .replace(/[^a-z0-9\s]/g, " ")                       // hífen, ponto, aspas viram espaço
    .replace(/\s+/g, " ").trim()
    // "a adenosina", "o epitálamo", "no epitálamo" valem tanto quanto a palavra sozinha
    .replace(/^(?:o|a|os|as|um|uma|no|na|nos|nas|do|da|dos|das|de|em|pelo|pela)\s+/, "")
    .trim();
}
function distancia(a, b){            // Levenshtein, só até o que precisamos
  if(a === b) return 0;
  if(Math.abs(a.length - b.length) > 1) return 2;
  const m = a.length, k = b.length;
  let linha = new Array(k + 1);
  for(let j = 0; j <= k; j++) linha[j] = j;
  for(let i = 1; i <= m; i++){
    let ant = linha[0]; linha[0] = i;
    for(let j = 1; j <= k; j++){
      const tmp = linha[j];
      linha[j] = Math.min(linha[j] + 1, linha[j-1] + 1, ant + (a[i-1] === b[j-1] ? 0 : 1));
      ant = tmp;
    }
  }
  return linha[k];
}
function conferirEscrita(it, digitado){
  const d = normaliza(digitado);
  if(!d) return { certo:false, quase:false };
  const alvos = [it.resp].concat(it.aceita || []).map(normaliza);
  if(alvos.includes(d)) return { certo:true, quase:false };
  for(const a of alvos){
    if(a.length >= 6 && distancia(d, a) === 1) return { certo:true, quase:true };
  }
  return { certo:false, quase:false };
}

function rEscrita(it){
  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<p class="dica">Escreva a resposta — uma palavra basta.</p>
     <input class="resposta" id="txtResp" type="text" inputmode="text"
       autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
       placeholder="digite aqui" aria-label="Sua resposta">
     ${it.pista ? `<p class="pista">💡 ${esc(it.pista)}</p>` : ""}`;
  const campo = $("#txtResp");
  const responder = () => {
    if(SES.respondido) return;
    const r = conferirEscrita(it, campo.value);
    if(!campo.value.trim()) return;
    campo.disabled = true;
    campo.classList.add(r.certo ? "ok" : "no");
    const grafia = r.quase
      ? `<b>Quase na grafia — o certo é «${esc(it.resp)}».</b> Vou contar como acerto.<br>`
      : (r.certo ? "" : `<b>Resposta: ${esc(it.resp)}</b><br>`);
    concluir(it, r.certo, grafia + esc(it.exp));
  };
  pedirVerificar(responder, false);
  campo.oninput = () => atualizaVerificar(!!campo.value.trim());
  campo.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); responder(); } };
  setTimeout(() => { try{ campo.focus({ preventScroll:true }); }catch(e){ campo.focus(); } }, 60);
}

/* ---------- 3. Completar lacunas ---------- */
function rCloze(it){
  const partes = it.texto.split(/(\[\[\d+\]\])/g);
  const corpo = partes.map(p => {
    const m = p.match(/^\[\[(\d+)\]\]$/);
    return m ? `<span class="blank" data-b="${m[1]}"></span>` : esc(p);
  }).join("");

  const respostas = it.lacunas.map(l => l.resp);
  const extras = [];
  it.lacunas.forEach(l => (l.dist||[]).forEach(d => {
    if(!respostas.includes(d) && !extras.includes(d)) extras.push(d);
  }));
  const banco = embaralhar(respostas.concat(extras));

  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<div class="cloze">${corpo}</div>
     <div class="bank">${banco.map((w,i) => `<button class="chip" data-w="${i}">${esc(w)}</button>`).join("")}</div>`;

  const preenchido = new Array(it.lacunas.length).fill(null);
  const chips = [...document.querySelectorAll(".chip")];
  const blanks = [...document.querySelectorAll(".blank")];
  const completo = () => preenchido.every(x => x !== null);

  function pintar(){
    blanks.forEach((b, i) => {
      const ci = preenchido[i];
      b.textContent = ci === null ? "" : banco[ci];
      b.classList.toggle("filled", ci !== null);
    });
    chips.forEach((c, i) => c.classList.toggle("used", preenchido.includes(i)));
    atualizaVerificar(completo());
  }
  chips.forEach((c, i) => c.onclick = () => {
    if(SES.respondido) return;
    const vaga = preenchido.indexOf(null); if(vaga === -1) return;
    preenchido[vaga] = i; pintar();
  });
  blanks.forEach((b, i) => b.onclick = () => {
    if(SES.respondido) return;
    if(preenchido[i] !== null){ preenchido[i] = null; pintar(); }
  });

  pedirVerificar(() => {
    if(!completo()) return;
    let tudoOk = true;
    blanks.forEach((b, i) => {
      const dado = banco[preenchido[i]], certo = it.lacunas[i].resp;
      b.classList.remove("filled");
      if(dado === certo) b.classList.add("ok");
      else { tudoOk = false; b.classList.add("no"); b.insertAdjacentHTML("afterend", ` <span class="blank fix">${esc(certo)}</span>`); }
    });
    $(".bank").style.display = "none";
    concluir(it, tudoOk, esc(it.exp));
  }, false);
  pintar();
}

/* ---------- 4. Colocar em ordem ---------- */
function rOrdem(it){
  const baralho = embaralhar(it.seq.map((s, i) => ({s, i})));
  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<div class="slots" id="slots"></div>
     <div class="pool" id="pool">${baralho.map((x, k) => `<button class="prow" data-k="${k}">${esc(x.s)}</button>`).join("")}</div>`;

  const escolhidos = [];
  function pintar(){
    $("#slots").innerHTML = escolhidos.map((k, n) =>
      `<div class="srow" data-pos="${n}"><div class="n">${n+1}</div><div>${esc(baralho[k].s)}</div></div>`).join("");
    document.querySelectorAll("#pool .prow").forEach((b, k) => b.style.display = escolhidos.includes(k) ? "none" : "block");
    document.querySelectorAll(".srow").forEach(r => r.onclick = () => {
      if(SES.respondido) return;
      escolhidos.splice(+r.dataset.pos, 1); pintar();
    });
    atualizaVerificar(escolhidos.length === it.seq.length);
  }
  document.querySelectorAll("#pool .prow").forEach((b, k) => b.onclick = () => {
    if(SES.respondido) return;
    escolhidos.push(k); pintar();
  });

  pedirVerificar(() => {
    if(escolhidos.length !== it.seq.length) return;
    let tudoOk = true;
    escolhidos.forEach((k, n) => {
      const certo = baralho[k].i === n;
      if(!certo) tudoOk = false;
      $(`.srow[data-pos="${n}"]`).classList.add(certo ? "ok" : "no");
    });
    $("#pool").style.display = "none";
    if(!tudoOk) $("#slots").insertAdjacentHTML("afterend",
      `<div class="gab"><b style="font-size:14px">Ordem correta:</b><ol>${it.seq.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>`);
    concluir(it, tudoOk, esc(it.exp));
  }, false);
  pintar();
}

/* ---------- 5. Relacionar ---------- */
/* o gabarito do relacionar, escrito por extenso — as colunas ficam embaralhadas
   e depois de fechar tudo é difícil reler qual foi com qual */
function listaDePares(it){
  return `<div class="pares">${it.pares.map(p =>
    `<div class="par"><b>${esc(p[0])}</b><span class="seta">→</span><span>${esc(p[1])}</span></div>`).join("")}</div>`;
}
function rRel(it){
  const esqL = embaralhar(it.pares.map((p, i) => ({txt:p[0], i})));
  const dirL = embaralhar(it.pares.map((p, i) => ({txt:p[1], i})));
  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<div class="mgrid">
       <div class="mcol">${esqL.map((x,k) => `<button class="mi" data-l="${k}" data-par="${x.i}">${esc(x.txt)}</button>`).join("")}</div>
       <div class="mcol">${dirL.map((x,k) => `<button class="mi" data-r="${k}" data-par="${x.i}">${esc(x.txt)}</button>`).join("")}</div>
     </div>`;
  $(".foot").innerHTML = `<p class="muted" style="text-align:center;margin:0 0 8px">Toque num item da esquerda e depois no par dele à direita.</p>`;

  let selE = null, feitos = 0, errou = false;
  const tot = it.pares.length;
  const todos = [...document.querySelectorAll(".mi")];
  todos.forEach(b => b.onclick = () => {
    if(SES.respondido) return;
    if(b.hasAttribute("data-l")){
      todos.forEach(x => x.classList.remove("sel"));
      b.classList.add("sel"); selE = b; return;
    }
    if(!selE) return;
    if(selE.dataset.par === b.dataset.par){
      selE.classList.remove("sel"); selE.classList.add("done"); b.classList.add("done");
      selE = null; feitos++;
      if(feitos === tot) concluir(it, !errou,
        (errou ? "Você fechou todos os pares, mas errou pelo caminho — volta amanhã.<br>" : "") +
        listaDePares(it) + esc(it.exp));
    }else{
      errou = true;
      const a = selE, c = b;
      a.classList.add("err"); c.classList.add("err");
      setTimeout(() => { a.classList.remove("err","sel"); c.classList.remove("err"); }, 400);
      selE = null;
    }
  });
}

/* ============================================================
   TELA: rever uma questão já respondida
   Só leitura: não pontua de novo nem mexe no agendamento. O objetivo é
   reler a explicação que passou rápido demais.
   ============================================================ */
function gabaritoLegivel(it){
  switch(it.t){
    case "mcq":   return `<div class="pares"><div class="par"><b>Resposta</b><span class="seta">→</span><span>${esc(it.opcoes[it.correta])}</span></div></div>`;
    case "multi": return `<div class="pares">${it.corretas.map(i =>
                    `<div class="par"><b>✓</b><span>${esc(it.opcoes[i])}</span></div>`).join("")}</div>`;
    case "vf":    return `<div class="pares"><div class="par"><b>${it.correta ? "Verdadeiro" : "Falso"}</b></div></div>`;
    case "escrita": return `<div class="pares"><div class="par"><b>Resposta</b><span class="seta">→</span><span>${esc(it.resp)}</span></div></div>`;
    case "cloze": return `<div class="pares">${it.lacunas.map((l, k) =>
                    `<div class="par"><b>${k+1}</b><span class="seta">→</span><span>${esc(l.resp)}</span></div>`).join("")}</div>`;
    case "ordem": return `<div class="pares">${it.seq.map((p, k) =>
                    `<div class="par"><b>${k+1}</b><span class="seta">→</span><span>${esc(p)}</span></div>`).join("")}</div>`;
    case "relacionar": return listaDePares(it);
    default: return "";
  }
}
function telaRever(n){
  pararRelogio();
  const total = SES.log.length;
  n = Math.max(0, Math.min(total - 1, n));
  const reg = SES.log[n];
  const it = porId[reg.id];
  const titulo = it.enunciado || it.frase || "";
  const corpo = `<div class="q" id="q">
      <div class="qhead">
        <div class="qtag">Revendo · ${n + 1} de ${total}</div>
        ${it.fonte ? `<button class="info" id="btInfo" title="De onde veio esta questão" aria-label="De onde veio esta questão">i</button>` : ""}
      </div>
      <div class="qtitle">${esc(titulo)}</div>
      ${blocoFonte(it)}
      ${it.t === "cloze" ? `<p class="revtexto">${esc(it.texto.replace(/\[\[(\d+)\]\]/g, (m, k) => "___(" + (+k + 1) + ")"))}</p>` : ""}
      <div class="fb ${reg.acertou ? "good" : "bad"}" style="margin-top:14px">
        <h3>${reg.acertou ? "✅ Você acertou esta" : "❌ Esta você errou"}</h3>
      </div>
      ${gabaritoLegivel(it)}
      ${reg.exp ? `<p class="revexp">${reg.exp}</p>` : ""}
    </div>`;
  montarTela(corpo, { comNav:false,
    topo: `<div class="topbar">
             <button class="xbtn" id="fechaRev">✕</button>
             <div class="bar"><i style="width:${Math.round(100*(n+1)/total)}%"></i></div>
             <div class="cron">${n + 1}/${total}</div>
           </div>`,
    rodape: `<div class="acoes">
        <button class="btn ghost" id="revAnt" ${n === 0 ? "disabled" : ""}>‹ Anterior</button>
        <button class="btn ghost" id="revProx" ${n === total - 1 ? "disabled" : ""}>Próxima ›</button>
      </div>
      <div style="height:8px"></div>
      <button class="btn" id="revVoltar">Voltar ao exercício</button>` });
  const bt = $("#btInfo");
  if(bt) bt.onclick = () => {
    const cx = $("#boxFonte");
    cx.classList.toggle("hide");
    bt.classList.toggle("on", !cx.classList.contains("hide"));
    ligarCue();
  };
  const sair = () => { render(); };
  $("#fechaRev").onclick = sair;
  $("#revVoltar").onclick = sair;
  $("#revAnt").onclick = () => telaRever(n - 1);
  $("#revProx").onclick = () => telaRever(n + 1);
  ligarCue();
}

/* ============================================================
   TELA: fim de sessão
   ============================================================ */
function telaFim(){
  pararRelogio();
  const pc = SES.total ? Math.round(100 * SES.acertos / SES.total) : 0;
  const bateuMeta = S.feitosHoje >= S.meta;
  const respondidas = SES.vistos.length - SES.estourou;
  const segMedio = respondidas > 0 ? Math.round((Date.now() - SES.inicio) / 1000 / respondidas) : null;
  // bônus de velocidade: SÓ para sessão sem nenhum erro. Rapidez com erro é chute, não domínio.
  const semErro = SES.total > 0 && SES.acertos === SES.total;
  let bonus = 0;
  if(SES.valeRanking !== false && SES.fim && !SES.estourou && semErro){
    const total = S.segPorQuestao * 1000 * SES.total;
    const usado = Date.now() - SES.inicio;
    const sobra = Math.max(0, Math.min(1, 1 - usado / total));       // 0 = usou tudo, 1 = instantâneo
    const baseSessao = S.xpSemana - SES.xpAntes;
    bonus = Math.round(baseSessao * sobra * 0.5);                    // no máximo +50% da sessão
    if(bonus > 0) S.xpSemana += bonus;
  }
  let novoRecorde = false;
  if(segMedio && !SES.estourou && SES.acertos === SES.total && SES.total >= 5){
    if(!S.recorde || segMedio < S.recorde){ S.recorde = segMedio; novoRecorde = true; }
  }
  const faltaEspera = S.proximaSessao ? Math.max(0, Math.round((S.proximaSessao - Date.now())/1000)) : 0;
  salvar();

  const corpo = `
    <div class="done">
      <div class="big">${SES.estourou ? "⏰" : pc >= 80 ? "🎉" : pc >= 50 ? "💪" : "🌱"}</div>
      <h2>${SES.estourou ? "O tempo acabou" : pc >= 80 ? "Sessão redonda!" : pc >= 50 ? "Boa, tá fixando" : "Repetição é isso aí"}</h2>
      <p>${SES.estourou
            ? plural(SES.estourou, "questão ficou sem resposta e contou como erro", "questões ficaram sem resposta e contaram como erro") + ". Elas voltam amanhã."
            : bateuMeta ? "Meta do dia batida. Volta amanhã que o app já separa o que precisa revisar."
                        : "Faltam " + (S.meta - S.feitosHoje) + " para bater a meta de hoje."}</p>
      <div>
        <span class="pill">✅ ${SES.acertos}/${SES.total} de primeira</span>
        ${segMedio ? `<span class="pill">⏱ ${segMedio}s por questão</span>` : ""}
        <span class="pill">🔥 ${S.ofensiva} de ofensiva</span>
        <span class="pill">⭐ ${S.xpSemana} XP na semana</span>
        ${bonus ? `<span class="pill" style="color:var(--gold)">⚡ +${bonus} de bônus por velocidade</span>` : ""}
        ${(!bonus && SES.fim && !SES.estourou && !semErro && SES.valeRanking !== false)
          ? `<span class="pill muted">o bônus de velocidade pede a sessão inteira sem erro</span>` : ""}
      </div>
      ${SES.modo === "treino" ? `<p class="muted" style="margin-top:16px">Você já viu tudo o que havia de novo e nada estava vencendo:
        esta foi uma sessão de <b>treino livre</b>, com exercícios repetidos. Treina bem, mas o "dominado" quase não anda —
        ele depende de você voltar em outro dia.</p>` : ""}
      ${SES.valeRanking === false ? `<p class="muted" style="margin-top:16px">Esta sessão entrou só no seu XP total —
        para valer no ranking, é preciso respeitar a espera entre sessões.</p>` : ""}
      ${novoRecorde ? `<p style="margin-top:16px;font-weight:800;color:var(--gold)">🏅 Novo recorde de tempo, sem errar nenhuma!</p>` : ""}
      ${faltaEspera > 0 ? `<p class="muted" style="margin-top:18px">A próxima sessão que vale ranking libera em <b>${mmss(faltaEspera)}</b> —
        a espera começou a correr quando você abriu esta bateria, então o tempo que você levou aqui já está descontado.</p>`
        : (S.esperaMin > 0 && SES.valeRanking === false
            ? `<p class="muted" style="margin-top:18px">A espera do ranking segue correndo normalmente — esta sessão não mexeu nela.</p>` : "")}
    </div>`;
  montarTela(corpo, { comNav:false, rodape:
    `<button class="btn" id="mais">${bateuMeta ? "Mais uma rodada" : "Continuar estudando"}</button>
     <div style="height:10px"></div>
     <button class="btn ghost" id="home">Voltar ao início</button>` });
  $("#mais").onclick = iniciarSessao;
  $("#home").onclick = telaInicio;
}

/* ============================================================
   NUVEM — Firebase (autenticação + Firestore)

   Só liga se window.FIREBASE_CONFIG existir. No arquivo único ele não
   existe, e o app roda exatamente como antes: banco embutido, progresso
   no próprio aparelho, sem login. É de propósito — é a versão que
   funciona offline no computador, sem depender de nada.

   Nada aqui decide permissão. Quem decide é o Firestore, pelas regras
   em firestore.rules. O que está deste lado é só a experiência.
   ============================================================ */
/* O endereço do SDK é trocável para os testes poderem rodar contra um dublê
   que obedece às mesmas regras. Em produção, window.SDK_BASE não existe. */
const SDK = window.SDK_BASE || "https://www.gstatic.com/firebasejs/12.17.1/";
const N = { ligado:false, pronto:false, auth:null, db:null, api:{},
            usuario:null, grupo:null, papel:null };

const CHAVE_CACHE  = "fixaai_cache_banco";
const CHAVE_GRUPO  = "fixaai_grupo";

async function nuvemCarregar(){
  if(!window.FIREBASE_CONFIG) return false;
  const [a, au, fs] = await Promise.all([
    import(SDK + "firebase-app.js"),
    import(SDK + "firebase-auth.js"),
    import(SDK + "firebase-firestore.js")
  ]);
  const app = a.initializeApp(window.FIREBASE_CONFIG);
  N.auth = au.getAuth(app);
  N.db   = fs.getFirestore(app);
  N.api  = { ...au, ...fs };
  N.ligado = true;
  /* Se a pessoa está voltando de um redirecionamento, é aqui que o login se
     completa. Precisa ser antes de qualquer decisão de tela. */
  try{
    const r = await N.api.getRedirectResult(N.auth);
    N.voltouDeRedirecionamento = !!(r && r.user);
  }catch(e){ N.erroRedirecionamento = traduzErro(e); }
  sessionStorage.removeItem("fixaai_redirecionando");
  return true;
}

/* ---------- entrar e sair ----------

   Pop-up funciona bem no computador e no Android. No iPhone — e principalmente
   num app adicionado à tela de início — o Safari costuma bloquear, e a janela
   simplesmente não abre. Por isso: iOS vai direto de redirecionamento, e em
   qualquer outro lugar o pop-up cai para redirecionamento se falhar.
   Sem isso, quem usa iPhone não entra. */
function ehIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)   // iPad recente
      || /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
}
function instaladoNaTela(){
  return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
}

function provedorGoogle(){
  const p = new N.api.GoogleAuthProvider();
  p.setCustomParameters({ prompt: "select_account" });
  return p;
}

async function entrarComGoogle(){
  const p = provedorGoogle();
  if(ehIOS() || instaladoNaTela()){
    sessionStorage.setItem("fixaai_redirecionando", "1");
    return N.api.signInWithRedirect(N.auth, p);      // não retorna: a página sai
  }
  try{
    await N.api.signInWithPopup(N.auth, p);
  }catch(e){
    const c = (e && e.code) || "";
    if(/popup-blocked|popup-closed-by-user|operation-not-supported|cancelled-popup|web-storage-unsupported/.test(c)){
      sessionStorage.setItem("fixaai_redirecionando", "1");
      return N.api.signInWithRedirect(N.auth, p);
    }
    throw e;
  }
}
/* Não existe entrada por e-mail e senha, de propósito. Ter um campo de senha
   fazia o navegador oferecer "salvar senha neste site", o que dá a impressão de
   que o app quer a senha do e-mail da pessoa — e criava um beco sem saída para
   quem digitava um endereço já cadastrado pelo Google. Com o Google, nenhuma
   senha passa por aqui. */
async function sairDaConta(){
  try{ await N.api.signOut(N.auth); }catch(e){}
  localStorage.removeItem(CHAVE_GRUPO);
  localStorage.removeItem(CHAVE_CACHE);
  location.reload();
}

/* ---------- grupos ---------- */
const ref  = (...p) => N.api.doc(N.db, ...p);
const cole = (...p) => N.api.collection(N.db, ...p);

async function meusGrupos(){
  /* A lista fica no documento da pessoa só por conveniência, para o app não
     precisar adivinhar. Ela NÃO vale como permissão: quem pode ler o banco
     de um grupo é decidido pela existência do registro de membro, conferida
     pelo servidor. Uma lista adulterada só faz o app tentar e levar não. */
  const d = await N.api.getDoc(ref("usuarios", N.usuario.uid));
  return (d.exists() && d.data().grupos) || [];
}

async function registrarUsuario(){
  const u = N.usuario;
  await N.api.setDoc(ref("usuarios", u.uid), {
    nome: u.displayName || (u.email || "").split("@")[0],
    email: u.email || null,
    foto: u.photoURL || null,
    ultimoAcesso: N.api.serverTimestamp()
  }, { merge: true });
}

/* A data vem como Timestamp do Firestore, mas pode chegar como número em
   cache ou em teste. Uma função só evita a comparação silenciosamente errada
   que deixaria passar um convite vencido. */
function emMilissegundos(v){
  if(v == null) return 0;
  if(typeof v === "number") return v;
  if(typeof v.toMillis === "function") return v.toMillis();
  if(v.seconds != null) return v.seconds * 1000;
  const d = new Date(v);
  return isNaN(d) ? 0 : d.getTime();
}

async function entrarNoGrupoPorCodigo(codigo){
  codigo = String(codigo || "").trim().toUpperCase();
  if(!codigo) throw new Error("Digite o código do convite.");

  const cv = await N.api.getDoc(ref("convites", codigo));
  if(!cv.exists()) throw new Error("Não encontrei esse código. Confira se digitou certo.");
  const c = cv.data();
  if(!c.ativo) throw new Error("Este convite foi desativado.");
  if(c.usos >= c.maxUsos) throw new Error("Este convite já atingiu o limite de pessoas.");
  if(emMilissegundos(c.expiraEm) && emMilissegundos(c.expiraEm) < Date.now())
    throw new Error("Este convite venceu. Peça um código novo.");

  const u = N.usuario;
  await N.api.setDoc(ref("grupos", c.grupo, "membros", u.uid), {
    nome: u.displayName || (u.email || "").split("@")[0],
    entrouEm: N.api.serverTimestamp(),
    papel: "membro",
    viaConvite: codigo
  });
  await N.api.updateDoc(ref("convites", codigo), { usos: N.api.increment(1) });
  await N.api.setDoc(ref("usuarios", u.uid),
    { grupos: N.api.arrayUnion(c.grupo) }, { merge: true });
  return c.grupo;
}

/* ---------- o banco de questões ----------

   O Firestore NÃO aceita lista dentro de lista. As questões de relacionar
   guardam os pares como [["esquerda","direita"], ...] — exatamente o formato
   proibido. Na ida cada par vira {e,d}; na volta, par de novo. O resto do app
   continua vendo pares como sempre viu.                                    */
function paraNuvem(it){
  if(!Array.isArray(it.pares)) return it;
  return { ...it, pares: it.pares.map(p => ({ e: p[0], d: p[1] })) };
}
function daNuvem(it){
  if(!Array.isArray(it.pares)) return it;
  return { ...it, pares: it.pares.map(p => Array.isArray(p) ? p : [p.e, p.d]) };
}
/* Rede de proteção: se um tipo novo de exercício trouxer outra lista aninhada,
   quero saber na hora de publicar, com o caminho exato, e não um erro genérico. */
function acharListaAninhada(v, caminho){
  if(Array.isArray(v)){
    for(let i = 0; i < v.length; i++){
      if(Array.isArray(v[i])) return caminho + "[" + i + "]";
      const f = acharListaAninhada(v[i], caminho + "[" + i + "]");
      if(f) return f;
    }
    return null;
  }
  if(v && typeof v === "object"){
    for(const k of Object.keys(v)){
      const f = acharListaAninhada(v[k], caminho + "." + k);
      if(f) return f;
    }
  }
  return null;
}

async function lerBancoDoGrupo(g){
  const q = await N.api.getDocs(cole("grupos", g, "banco"));
  if(q.empty) return null;
  const curso = { disciplinas:[], topicos:[], itens:[] };
  const vistos = new Set();
  q.forEach(d => {
    const b = d.data();
    (b.disciplinas || []).forEach(x => { if(!vistos.has("d"+x.id)){ vistos.add("d"+x.id); curso.disciplinas.push(x); } });
    (b.topicos || []).forEach(x => { if(!vistos.has("t"+x.id)){ vistos.add("t"+x.id); curso.topicos.push(x); } });
    (b.itens || []).forEach(x => { if(!vistos.has("i"+x.id)){ vistos.add("i"+x.id); curso.itens.push(daNuvem(x)); } });
  });
  return curso;
}

function guardarBanco(curso){
  try{ localStorage.setItem(CHAVE_CACHE, JSON.stringify(curso)); }catch(e){}
}
function bancoGuardado(){
  try{ const b = localStorage.getItem(CHAVE_CACHE); return b ? JSON.parse(b) : null; }
  catch(e){ return null; }
}

/* ---------- progresso na nuvem ---------- */
const CAMPOS_SINC = ["prog","xp","xpSemana","semana","ofensiva","ultimoDia","dia",
                     "feitosHoje","meta","segPorQuestao","esperaMin","recorde",
                     "datas","foco","historico","reportes"];

function juntarProgresso(local, remoto){
  /* Mesma conta em dois aparelhos: fica o mais adiantado de cada questão,
     e o maior de cada contador. Nunca perde acerto de ninguém. */
  if(!remoto) return local;
  const fora = { ...local };
  const p = { ...(remoto.prog || {}) };
  Object.keys(local.prog || {}).forEach(id => {
    const a = local.prog[id], b = p[id];
    p[id] = (!b || (a.reps || 0) >= (b.reps || 0)) ? a : b;
  });
  fora.prog = p;
  ["xp","xpSemana","ofensiva","feitosHoje"].forEach(k =>
    fora[k] = Math.max(local[k] || 0, remoto[k] || 0));
  fora.historico = { ...(remoto.historico || {}), ...(local.historico || {}) };
  fora.datas     = { ...(remoto.datas || {}), ...(local.datas || {}) };
  if(remoto.recorde) fora.recorde = Math.min(local.recorde || 1e9, remoto.recorde);
  return fora;
}

async function baixarProgresso(){
  try{
    const d = await N.api.getDoc(ref("progresso", N.usuario.uid));
    return d.exists() ? d.data() : null;
  }catch(e){ return null; }
}

let sincPendente = null, sincUltimo = 0;
function agendarSincronia(){
  /* Escrever a cada questão gastaria cota à toa. Uma escrita a cada 15s,
     mais uma garantida ao fechar o app, dá conta com folga. */
  if(!N.ligado || !N.usuario) return;
  clearTimeout(sincPendente);
  const espera = Math.max(0, 15000 - (Date.now() - sincUltimo));
  sincPendente = setTimeout(sincronizarAgora, espera);
}
async function sincronizarAgora(){
  if(!N.ligado || !N.usuario) return;
  sincUltimo = Date.now();
  const dados = {};
  CAMPOS_SINC.forEach(k => { if(S[k] !== undefined) dados[k] = S[k]; });
  dados.atualizadoEm = N.api.serverTimestamp();
  try{ await N.api.setDoc(ref("progresso", N.usuario.uid), dados, { merge: true }); }
  catch(e){ /* sem rede: fica local e sobe na próxima */ }
}

function traduzErro(e){
  const c = (e && (e.code || e.message)) || "";
  if(/unauthorized-domain/.test(c))
    return "Este endereço não está autorizado no Firebase. Se você abriu o arquivo direto do "
         + "computador, use o endereço do app na internet. Se já está no endereço certo, "
         + "falta liberá-lo em Authentication → Settings → Authorized domains.";
  if(/operation-not-allowed|configuration-not-found/.test(c))
    return "Esta forma de entrar não está ligada no Firebase. Ative em Authentication → Sign-in method.";
  if(/popup-closed|cancelled-popup/.test(c)) return "A janela do Google fechou antes de terminar. Tente de novo.";
  if(/popup-blocked/.test(c))       return "O navegador bloqueou a janela do Google. Libere os pop-ups para este site.";
  if(/too-many-requests/.test(c))   return "Muitas tentativas seguidas. Espere um minuto e tente de novo.";
  if(/network-request-failed|unavailable/.test(c))
                                    return "Sem conexão com o servidor. Confira sua internet.";
  if(/permission-denied/.test(c))   return "Você não tem acesso a esse conteúdo.";
  return (e && e.message) ? String(e.message).replace(/^Firebase:\s*/, "") : "Não consegui completar. Tente de novo.";
}

/* ============================================================
   ADMINISTRAÇÃO — só quem organiza o grupo usa esta tela.
   Criar o grupo, emitir o código de convite e publicar as questões.
   ============================================================ */
function sorteioCodigo(){
  const letras = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";   // sem I, O, 0, 1: confundem ao ditar
  let f = "";
  const r = new Uint8Array(4);
  crypto.getRandomValues(r);
  for(let i = 0; i < 4; i++) f += letras[r[i] % letras.length];
  return f;
}

async function telaAdmin(aviso){
  const meus = await meusGrupos().catch(() => []);
  let dono = null;
  for(const g of meus){
    try{
      const d = await N.api.getDoc(ref("grupos", g));
      if(d.exists() && d.data().dono === N.usuario.uid){ dono = { id:g, ...d.data() }; break; }
    }catch(e){}
  }

  if(!dono){
    molduraEntrada(`
      <h1>Criar um grupo</h1>
      <p class="sub">O grupo é o que guarda as questões e reúne quem estuda junto.
        Você cria uma vez e distribui o código.</p>
      ${aviso ? `<div class="erro">${esc(aviso)}</div>` : ""}
      <input class="resposta" id="gNome" placeholder="Medicina 2º ano — 2026" style="margin-bottom:12px">
      <button class="btn" id="bCria">Criar grupo</button>
      <button class="sair" id="bVolta">Voltar</button>`);
    $("#bCria").onclick = async () => {
      const nome = $("#gNome").value.trim();
      if(!nome) return telaAdmin("Dê um nome ao grupo.");
      const b = $("#bCria"); b.disabled = true; b.textContent = "Criando...";
      try{
        const id = "g" + Date.now().toString(36) + sorteioCodigo().toLowerCase();
        await N.api.setDoc(ref("grupos", id), {
          nome, dono: N.usuario.uid, criadoEm: N.api.serverTimestamp()
        });
        await N.api.setDoc(ref("grupos", id, "membros", N.usuario.uid), {
          nome: N.usuario.displayName || "organizadora",
          entrouEm: N.api.serverTimestamp(), papel: "dono", viaConvite: "fundadora"
        });
        await N.api.setDoc(ref("usuarios", N.usuario.uid),
          { grupos: N.api.arrayUnion(id) }, { merge:true });
        localStorage.setItem(CHAVE_GRUPO, id);
        telaAdmin();
      }catch(e){ telaAdmin(traduzErro(e)); }
    };
    $("#bVolta").onclick = () => telaConvite();
    return;
  }

  // já existe grupo: mostrar convite, membros e publicação
  /* O código do convite fica guardado NO GRUPO. Listar convites é proibido pelas
     regras — é o que impede alguém de descobrir códigos alheios —, e sem isso a
     própria tela de administração ficava sem enxergar o código que criou. */
  let convite = null;
  if(dono.convite){
    try{
      const d = await N.api.getDoc(ref("convites", dono.convite));
      if(d.exists()) convite = { codigo: dono.convite, ...d.data() };
    }catch(e){}
  }
  let nMembros = "—";
  try{ nMembros = (await N.api.getDocs(cole("grupos", dono.id, "membros"))).size; }catch(e){}
  let nQuestoes = 0;
  try{
    const q = await N.api.getDocs(cole("grupos", dono.id, "banco"));
    q.forEach(d => nQuestoes += ((d.data().itens || []).length));
  }catch(e){}

  const vencMs = convite ? emMilissegundos(convite.expiraEm) : 0;
  const venc = vencMs ? new Date(vencMs).toLocaleDateString("pt-BR") : null;

  app.innerHTML = `<div class="rolagem"><div class="admin" style="padding:18px 16px 30px">
    <div class="secao">${esc(dono.nome)}</div>
    ${aviso ? `<div class="erro" style="margin-bottom:12px">${esc(aviso)}</div>` : ""}

    <div class="cx">
      <b>Código de convite</b>
      ${convite ? `
        <div class="cod">${esc(convite.codigo)}</div>
        <p class="muted" style="margin:0 0 10px">
          ${convite.ativo ? "Ativo" : "Desativado"} ·
          ${convite.usos} de ${convite.maxUsos} usos
          ${venc ? " · vence em " + venc : ""}
        </p>
        <div class="asbtns">
          <button class="minibt" id="bLiga">${convite.ativo ? "Desativar" : "Reativar"}</button>
          <button class="minibt" id="bNovo">Gerar outro</button>
        </div>`
      : `<p class="muted" style="margin:8px 0 10px">Ainda não existe convite para este grupo.</p>
         <button class="minibt" id="bNovo" style="width:100%">Gerar código</button>`}
    </div>

    <div class="cx">
      <b>Quem já entrou</b>
      <p class="muted" style="margin:8px 0 0">${nMembros} ${nMembros === 1 ? "pessoa" : "pessoas"}</p>
    </div>

    <div class="cx">
      <b>Questões publicadas</b>
      <p class="muted" style="margin:8px 0 10px">
        ${nQuestoes ? nQuestoes + " exercícios no ar" : "Nenhuma ainda — publique o banco abaixo."}</p>
      <input type="file" id="arq" accept="application/json,.json" style="display:none">
      <div class="asbtns">
        <button class="minibt" id="bPubArq">Publicar de um arquivo</button>
        <button class="minibt" id="bPubWeb">Publicar do banco.json</button>
      </div>
    </div>

    <div class="cx">
      <b>Seu identificador</b>
      <p class="muted" style="margin:8px 0 6px">É o que vai na lista de organizadoras,
        dentro das regras de segurança.</p>
      <div class="cod" style="font-size:13px;letter-spacing:.02em">${esc(N.usuario.uid)}</div>
    </div>

    <button class="btn" id="bIr" style="margin-top:6px">Ir para o app</button>
    <div style="height:8px"></div>
    <button class="btn ghost" id="bSair">Sair desta conta</button>
  </div></div>`;
  ligarCue();

  const bl = $("#bLiga");
  if(bl) bl.onclick = async () => {
    try{
      await N.api.updateDoc(ref("convites", convite.codigo), { ativo: !convite.ativo });
      telaAdmin();
    }catch(e){ telaAdmin(traduzErro(e)); }
  };

  $("#bNovo").onclick = async () => {
    const base = (dono.nome.match(/[A-Za-zÀ-ÿ]+/g) || ["GRUPO"])[0]
      .toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "").slice(0, 6);
    const ano = new Date().getFullYear();
    const codigo = `${base}${ano}-${sorteioCodigo()}`;
    try{
      if(convite) await N.api.updateDoc(ref("convites", convite.codigo), { ativo:false });
      await N.api.setDoc(ref("convites", codigo), {
        grupo: dono.id, ativo:true, usos:0, maxUsos:60,
        expiraEm: N.api.Timestamp.fromMillis(Date.now() + 21 * 864e5),
        criadoEm: N.api.serverTimestamp()
      });
      await N.api.updateDoc(ref("grupos", dono.id), { convite: codigo });
      telaAdmin();
    }catch(e){ telaAdmin(traduzErro(e)); }
  };

  async function publicar(curso){
    if(!curso || !curso.itens || !curso.itens.length)
      return telaAdmin("Esse arquivo não parece um banco de questões válido.");
    const porProva = {};
    curso.itens.forEach(i => {
      const k = (i.disc || "geral") + "_" + (i.prova || "p");
      (porProva[k] = porProva[k] || []).push(paraNuvem(i));
    });
    // confere antes de mandar: erro do Firestore aqui não diz qual questão é
    for(const k of Object.keys(porProva)){
      const ruim = acharListaAninhada(porProva[k], k);
      if(ruim) return telaAdmin("Uma questão tem lista dentro de lista, que o Firestore não aceita: " + ruim);
    }
    try{
      for(const k of Object.keys(porProva)){
        await N.api.setDoc(ref("grupos", dono.id, "banco", k), {
          disciplinas: curso.disciplinas || [],
          topicos: curso.topicos || [],
          itens: porProva[k],
          atualizadoEm: N.api.serverTimestamp()
        });
      }
      localStorage.removeItem(CHAVE_CACHE);
      telaAdmin();
    }catch(e){ telaAdmin(traduzErro(e)); }
  }

  $("#bPubArq").onclick = () => $("#arq").click();
  $("#arq").onchange = async ev => {
    const f = ev.target.files[0];
    if(!f) return;
    try{ await publicar(JSON.parse(await f.text())); }
    catch(e){ telaAdmin("Não consegui ler esse arquivo: " + e.message); }
  };
  $("#bPubWeb").onclick = async () => {
    try{
      const r = await fetch("banco.json?v=" + Date.now(), { cache:"no-store" });
      if(!r.ok) throw new Error("não achei o banco.json aqui do lado");
      await publicar(await r.json());
    }catch(e){ telaAdmin("Não consegui buscar o banco.json: " + e.message); }
  };

  $("#bIr").onclick = () => abrirComGrupo(dono.id);
  $("#bSair").onclick = sairDaConta;
}

/* ---------- abrir o app já com grupo ---------- */
async function abrirComGrupo(g){
  telaCarregando("Baixando as questões");
  try{
    const gd = await N.api.getDoc(ref("grupos", g));
    if(gd.exists()) N.grupoNome = gd.data().nome || null;
  }catch(e){ N.grupoNome = null; }
  let curso = null;
  try{ curso = await lerBancoDoGrupo(g); }catch(e){ curso = null; }
  if(curso && curso.itens.length){ guardarBanco(curso); }
  else { curso = bancoGuardado(); }
  if(!curso || !curso.itens.length) return telaSemBanco();

  window.CURSO = curso;
  indexarBanco();

  const remoto = await baixarProgresso();
  if(remoto){ S = { ...S, ...juntarProgresso(S, remoto) }; salvar(); }

  telaInicio();
  sincronizarAgora();
}

/* ============================================================
   Arranque
   Em arquivo único o banco já veio embutido; na PWA ele chega
   por fetch — e, mais adiante, do Firestore. Um ponto de entrada só.
   ============================================================ */
async function iniciar(){
  /* Com Firebase configurado (a versão publicada), o caminho é
     entrar → convite → questões. Sem Firebase (o arquivo único que roda
     offline no computador), o banco já veio junto e o app abre direto. */
  if(window.FIREBASE_CONFIG){
    try{ await nuvemCarregar(); }
    catch(e){
      const guardado = bancoGuardado();
      if(guardado){ window.CURSO = guardado; indexarBanco(); return telaInicio(); }
      return molduraEntrada('<h1>Sem conexão</h1><p class="sub">Não consegui falar com o servidor. ' +
        'Conecte-se à internet e abra de novo.</p>');
    }
    telaCarregando("Entrando");
    N.api.onAuthStateChanged(N.auth, async (u) => {
      N.usuario = u;
      if(!u) return telaEntrar(N.erroRedirecionamento);
      try{ await registrarUsuario(); }catch(e){}
      let g = localStorage.getItem(CHAVE_GRUPO);
      if(!g){
        try{ g = (await meusGrupos())[0] || null; }catch(e){ g = null; }
        if(g) localStorage.setItem(CHAVE_GRUPO, g);
      }
      if(location.hash === "#organizar") return telaAdmin();
      if(!g) return telaConvite();
      N.grupo = g;
      await abrirComGrupo(g);
    });
    return;
  }

  if(typeof CURSO === "undefined" || !CURSO){
    try{
      const r = await fetch("banco.json?v=" + (window.VERSAO_BANCO || "0"), { cache:"no-cache" });
      if(!r.ok) throw new Error("HTTP " + r.status);
      window.CURSO = await r.json();
    }catch(e){
      const local = location.protocol === "file:";
      document.getElementById("app").innerHTML =
        '<div style="padding:28px;font:600 15px/1.6 system-ui;color:#16202b">' +
        '<h2 style="margin:0 0 10px">Não consegui carregar as questões</h2>' +
        (local
          ? '<p style="color:#5a6b7c">Este arquivo não funciona abrindo direto do computador — ' +
            'ele precisa estar publicado num endereço. Use o <b>arquivo único</b> se quiser ' +
            'estudar offline pelo computador, ou abra o app pelo endereço da internet.</p>'
          : '<p style="color:#5a6b7c">Verifique sua conexão e recarregue. ' +
            'Se o problema continuar, me avise.</p>') +
        '</div>';
      return;
    }
  }
  indexarBanco();
  telaInicio();
}
iniciar();
