}

/* Sem a correção do Claude, o app NÃO pede para a pessoa se corrigir.

   Essa era a primeira versão, e a Isabela cortou na hora: "eu não quero marcar
   o que eu escrevi. Quero que você leia minha resposta e avalie se eu escrevi
   ou não o que é esperado". Ela tem razão, e o motivo é o que a questão
   discursiva tem de melhor — quem já sabe o que era esperado lê a própria
   resposta e enxerga o que quer enxergar. Se a correção é a própria pessoa
   marcando caixinha, a questão vira um cartão de memória com passos extras.

   Então: sem correção, a questão fica SEM NOTA. Aparece a resposta dela ao lado
   do que a professora esperava, para ela poder comparar com os próprios olhos,
   e um botão para tentar corrigir de novo. A folha de resultado mostra a
   questão como "esperando correção", e não como zero — porque não é zero, é
   uma questão que ninguém corrigiu ainda. */
function mostrarSemCorrecao(it, texto, porque){
  const g = it.gab || {};
  const val = valorDaQuestao(it);
  $("#correcao").innerHTML = `
    <div class="corr">
      <div class="semCorr">
        <b>Esta questão ficou sem nota.</b>
        <span>${esc(porque)}</span>
      </div>
      ${g.resposta ? `<div class="secaoP">O que a professora esperava</div>
        <p class="gabTexto">${esc(g.resposta)}</p>` : ""}
      ${(g.pontos || []).length ? `<div class="secaoP">Os pontos da questão (valem ${val})</div>
        ${g.pontos.map(pt => `<div class="pnt"><span class="ic">·</span>
          <span class="tx"><b>${esc(pt.t || pt)}</b>${pt.peso ? `<span>peso ${pt.peso}</span>` : ""}</span>
        </div>`).join("")}` : ""}
      ${(g.armadilhas || []).length ? `<div class="secaoP">Onde costuma cair ponto</div>
        ${g.armadilhas.map(a => `<div class="pnt extra"><span class="ic">⚠️</span>
          <span class="tx"><b>${esc(a)}</b></span></div>`).join("")}` : ""}
      <div class="secaoP">O que você escreveu</div>
      <p class="gabTexto suaResp">${esc(texto)}</p>
    </div>`;
  guardarRespostaDeProva(it, null, { texto, semCorrecao: porque });
  $(".foot").innerHTML = barraTempoHTML()
    + `<button class="btn ghost sm" id="tentarDeNovo">Tentar corrigir de novo</button>
       <div style="height:8px"></div>
       <button class="btn" id="seguirDisc">Continuar</button>`;
  $("#seguirDisc").onclick = () => { SES.respondido = true; avancar(it, false); };
  $("#tentarDeNovo").onclick = async () => {
    $("#tentarDeNovo").disabled = true;
    $("#tentarDeNovo").textContent = "Corrigindo…";
    const c = correcaoLigada() ? await pedirCorrecao(it, texto) : null;
    if(c) mostrarCorrecaoDoClaude(it, texto, c);
    else { $("#tentarDeNovo").disabled = false; $("#tentarDeNovo").textContent = "Tentar corrigir de novo"; }
  };
  rolarParaCorrecao();
}
function rolarParaCorrecao(){
  const el = document.getElementById("correcao");
  if(el) setTimeout(() => el.scrollIntoView({ behavior:"smooth", block:"start" }), 80);
}

/* ---------- falar com a correção do Claude ----------

   Quem chama é o app; quem tem a chave é a função no Firebase. O app manda
   apenas o id da prova, o id da questão e o texto que a pessoa escreveu — o
   gabarito NÃO vai daqui. A função lê o gabarito do próprio Firestore, e é por
   isso que não adianta alguém mandar um gabarito inventado para ganhar nota.

   Se a função não existir, não estiver ligada, ou der erro, a correção por
   conta própria assume. O app nunca fica sem saída. */
/* A correção não é uma opção que alguém liga: ela é a questão discursiva.
   O app tenta corrigir sempre que tem com quem falar — logado, dentro de um
   grupo, e com o módulo de funções carregado. Quem controla o gasto é a própria
   função, que tem limite por pessoa e por grupo, por dia. Um interruptor aqui
   só criaria um estado em que a discursiva não funciona e ninguém entende por
   quê — foi o que a Isabela viu na primeira versão e cortou. */
function correcaoLigada(){
  return !!(N.ligado && N.usuario && N.grupo && N.funcoes && N.api && N.api.httpsCallable);
}
async function pedirCorrecao(it, texto){
  const pv = SES && SES.prova;
  /* Tentativas são por prova comprada — dona do grupo tem infinitas (testar
     a prova não pode custar moeda dela). Sem tentativa sobrando, nem chama a
     função: economiza o gasto real e explica por quê em português. */
  if(pv && !souDonoDoGrupo() && tentativasRestantes(pv, it.id) <= 0){
    N.erroCorrecao = `Suas correções desta questão acabaram. Recarregue por ${PRECO_RECARGA} moedas na tela de resultado da prova.`;
    return null;
  }
  try{
    N.erroCorrecao = null;
    const chamar = N.api.httpsCallable(N.funcoes, "corrigirDiscursiva");
    const r = await chamar({ grupo: N.grupo, prova: pv ? pv.id : null,
                             questao: it.id, resposta: texto });
    const d = r && r.data;
    if(!d || d.nota == null) return null;
    /* Só desconta a tentativa numa correção que de fato aconteceu — uma
       chamada que falhou por rede ou teto do dia não deve custar nada. */
    if(pv && !souDonoDoGrupo()){
      S.provasCompradas = S.provasCompradas || {};
      const acesso = S.provasCompradas[pv.id] || { tentativas: tentativasIniciais(pv) };
      acesso.tentativas = acesso.tentativas || {};
      acesso.tentativas[it.id] = Math.max(0, tentativasRestantes(pv, it.id) - 1);
      S.provasCompradas[pv.id] = acesso;
      salvar();
    }
    return d;
  }catch(e){
    /* Sem rede, limite do dia estourado, função fora do ar. A questão fica sem
       nota e a pessoa lê, em português, por quê. Nunca trava a prova. */
    N.erroCorrecao = (e && e.message) ? String(e.message) : null;
    return null;
  }
}

/* ============================================================
   PROVAS ANTERIORES — o simulado da prova de verdade

   Ideia da Isabela: reproduzir no app a prova que a professora aplicou em
   outros anos, exatamente como ela cobrou — as de assinalar, as de V ou F, e
   as discursivas. E a regra dela, que decide o resto do desenho:

     "responder essas provas não entra no ranking"

   Então uma prova aqui não dá XP, não mexe no XP da semana, e não mexe nas
   caixas da repetição espaçada. Ela é um retrato de como você iria hoje, não
   um jeito alternativo de pontuar.

   O que ela mexe: o dia conta como estudado. Fazer uma prova inteira e o app
   dizer que você não estudou hoje seria mentira — e a ofensiva mede estudo,
   não competição.

   Um exercício de prova vive em CURSO.provas, não em CURSO.itens: ele não é
   sorteado nas baterias e não aparece na conta de "acertadas". São duas coisas
   diferentes e misturá-las estragaria as duas.
   ============================================================ */
/* Compra de prova com moedas. Quem organiza o grupo (souDonoDoGrupo) nunca
   paga — ela monta as provas e precisa testar. O preço dá acesso permanente
   ao enunciado e a duas correções por questão discursiva; a "prévia da prova
   inteira antes de comprar" que está no desenho AINDA NÃO existe nesta versão
   — comprar já entra direto respondendo. */
function jaTemAcesso(pv){ return souDonoDoGrupo() || !!(S.provasCompradas && S.provasCompradas[pv.id]); }
function tentativasIniciais(pv){
  const t = {};
  (pv.questoes || []).forEach(q => { if(q.t === "discursiva" || q.t === "vfjust") t[q.id] = TENTATIVAS_POR_COMPRA; });
  return t;
}
function tentativasRestantes(pv, questaoId){
  if(souDonoDoGrupo()) return Infinity;
  const p = S.provasCompradas && S.provasCompradas[pv.id];
  if(!p) return 0;
  const n = p.tentativas ? p.tentativas[questaoId] : undefined;
  return n == null ? TENTATIVAS_POR_COMPRA : n;
}
function garantirAcessoEAbrir(pv, abrir){
  if(jaTemAcesso(pv)) return abrir();
  if(saldoMoedas() < PRECO_PROVA){
    return caixaAviso("Moedas insuficientes",
      `Esta prova custa ${PRECO_PROVA} moedas e você tem ${saldoMoedas()} agora. Continue estudando — bateria, ofensiva, conquistas e liga rendem moedas.`);
  }
  caixaConfirma(`Comprar "${pv.nome}"?`,
    `Custa ${PRECO_PROVA} moedas (seu saldo: ${saldoMoedas()}) e dá acesso permanente ao enunciado, com ${TENTATIVAS_POR_COMPRA} correções por questão discursiva. Depois disso, recarregar as tentativas custa ${PRECO_RECARGA}.`,
    "Comprar",
    () => {
      gastarMoedas(PRECO_PROVA);
      S.provasCompradas = S.provasCompradas || {};
      S.provasCompradas[pv.id] = { tentativas: tentativasIniciais(pv) };
      salvar(); publicarPlacar();
      abrir();
    });
}
function recarregarTentativas(pv){
  if(saldoMoedas() < PRECO_RECARGA){
    return caixaAviso("Moedas insuficientes",
      `Recarregar custa ${PRECO_RECARGA} moedas e você tem ${saldoMoedas()}.`);
  }
  caixaConfirma("Recarregar tentativas?",
    `Por ${PRECO_RECARGA} moedas, as correções desta prova voltam a ${TENTATIVAS_POR_COMPRA} por questão discursiva.`,
    "Recarregar",
    () => {
      gastarMoedas(PRECO_RECARGA);
      S.provasCompradas[pv.id] = { tentativas: tentativasIniciais(pv) };
      salvar(); publicarPlacar();
      telaProvaFim(pv);
    });
}

function provasDisponiveis(){
  return (CURSO.provas || []).slice().sort((a,b) =>
    (b.ano || 0) - (a.ano || 0) || String(a.nome).localeCompare(String(b.nome)));
}
function provaPorId(id){ return (CURSO.provas || []).find(p => p.id === id) || null; }
function valorDaQuestao(q){ return q.valor == null ? 1 : q.valor; }
function feitoDaProva(id){ return (S.provasFeitas || {})[id] || null; }

/* Quanto a pessoa tirou no que já respondeu desta prova. Cada questão devolve
   uma nota entre 0 e o valor dela — as objetivas são 0 ou cheio, a discursiva
   pode ser parcial, que é como a professora corrige. */
function notaDaProva(pv, feito){
  let tirou = 0, valeu = 0;
  let esperando = 0;
  questoesDaVez(pv, feito).forEach(q => {
    const r = feito && feito.respostas ? feito.respostas[q.id] : null;
    if(!r) return;
    /* Questão respondida e ainda não corrigida NÃO conta como zero: ela sai da
       conta inteira, de cima e de baixo. Zerar quem escreveu uma resposta que
       ninguém leu seria inventar uma nota. */
    if(r.nota == null){ esperando++; return; }
    valeu += valorDaQuestao(q);
    tirou += Math.max(0, Math.min(valorDaQuestao(q), r.nota));
  });
  return { tirou: Math.round(tirou * 10) / 10, valeu: Math.round(valeu * 10) / 10,
           total: valorDaProva(pv, feito), esperando };
}

/* "Escolha quatro das questões abaixo e as responda."

   A prova de verdade faz isso, e ignorar seria mudar a prova. As questões com
   `opcional:true` só entram se a pessoa escolher, e a prova diz quantas em
   `escolher`. As obrigatórias (V ou F, relacionar) entram sempre.

   A escolha fica guardada com a tentativa: quem sai no meio volta para as
   mesmas quatro, e a nota é calculada só sobre elas. */
function opcionaisDa(pv){ return (pv.questoes || []).filter(q => q.opcional); }
function escolhidasDa(pv, feito){
  const op = opcionaisDa(pv);
  if(!op.length) return null;
  const guardadas = feito && feito.escolhidas;
  if(guardadas && guardadas.length) return guardadas;
  return null;
}
function questoesDaVez(pv, feito){
  const esc = escolhidasDa(pv, feito);
  return (pv.questoes || []).filter(q => !q.opcional || !esc || esc.includes(q.id));
}
function valorDaProva(pv, feito){
  const esc = escolhidasDa(pv, feito);
  const fixo = (pv.questoes || []).filter(q => !q.opcional)
                 .reduce((s,q) => s + valorDaQuestao(q), 0);
  const op = opcionaisDa(pv);
  if(!op.length) return fixo;
  if(esc) return fixo + op.filter(q => esc.includes(q.id))
                          .reduce((s,q) => s + valorDaQuestao(q), 0);
  /* Ainda não escolheu: vale o que a prova valeria: as obrigatórias mais o
     número de opcionais que a prova manda escolher. Somar as sete opcionais
     mostraria 100 numa prova de 70. */
  const quantas = Math.min(pv.escolher || op.length, op.length);
  const ordenadas = op.map(valorDaQuestao).sort((a,b) => b - a);
  return fixo + ordenadas.slice(0, quantas).reduce((s,v) => s + v, 0);
}

function telaEscolherQuestoes(pv, aoTerminar){
  const op = opcionaisDa(pv);
  const quantas = pv.escolher || op.length;
  let sel = [];
  const desenhar = () => {
    abrirCaixa(`
      <h3>Escolha ${plural(quantas, "questão", "questões")}</h3>
      <p class="cxSub">Parte discursiva — ${plural(op.length, "questão disponível", "questões disponíveis")}</p>
      <p class="muted" style="margin:12px 0">Na prova de verdade você escolhe quais responder. Leia
        todas antes de decidir — dá para ver os enunciados inteiros aqui.</p>
      ${op.map((q, k) => `<button class="escQ ${sel.includes(q.id) ? "on" : ""}" data-escq="${esc(q.id)}">
        <span class="ck2">${sel.includes(q.id) ? "✓" : ""}</span>
        <span class="tx"><b>${k + 1}.</b> ${esc(q.enunciado)}
          <span class="vale">${plural(valorDaQuestao(q), "ponto", "pontos")}</span></span>
      </button>`).join("")}`,
      `<button class="btn" id="okEsc" ${sel.length === quantas ? "" : "disabled"}>${
        sel.length === quantas ? "Começar a prova"
        : "Escolha mais " + plural(quantas - sel.length, "questão", "questões")}</button>
       <div style="height:8px"></div>
       <button class="btn ghost" id="cancelEsc">Cancelar</button>`,
      null, "larga");
    document.querySelectorAll("[data-escq]").forEach(b => b.onclick = () => {
      const id = b.dataset.escq;
      if(sel.includes(id)) sel = sel.filter(x => x !== id);
      else if(sel.length < quantas) sel.push(id);
      desenhar();
    });
    document.getElementById("okEsc").onclick = () => { fecharCaixa(); aoTerminar(sel); };
    document.getElementById("cancelEsc").onclick = () => { fecharCaixa(); telaProvas(); };
  };
  desenhar();
}

function comecarProva(pv, recomecar){
  const antes = feitoDaProva(pv.id);
  if(antes && antes.terminada && !recomecar){
    return caixaConfirma("Refazer esta prova?",
      "Você já respondeu esta prova. Refazer apaga o resultado anterior e começa do zero.",
      "Refazer", () => comecarProva(pv, true));
  }
  if(recomecar || !antes){
    S.provasFeitas = S.provasFeitas || {};
    S.provasFeitas[pv.id] = { comecou: Date.now(), respostas:{}, terminada:false };
    salvar();
  }
  let feito = feitoDaProva(pv.id);
  /* Prova com questão opcional pergunta antes quais entram, e só depois começa. */
  if(opcionaisDa(pv).length && !escolhidasDa(pv, feito)){
    return telaEscolherQuestoes(pv, sel => {
      S.provasFeitas[pv.id].escolhidas = sel;
      salvar();
      comecarProva(pv, false);
    });
  }
  const fila = questoesDaVez(pv, feito).filter(q => !feito.respostas[q.id]);
  if(!fila.length) return telaProvaFim(pv);
  SES = { fila, i:0, acertos:0, total: questoesDaVez(pv, feito).length, respondido:false,
          vistos: Object.keys(feito.respostas), estourou:0, log:[],
          inicio: Date.now(), valeRanking:false, prova: pv,
          motivoSemRanking: "prova antiga não entra no ranking" };
  /* Relógio só se a prova tiver duração declarada. Prova sem tempo marcado é
     para estudar com calma; pôr um cronômetro inventado seria pressão à toa. */
  SES.fim = pv.minutos ? Date.now() + pv.minutos * 60000 : null;
  render();
  if(SES.fim) tocarRelogio();
}

/* Guarda a resposta de uma questão da prova. `nota` vai de 0 ao valor dela. */
function guardarRespostaDeProva(it, nota, extra){
  const pv = SES && SES.prova;
  if(!pv) return;
  S.provasFeitas = S.provasFeitas || {};
  const f = S.provasFeitas[pv.id] = S.provasFeitas[pv.id] || { comecou: Date.now(), respostas:{}, terminada:false };
  f.respostas[it.id] = Object.assign({ nota, valor: valorDaQuestao(it), quando: Date.now() }, extra || {});
  salvar();
}

/* ---------- lista de provas ---------- */
/* Prévia da prova, para decidir se vale comprar antes de gastar moeda.
   Mostra enunciado, texto de apoio e valor de cada questão — NUNCA o
   gabarito, mesmo indiretamente (por isso relacionar/ordem não mostram os
   pares/sequência aqui, só o enunciado). */
function telaPreviaProva(pv){
  aba = "estudar";
  const corpo = `
  <div class="hero"><h1>${esc(pv.nome)}</h1></div>
  <p class="muted" style="margin:0 0 14px">Prévia — dá para ler todas as questões antes de
    decidir. Nada de gabarito: nas de relacionar e ordenar, os itens aparecem embaralhados,
    sem dizer qual vai com qual.</p>
  <div class="cardz" style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;margin-bottom:14px">
    <span>🪙 <b>${saldoMoedas()}</b> moedas</span>
    <span class="muted" style="font-size:12.5px">esta prova custa ${PRECO_PROVA}</span>
  </div>
  ${(pv.questoes || []).map((q, k) => {
    let extra = "";
    if((q.opcoes || []).length){
      extra = `<ul style="margin:8px 0 0;padding-left:18px">${q.opcoes.map(o => `<li>${esc(o)}</li>`).join("")}</ul>`;
    }
    if(q.t === "relacionar" && (q.pares || []).length){
      /* Mostra os dois lados de verdade — os fármacos e as definições —
         só que embaralhados e SEPARADOS, sem dizer qual vai com qual.
         Ver a lista inteira é o que convence a comprar; ver o par pronto
         é entregar o gabarito. */
      const esq = q.pares.map(p => p[0]);
      const dir = [...q.pares.map(p => p[1])].sort(() => Math.random() - 0.5);
      extra = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px">
        <ul style="margin:0;padding-left:18px">${esq.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
        <ul style="margin:0;padding-left:18px">${dir.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      </div>`;
    }
    if(q.t === "ordem" && (q.seq || []).length){
      const embaralhado = [...q.seq].sort(() => Math.random() - 0.5);
      extra = `<ul style="margin:8px 0 0;padding-left:18px">${embaralhado.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
        <p class="muted" style="margin:6px 0 0;font-size:12px">A ordem certa aparece só depois de comprar.</p>`;
    }
    if((q.t === "vf" || q.t === "vfjust") && (q.itens || []).length){
      /* Bloco de várias afirmações sob a mesma questão — mostra todas, sem
         dizer qual é verdadeira ou falsa. */
      extra = `<ul style="margin:8px 0 0;padding-left:18px">${
        q.itens.map((s, i) => `<li>${i + 1}. ${esc(s.frase)}</li>`).join("")}</ul>`;
    }
    if(q.t === "discursiva" && (q.partes || []).length){
      /* Cada parte (a, b, c...) aparece como texto — sem caixa de resposta
         nenhuma aqui, é só pra saber o tamanho da questão antes de comprar. */
      extra = `<ul style="margin:8px 0 0;padding-left:18px;list-style:none">${
        q.partes.map(p => `<li style="margin-bottom:4px">${esc(p)}</li>`).join("")}</ul>`;
    }
    return `
    <div class="cardz" style="margin-bottom:10px;padding:14px 16px">
      <p class="muted" style="margin:0 0 6px;font-size:12px">${k + 1}. ${TITULO_TIPO[q.t] || q.t} · ${
        plural(valorDaQuestao(q), "ponto", "pontos")}${q.opcional ? " · opcional" : ""}</p>
      ${imagemDaQuestao(q)}
      ${q.apoio ? `<div class="apoio" style="margin-bottom:8px">${esc(q.apoio)}</div>` : ""}
      <p style="margin:0">${esc(enunciadoDe(q).replace(/\[\[\d+\]\]/g, "___"))}</p>
      ${extra}
    </div>`;
  }).join("")}`;
  montarTela(corpo, { rodape:
    `<button class="btn" id="comprarDaPrevia">Comprar por ${PRECO_PROVA} moedas</button>
     <div style="height:10px"></div>
     <button class="btn ghost" id="voltarPrevia">Voltar</button>` });
  $("#voltarPrevia").onclick = () => telaProvas();
  ligarImagensDaQuestao();
  $("#comprarDaPrevia").onclick = () => garantirAcessoEAbrir(pv, () => {
    const feito = feitoDaProva(pv.id);
    if(feito && feito.terminada) return telaProvaFim(pv);
    comecarProva(pv);
  });
}

function telaProvas(){
  aba = "estudar";
  const lista = provasDisponiveis();
  /* Três níveis: disciplina → grupo (P3, P4...) → prova específica.
     Sem o grupo no meio, Farmacologia mostrava duas provas com o nome
     "Farmacologia P3" repetido, e a diferença entre elas só aparecia num
     texto pequeno embaixo — fácil de confundir qual é qual. */
  const porDisc = {};
  lista.forEach(pv => { (porDisc[pv.disc] = porDisc[pv.disc] || []).push(pv); });
  const discsComProva = Object.keys(porDisc)
    .map(id => discPorId[id])
    .filter(Boolean)
    .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));

  const corpo = `
  <div class="hero"><h1>Provas anteriores</h1></div>
  <p class="muted" style="margin:0 0 16px">As provas que já caíram, do jeito que a professora
    cobrou. Serve para saber como você iria hoje — por isso <b>não conta para o ranking</b>:
    sem XP, sem mexer nas suas revisões.</p>
  ${!souDonoDoGrupo() ? `<div class="cardz" style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;margin-bottom:14px">
    <span>🪙 <b>${saldoMoedas()}</b> moedas</span>
    <span class="muted" style="font-size:12.5px">cada prova custa ${PRECO_PROVA}</span>
  </div>` : ""}
  ${!lista.length ? `<div class="cardz"><b>Ainda não tem prova cadastrada.</b>
    <p class="muted" style="margin:6px 0 0">Quem organiza o grupo publica as provas junto com o
    banco de questões.</p></div>` : discsComProva.map(d => {
      const porGrupo = {};
      porDisc[d.id].forEach(pv => {
        const g = pv.grupo || "Provas";
        (porGrupo[g] = porGrupo[g] || []).push(pv);
      });
      return `
      <div class="secao">${esc(d.emoji)} ${esc(d.nome)}</div>
      <div class="cardz" style="padding:6px 14px;margin-bottom:14px">
        ${Object.keys(porGrupo).sort().map(g => {
          const chave = d.id + "/" + g;
          const aberto = gruposProvasAbertos.has(chave);
          const provasDoGrupo = porGrupo[g];
          return `
          <button class="dhead ${aberto ? "on" : ""}" data-grupo-abre="${esc(chave)}">
            <span class="ic">📄</span>
            <span class="tx"><b>${esc(g)}</b><span>${plural(provasDoGrupo.length, "prova", "provas")}</span></span>
            <span class="dseta">${aberto ? "⌄" : "›"}</span>
          </button>
          ${aberto ? provasDoGrupo.map(pv => {
            const feito = feitoDaProva(pv.id);
            const n = feito ? notaDaProva(pv, feito) : null;
            const respondidas = feito ? Object.keys(feito.respostas || {}).length : 0;
            const total = questoesDaVez(pv, feito).length;
            const trancada = !jaTemAcesso(pv);
            return `<button class="esc" style="padding-left:12px" data-prova-abrir="${esc(pv.id)}">
              <span class="ic" style="${trancada ? "filter:grayscale(1);opacity:.45" : ""}">${esc(d.emoji)}</span>
              <span class="tx"><b>${esc(pv.nome)}</b><span>${esc(pv.sub || "")}${pv.sub ? " · " : ""}${
                plural(total, "questão", "questões")}
                · ${valorDaProva(pv, feito)} pontos${pv.minutos ? " · " + pv.minutos + " min" : ""}${
                !trancada && feito && feito.terminada ? ` · <b>você tirou ${n.tirou} de ${n.total}</b>`
                : !trancada && respondidas ? ` · começada (${respondidas}/${total})` : ""}</span></span>

                ? `<span style="text-align:center;line-height:1.25">
                     <span style="display:block;font-weight:800;white-space:nowrap">${PRECO_PROVA} 🪙</span>

/* ---------- folha de resultado ---------- */
function telaProvaFim(pv){
  pararRelogio();
  const feito = feitoDaProva(pv.id) || { respostas:{} };
  feito.terminada = true; salvar();
  const n = notaDaProva(pv, feito);
  /* A nota é sobre o que foi corrigido, não sobre a prova inteira. Com uma
     discursiva esperando correção, dividir pelo total daria uma porcentagem que
     não quer dizer nada. */
  const pc = n.valeu ? Math.round(100 * n.tirou / n.valeu) : 0;
  const corpo = `
  <div class="hero"><h1>${esc(pv.nome)}</h1></div>
  <div class="cardz" style="text-align:center;padding:22px 16px">
    <div class="notaGrande">${n.tirou}<small>/${n.valeu}</small></div>
    <p class="muted" style="margin:6px 0 0">${pc}% do que foi corrigido${
      n.valeu !== n.total ? ` · a prova toda vale ${n.total}` : ""}</p>
  </div>
  ${n.esperando ? `<div class="cardz avisoCorr">
    <b>⏳ ${plural(n.esperando, "questão está", "questões estão")} esperando correção.</b>
    <p class="muted" style="margin:6px 0 0">Elas não entraram na nota — e não valeram zero. Toque
      nelas para ler a sua resposta ao lado do gabarito, ou para tentar corrigir de novo.</p>
  </div>` : ""}
  <p class="muted" style="margin:14px 0">Esta nota é só sua — não vai para o grupo, não entra no
    ranking e não mexeu nas suas revisões. Toque numa questão para rever.</p>
  ${questoesDaVez(pv, feito).map((q, k) => {
    const r = feito.respostas[q.id];
    const val = valorDaQuestao(q);
    const semNota = r && r.nota == null;
    const nota = (r && !semNota) ? Math.max(0, Math.min(val, r.nota)) : 0;
    const cor = !r ? "vazia" : semNota ? "esperando"
              : nota >= val ? "cheia" : nota > 0 ? "parcial" : "zero";
    const rest = (q.t === "discursiva" || q.t === "vfjust") && !souDonoDoGrupo() ? tentativasRestantes(pv, q.id) : null;
    return `<button class="qLinha ${cor}" data-rever-q="${esc(q.id)}">
      <span class="nq">${k + 1}</span>
      <span class="tx"><b>${esc(enunciadoDe(q).replace(/\[\[\d+\]\]/g, "___").slice(0, 70))}${
        enunciadoDe(q).length > 70 ? "…" : ""}</b>
        <span>${TITULO_TIPO[q.t] || q.t}${rest != null ? ` · ${rest} correç${rest===1?"ão":"ões"} restante${rest===1?"":"s"}` : ""}</span></span>
      <span class="nt">${!r ? "—" : semNota ? "⏳" : nota}<small>/${val}</small></span>
    </button>`;
  }).join("")}`;
  const semTentativas = !souDonoDoGrupo() && questoesDaVez(pv, feito)
    .some(q => (q.t === "discursiva" || q.t === "vfjust") && tentativasRestantes(pv, q.id) <= 0);
  montarTela(corpo, { comNav:false, rodape:
    `${semTentativas ? `<button class="btn ghost" id="recarregar">🪙 Recarregar tentativas (${PRECO_RECARGA} moedas)</button>
     <div style="height:10px"></div>` : ""}
     <button class="btn ghost" id="refazer">Refazer esta prova</button>
     <div style="height:10px"></div>
     <button class="btn" id="voltarProvas">Voltar às provas</button>` });
  $("#voltarProvas").onclick = () => { SES = null; telaProvas(); };
  $("#refazer").onclick = () => comecarProva(pv, false);
  if(semTentativas) $("#recarregar").onclick = () => recarregarTentativas(pv);
  document.querySelectorAll("[data-rever-q]").forEach(b => b.onclick = () => {
    const q = (pv.questoes || []).find(x => x.id === b.dataset.reverQ);
    const ordem = questoesDaVez(pv, feito).indexOf(q) + 1;
    const r = feito.respostas[q.id] || {};
    const gab = `<b>O que a professora esperava:</b><br>${esc(gabaritoEmTexto(q))}`;
    const minha = r.texto ? `<br><br><b>O que você escreveu:</b><br>${esc(r.texto)}` : "";
    const pendente = r.nota == null && r.texto
      ? `<br><br><i>${esc(r.semCorrecao || "Ainda sem correção.")}</i>` : "";
    /* Sem nota mas com texto salvo: dá pra tentar corrigir de novo usando a
       MESMA resposta, sem reescrever nada — é o que o aviso da folha promete
       e antes não existia de verdade, só o texto prometendo. */
    const podeTentar = r.nota == null && r.texto && tentativasRestantes(pv, q.id) > 0;
    if(!podeTentar){
      caixaAviso(`Questão ${ordem}`,
        (r.comentario ? esc(r.comentario) + "<br><br>" : "") + gab + minha + pendente,
        esc(enunciadoDe(q)));
      return;
    }
    abrirCaixa(`<h3>Questão ${ordem}</h3><p class="cxSub">${esc(enunciadoDe(q))}</p>
      <p style="margin:14px 0 0">${gab}${minha}${pendente}</p>`,
      `<button class="btn" id="tentarAgora">Tentar corrigir agora</button>
       <div style="height:8px"></div>
       <button class="btn ghost" id="fecharRever">Fechar</button>`);
    $("#fecharRever").onclick = fecharCaixa;
    $("#tentarAgora").onclick = async () => {
      const btn = $("#tentarAgora");
      btn.disabled = true; btn.textContent = "Corrigindo…";
      /* pedirCorrecao usa SES.prova pra saber qual prova/gabarito buscar —
         reler uma prova já terminada pode acontecer com SES limpo ou apontando
         para outra coisa, então garante isso antes de chamar. */
      if(!SES || !SES.prova) SES = { ...(SES || {}), prova: pv };
      const c = correcaoLigada() ? await pedirCorrecao(q, r.texto) : null;
      if(c){
        const val = valorDaQuestao(q);
        const nota = Math.max(0, Math.min(val, Number(c.nota) || 0));
        guardarRespostaDeProva(q, nota, { texto: r.texto, comentario: c.resumo || "", porIA:true });
        fecharCaixa();
        telaProvaFim(pv);
      }else{
        btn.disabled = false; btn.textContent = "Tentar corrigir agora";
        caixaAviso("Não deu dessa vez", esc(N.erroCorrecao
          || "Não consegui falar com a correção agora. Pode ser a internet, ou o limite do dia."));
      }
    };
  });
}
/* O enunciado mora num campo diferente em cada tipo: `enunciado` na maioria,
   `frase` no verdadeiro-ou-falso, `texto` nas lacunas. A folha de resultado
   precisa de um só, senão a linha da questão aparece em branco — foi o que
   aconteceu com a V ou F na primeira versão desta tela. */
function enunciadoDe(q){
  return q.enunciado || q.frase || q.p || q.texto || "";
}
function gabaritoEmTexto(q){
  if(q.t === "discursiva") return (q.gab && q.gab.resposta) || "";
  if(q.t === "vfjust") return (q.itens || []).map((s, k) => (k+1) + ". " + (s.correta ? "Verdadeiro" : "Falso")
      + " — " + s.frase + (s.correta ? "" : (s.just ? "\n   Justificativa esperada: " + s.just : ""))).join("\n\n");
  if(q.t === "vf") return (q.itens && q.itens.length)
    ? q.itens.map((s, k) => (k+1) + ". " + (s.correta ? "Verdadeiro" : "Falso") + " — " + s.frase).join("\n")
    : (q.correta ? "Verdadeiro" : "Falso");
  if(q.t === "mcq")  return (q.opcoes || [])[q.correta] || "";
  if(q.t === "multi") return (q.corretas || []).map(i => (q.opcoes || [])[i]).join(" · ");
  if(q.t === "escrita") return q.resp || "";
  if(q.t === "relacionar") return (q.pares || []).map(p => p[0] + " → " + p[1]).join("\n");
  return "";
}

/* ============================================================
   NUVEM — Firebase (autenticação + Firestore)

   Só liga se window.FIREBASE_CONFIG existir. No arquivo único ele não
   existe, e o app roda exatamente como antes: banco embutido, progresso
   no próprio aparelho, sem login. É de propósito — é a versão que
   funciona offline no computador, sem depender de nada.

   Nada aqui decide permissão. Quem decide é o Firestore, pelas regras
   em firestore.rules. O que está deste lado é só a experiência.
   ============================================================ */
/* O endereço do SDK é trocável para os testes poderem rodar contra um dublê
   que obedece às mesmas regras. Em produção, window.SDK_BASE não existe. */
const SDK = window.SDK_BASE || "https://www.gstatic.com/firebasejs/12.17.1/";

const N = { ligado:false, pronto:false, auth:null, db:null, funcoes:null, storage:null, api:{},
            usuario:null, grupo:null, papel:null };

const CHAVE_CACHE  = "fixaai_cache_banco";
const CHAVE_GRUPO  = "fixaai_grupo";

async function nuvemCarregar(){
  if(!window.FIREBASE_CONFIG) return false;
  const [a, au, fs] = await Promise.all([
    import(SDK + "firebase-app.js"),
    import(SDK + "firebase-auth.js"),
    import(SDK + "firebase-firestore.js")
  ]);
  const app = a.initializeApp(window.FIREBASE_CONFIG);
  N.auth = au.getAuth(app);
  N.db   = fs.getFirestore(app);
  N.api  = { ...au, ...fs };
  /* A correção das discursivas é a única coisa no app que precisa de Cloud
     Functions, e ela não pode derrubar o resto: sem o módulo, a discursiva
     apenas fica sem nota e diz isso. Por isso o import é separado e com rede
     de proteção. */
  try{
    const fn = await import(SDK + "firebase-functions.js");
    N.funcoes = fn.getFunctions(app, window.REGIAO_FUNCOES || "us-central1");
    N.api.httpsCallable = fn.httpsCallable;
  }catch(e){ N.funcoes = null; }
  /* Upload de imagem (lâmina, equipamento de laboratório) é opcional — se o
     módulo não carregar, só o botão de enviar imagem some, o resto do app
     continua de pé. */
  try{
    const st = await import(SDK + "firebase-storage.js");
    N.storage = st.getStorage(app);
    N.api = { ...N.api, ...st };
  }catch(e){ N.storage = null; }
  N.ligado = true;
  /* Quem estava no meio de um redirecionamento de uma versão antiga do app
     ainda pode voltar por aqui. Recolhemos o resultado para não deixar essa
     pessoa presa, mas nenhum caminho novo produz redirecionamento. */
  if(sessionStorage.getItem("fixaai_redirecionando")){
    sessionStorage.removeItem("fixaai_redirecionando");
    try{ await N.api.getRedirectResult(N.auth); }
    catch(e){ N.erroRedirecionamento = traduzErro(e); }
  }
  return true;
}

/* ---------- entrar e sair ----------

   AQUI MORAVA O BUG DO "SAÍ DA CONTA E NÃO CONSIGO MAIS ENTRAR".

   A versão anterior mandava iPhone, Safari e app instalado na tela de início
   entrarem por `signInWithRedirect`. Esse caminho está quebrado para nós, e a
   quebra é silenciosa: o redirecionamento passa por um iframe hospedado em
   fixaai-59643.firebaseapp.com, que é um domínio DIFERENTE do endereço do app
   (fixaai.github.io). Chrome 115+, Safari 16.1+ e Firefox 109+ bloqueiam o
   acesso a armazenamento de terceiros, o iframe não consegue guardar o estado,
   e a pessoa volta do Google exatamente para a tela de login — sem erro nenhum
   na tela e sem erro nenhum no console.

   A documentação do próprio Firebase lista `signInWithPopup` como a alternativa
   recomendada para esse caso, porque o pop-up é uma janela de verdade: ela
   devolve a credencial por postMessage para quem a abriu, sem depender de
   armazenamento de terceiros. Então é pop-up em toda plataforma, sem exceção.

   Se algum dia o app ganhar domínio próprio e o authDomain passar a ser o mesmo
   endereço, o redirecionamento volta a funcionar e pode ser reconsiderado. Até
   lá, oferecê-lo seria oferecer um caminho que não chega a lugar nenhum. */

/* ---------- entrar sem sair do endereço do app ----------

   O caminho antigo mandava a pessoa para fixaai-59643.firebaseapp.com e trazia
   de volta. Dois endereços diferentes — e o Safari do iPhone separa o
   armazenamento por site, então o pedaço do login que rodava lá não enxergava o
   que tinha sido guardado aqui. O resultado era a tela "missing initial state",
   que a Yasmin viu, e não havia jeito de contornar de dentro do app.

   Agora quem cuida da identificação é a biblioteca do próprio Google, rodando
   NESTA página. Ela devolve um bilhete assinado (o "credential"), e o Firebase
   aceita esse bilhete direto. Nenhum momento do login sai de fixaai.github.io,
   então a separação de armazenamento deixa de importar — no iPhone, no Android
   e no computador igualmente.

   O caminho antigo continua no código como reserva: se a biblioteca do Google
   não carregar (rede ruim, bloqueador de anúncios), aparece o botão de sempre.
   Ficar sem nenhuma forma de entrar seria pior do que qualquer um dos dois. */
function carregarGoogle(){
  if(window.__gsiPromessa) return window.__gsiPromessa;
  window.__gsiPromessa = new Promise((ok, falhou) => {
    if(!window.GOOGLE_CLIENT_ID) return falhou(new Error("sem client id"));
    if(window.google && google.accounts && google.accounts.id) return ok();
    const t = setTimeout(() => falhou(new Error("demorou")), 6000);
    const sc = document.createElement("script");
    sc.src = "https://accounts.google.com/gsi/client";
    sc.async = true; sc.defer = true;
    sc.onload = () => { clearTimeout(t); ok(); };
    sc.onerror = () => { clearTimeout(t); falhou(new Error("não carregou")); };
    document.head.appendChild(sc);
  });
  return window.__gsiPromessa;
}
async function botaoDoGoogle(onde, aoFalhar){
  try{
    await carregarGoogle();
    google.accounts.id.initialize({
      client_id: window.GOOGLE_CLIENT_ID,
      auto_select: false,
      callback: async (resp) => {
        try{
          telaCarregando("Entrando");
          const cred = N.api.GoogleAuthProvider.credential(resp.credential);
          await N.api.signInWithCredential(N.auth, cred);
        }catch(e){ telaEntrar(traduzErro(e)); }
      }
    });
    const largura = Math.min(360, Math.max(240, onde.getBoundingClientRect().width || 300));
    google.accounts.id.renderButton(onde, {
      type:"standard", theme:"outline", size:"large", shape:"pill",
      text:"signin_with", logo_alignment:"center", locale:"pt-BR", width: Math.round(largura)
    });
    return true;
  }catch(e){ aoFalhar && aoFalhar(); return false; }
}

function provedorGoogle(){
  const p = new N.api.GoogleAuthProvider();
  p.setCustomParameters({ prompt: "select_account" });
  return p;
}

async function entrarComGoogle(){
  /* Reserva, para quando a biblioteca do Google não carrega. Chamado direto do
     clique, sem nenhum await antes: navegador só deixa abrir janela enquanto o
     gesto da pessoa ainda está "quente". */
  return N.api.signInWithPopup(N.auth, provedorGoogle());
}
/* Não existe entrada por e-mail e senha, de propósito. Ter um campo de senha
   fazia o navegador oferecer "salvar senha neste site", o que dá a impressão de
   que o app quer a senha do e-mail da pessoa — e criava um beco sem saída para
   quem digitava um endereço já cadastrado pelo Google. Com o Google, nenhuma
   senha passa por aqui. */
async function sairDaConta(){
  /* sem isto o Google reentra sozinho com a mesma conta na próxima abertura,
     e quem tem duas contas nunca consegue trocar */
  try{ if(window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); }catch(e){}
  try{ await N.api.signOut(N.auth); }catch(e){}
  localStorage.removeItem(CHAVE_GRUPO);
  localStorage.removeItem(CHAVE_CACHE);
  location.reload();
}

/* ---------- grupos ---------- */
const ref  = (...p) => N.api.doc(N.db, ...p);
const cole = (...p) => N.api.collection(N.db, ...p);

async function meusGrupos(){
  /* A lista fica no documento da pessoa só por conveniência, para o app não
     precisar adivinhar. Ela NÃO vale como permissão: quem pode ler o banco
     de um grupo é decidido pela existência do registro de membro, conferida
     pelo servidor. Uma lista adulterada só faz o app tentar e levar não. */
  const d = await N.api.getDoc(ref("usuarios", N.usuario.uid));
  return (d.exists() && d.data().grupos) || [];
}

async function registrarUsuario(){
  const u = N.usuario;
  await N.api.setDoc(ref("usuarios", u.uid), {
    nome: u.displayName || (u.email || "").split("@")[0],
    email: u.email || null,
    foto: u.photoURL || null,
    ultimoAcesso: N.api.serverTimestamp()
  }, { merge: true });
}

/* A data vem como Timestamp do Firestore, mas pode chegar como número em
   cache ou em teste. Uma função só evita a comparação silenciosamente errada
   que deixaria passar um convite vencido. */
function emMilissegundos(v){
  if(v == null) return 0;
  if(typeof v === "number") return v;
  if(typeof v.toMillis === "function") return v.toMillis();
  if(v.seconds != null) return v.seconds * 1000;
  const d = new Date(v);
  return isNaN(d) ? 0 : d.getTime();
}

async function entrarNoGrupoPorCodigo(codigo){
  codigo = String(codigo || "").trim().toUpperCase();
  if(!codigo) throw new Error("Digite o código do convite.");

  const cv = await N.api.getDoc(ref("convites", codigo));
  if(!cv.exists()) throw new Error("Não encontrei esse código. Confira se digitou certo.");
  const c = cv.data();
  if(!c.ativo) throw new Error("Este convite foi desativado.");
  if(c.usos >= c.maxUsos) throw new Error("Este convite já atingiu o limite de pessoas.");
  if(emMilissegundos(c.expiraEm) && emMilissegundos(c.expiraEm) < Date.now())
    throw new Error("Este convite venceu. Peça um código novo.");

  const u = N.usuario;
  await N.api.setDoc(ref("grupos", c.grupo, "membros", u.uid), {
    nome: u.displayName || (u.email || "").split("@")[0],
    entrouEm: N.api.serverTimestamp(),
    papel: "membro",
    viaConvite: codigo
  });
  await N.api.updateDoc(ref("convites", codigo), { usos: N.api.increment(1) });
  await N.api.setDoc(ref("usuarios", u.uid),
    { grupos: N.api.arrayUnion(c.grupo) }, { merge: true });
  return c.grupo;
}

/* ---------- o banco de questões ----------

   O Firestore NÃO aceita lista dentro de lista. As questões de relacionar
   guardam os pares como [["esquerda","direita"], ...] — exatamente o formato
   proibido. Na ida cada par vira {e,d}; na volta, par de novo. O resto do app
   continua vendo pares como sempre viu.                                    */
function paraNuvem(it){
  if(!Array.isArray(it.pares)) return it;
  return { ...it, pares: it.pares.map(p => ({ e: p[0], d: p[1] })) };
}
function daNuvem(it){
  if(!Array.isArray(it.pares)) return it;
  return { ...it, pares: it.pares.map(p => Array.isArray(p) ? p : [p.e, p.d]) };
}
/* Rede de proteção: se um tipo novo de exercício trouxer outra lista aninhada,
   quero saber na hora de publicar, com o caminho exato, e não um erro genérico. */
function acharListaAninhada(v, caminho){
  if(Array.isArray(v)){
    for(let i = 0; i < v.length; i++){
      if(Array.isArray(v[i])) return caminho + "[" + i + "]";
      const f = acharListaAninhada(v[i], caminho + "[" + i + "]");
      if(f) return f;
    }
    return null;
  }
  if(v && typeof v === "object"){
    for(const k of Object.keys(v)){
      const f = acharListaAninhada(v[k], caminho + "." + k);
      if(f) return f;
    }
  }
  return null;
}

async function lerBancoDoGrupo(g){
  const q = await N.api.getDocs(cole("grupos", g, "banco"));
  if(q.empty) return null;
  const curso = { disciplinas:[], topicos:[], itens:[], provas:[] };
  const vistos = new Set();
  q.forEach(d => {
    const b = d.data();
    (b.disciplinas || []).forEach(x => { if(!vistos.has("d"+x.id)){ vistos.add("d"+x.id); curso.disciplinas.push(x); } });
    (b.topicos || []).forEach(x => { if(!vistos.has("t"+x.id)){ vistos.add("t"+x.id); curso.topicos.push(x); } });
    (b.itens || []).forEach(x => { if(!vistos.has("i"+x.id)){ vistos.add("i"+x.id); curso.itens.push(daNuvem(x)); } });
    /* As provas antigas moram num documento só, separado das questões do
       banco: elas não são sorteadas nas baterias, e a Cloud Function que
       corrige as discursivas precisa de um caminho fixo onde achar o gabarito.
       Ver funcoes/index.js. */
    (b.provas || []).forEach(pv => {
      if(vistos.has("pv"+pv.id)) return;
      vistos.add("pv"+pv.id);
      curso.provas.push({ ...pv, questoes: (pv.questoes || []).map(daNuvem) });
    });
  });
  return curso;
}

/* ---------- progresso na nuvem ---------- */
const CAMPOS_SINC = ["prog","xp","xpSemana","semana","ofensiva","ultimoDia","dia",
                     "feitosHoje","recorde",
                     "datas","foco","historico","reportes","apelido","emoji","marcadas",
                     "provasFeitas",
                     "horizonte","marcos","congelados",
                     "nivel","sala","semanaSala","semanaPassada","ligaVista","pod1","pod2","gelos",
                     "desafiosVistos","desafiosGanhos","desafiosExpiradosVistos",
                     "moedasGanhas","moedasGastas","provasCompradas","marcosMoedas","brindeBoasVindas",
                     "onboardingCompleto","genero","termosAceitos","termosVersao",
                     "emojisComprados","paletaComprada","paleta"];

function juntarProgresso(local, remoto){
  /* Mesma conta em dois aparelhos: fica o mais adiantado de cada questão,
     e o maior de cada contador. Nunca perde acerto de ninguém. */
  if(!remoto) return local;
  const fora = { ...local };
  const p = { ...(remoto.prog || {}) };
  Object.keys(local.prog || {}).forEach(id => {
    const a = local.prog[id], b = p[id];
    p[id] = (!b || (a.reps || 0) >= (b.reps || 0)) ? a : b;
  });
  fora.prog = p;
  /* XP total só sobe: o maior dos dois é sempre o certo. */
  fora.xp = Math.max(local.xp || 0, remoto.xp || 0);
  /* Moedas: ganhas só sobem, igual XP. Gastas também só sobem — mas aqui o
     "maior dos dois" é o lado mais cauteloso: se um aparelho já gastou e o
     outro ainda não sabe, o total gasto tem que refletir a compra real. */
  fora.moedasGanhas = Math.max(local.moedasGanhas || 0, remoto.moedasGanhas || 0);
  fora.moedasGastas = Math.max(local.moedasGastas || 0, remoto.moedasGastas || 0);
  /* Provas compradas: união dos ids, e para tentativas restantes fica o MENOR
     dos dois valores — nunca ressuscita uma correção já usada num aparelho
     que o outro ainda não sabia. */
  {
    const pc = { ...(remoto.provasCompradas || {}) };
    Object.entries(local.provasCompradas || {}).forEach(([pid, loc]) => {
      const rem = pc[pid];
      if(!rem){ pc[pid] = loc; return; }
      const tent = { ...(rem.tentativas || {}) };
      Object.entries(loc.tentativas || {}).forEach(([qid, n]) => {
        tent[qid] = tent[qid] == null ? n : Math.min(tent[qid], n);
      });
      pc[pid] = { tentativas: tent };
    });
    fora.provasCompradas = pc;
  }
  fora.marcosMoedas = { ofensiva: Math.max((local.marcosMoedas||{}).ofensiva || 0,
                                            (remoto.marcosMoedas||{}).ofensiva || 0) };
  fora.brindeBoasVindas = !!(local.brindeBoasVindas || remoto.brindeBoasVindas);
  /* Onboarding: uma vez feito em qualquer aparelho, vale pros dois — ninguém
     deveria responder gênero/termos de novo só porque trocou de celular. Os
     dados escolhidos (apelido/emoji/gênero) já vêm de outros campos da lista;
     aqui só o "aconteceu ou não" e a versão dos termos aceitos. */
  fora.onboardingCompleto = !!(local.onboardingCompleto || remoto.onboardingCompleto);
  fora.termosAceitos = !!(local.termosAceitos || remoto.termosAceitos);
  fora.termosVersao = local.termosVersao || remoto.termosVersao || null;
  fora.genero = local.genero != null ? local.genero : remoto.genero;
  /* Emoji e paleta comprados: união — comprou num aparelho, vale nos dois. */
  fora.emojisComprados = [...new Set([...(local.emojisComprados || []), ...(remoto.emojisComprados || [])])];
  fora.paletaComprada = !!(local.paletaComprada || remoto.paletaComprada);
  fora.desafiosExpiradosVistos = [...new Set([...(local.desafiosExpiradosVistos || []),
                                              ...(remoto.desafiosExpiradosVistos || [])])].slice(-200);

  /* Os outros três contadores zeram sozinhos — xpSemana no domingo, feitosHoje
     à meia-noite — e por isso não dá para pegar o maior sem olhar de que dia e
     de que semana cada número é. Sem essa conferência, o aparelho que ficou
     parado desde sexta ressuscitaria o XP da semana passada só de sincronizar. */
  const semL = local.semana || null, semR = remoto.semana || null;
  if(semR && semL && semR > semL){          // a nuvem já virou a semana, aqui não
    fora.semana = semR; fora.xpSemana = remoto.xpSemana || 0;
    fora.sala = remoto.sala == null ? null : remoto.sala;
    fora.semanaSala = remoto.semanaSala || null;
    if(remoto.semanaPassada) fora.semanaPassada = remoto.semanaPassada;
  }else if(semR && semL && semR < semL){    // a nuvem está atrasada: ignora o número dela
    fora.xpSemana = local.xpSemana || 0;
  }else{
    fora.xpSemana = Math.max(local.xpSemana || 0, remoto.xpSemana || 0);
    if(semR && !semL) fora.semana = semR;
  }

  const diaL = local.dia || null, diaR = remoto.dia || null;
  if(diaR && diaL && diaR > diaL){ fora.dia = diaR; fora.feitosHoje = remoto.feitosHoje || 0; }
  else if(diaR && diaL && diaR < diaL){ fora.feitosHoje = local.feitosHoje || 0; }
  else{
    fora.feitosHoje = Math.max(local.feitosHoje || 0, remoto.feitosHoje || 0);
    if(diaR && !diaL) fora.dia = diaR;
  }

  fora.historico = { ...(remoto.historico || {}), ...(local.historico || {}) };
  fora.datas     = { ...(remoto.datas || {}), ...(local.datas || {}) };
  if(remoto.recorde) fora.recorde = Math.min(local.recorde || 1e9, remoto.recorde);
  /* Apelido, emoji e ajustes de estudo viajam com a conta. A regra é simples:
     num aparelho recém-instalado, tudo vem da nuvem — é o tablet novo que tem
     que ficar igual ao celular. Num aparelho já em uso, o que está aqui é o que
     a pessoa acabou de escolher aqui, e não pode ser sobrescrito por um valor
     antigo que estava lá em cima. */
  const aparelhoNovo = !Object.keys(local.prog || {}).length
                    && !Object.keys(local.datas || {}).length
                    && !(local.apelido || "").trim();
  /* marcos são acumulados: o que foi conquistado num aparelho vale nos dois */
  const m = { ...(remoto.marcos || {}), ...(local.marcos || {}) };
  m.perfeitas   = Math.max((local.marcos||{}).perfeitas   || 0, (remoto.marcos||{}).perfeitas   || 0);
  m.ofensivaMax = Math.max((local.marcos||{}).ofensivaMax || 0, (remoto.marcos||{}).ofensivaMax || 0);
  m.vespera     = !!((local.marcos||{}).vespera || (remoto.marcos||{}).vespera);
  m.conquistas  = [...new Set([ ...((local.marcos||{}).conquistas || []),
                                ...((remoto.marcos||{}).conquistas || []) ])];
  fora.marcos = m;
  /* Coisas que descrevem a CONTA, e não o aparelho: em que liga a pessoa está,
     em que sala, quantos pódios e congelamentos tem, quantos desafios ganhou.

     Elas não estavam sendo juntadas, e o estrago era duplo: abrir num aparelho
     novo mostrava tudo zerado — foi o que a Isabela viu ao entrar pelo tablet —
     e, pior, esse zero subia por cima do que estava certo na nuvem na primeira
     sincronia. Perdia liga, pódio e congelamento de uma vez.

     Contador junta pelo maior; lista junta pela união; e o lugar na liga desta
     semana vem da nuvem quando o aparelho é novo, porque aqui ele não existe. */
  ["pod1","pod2","gelos","desafiosGanhos"].forEach(k =>
    fora[k] = Math.max(local[k] || 0, remoto[k] || 0));
  fora.congelados = [...new Set([ ...(local.congelados || []), ...(remoto.congelados || []) ])];
  /* Marcou no celular, aparece marcada no tablet. União, nunca subtração:
     desmarcar num aparelho e sincronizar do outro traz a marca de volta, e é
     melhor errar para o lado de rever demais do que sumir com a marca. */
  fora.marcadas = [...new Set([ ...(local.marcadas || []), ...(remoto.marcadas || []) ])];
  /* Provas antigas: fica a tentativa mais recente de cada prova, e as respostas
     das duas se somam — quem começou no celular e terminou no tablet não perde
     o que já respondeu. */
  const pf = { ...(remoto.provasFeitas || {}) };
  Object.keys(local.provasFeitas || {}).forEach(id => {
    const a = local.provasFeitas[id], b = pf[id];
    if(!b){ pf[id] = a; return; }
    if((a.comecou || 0) !== (b.comecou || 0)){ pf[id] = (a.comecou || 0) >= (b.comecou || 0) ? a : b; return; }
    pf[id] = { ...b, ...a, respostas: { ...(b.respostas || {}), ...(a.respostas || {}) },
               terminada: !!(a.terminada || b.terminada) };
  });
  fora.provasFeitas = pf;
  /* Agora que histórico e dias congelados dos dois aparelhos estão juntos, a
     ofensiva sai da conta — nenhum dos dois números que vieram é usado. É o
     único jeito de os dois chegarem ao mesmo resultado sempre. */
  arrumarOfensiva(fora);
  fora.desafiosVistos = [...new Set([ ...(local.desafiosVistos || []),
                                      ...(remoto.desafiosVistos || []) ])].slice(-200);
  ["nivel","sala","semanaSala","semanaPassada","ligaVista","horizonte"].forEach(k => {
    if(aparelhoNovo && remoto[k] !== undefined && remoto[k] !== null) fora[k] = remoto[k];
  });
  /* Num aparelho já em uso, o nível ainda vem da nuvem se lá estiver mais alto:
     subir de liga acontece no aparelho que abriu primeiro no domingo, e o outro
     não pode continuar achando que está no bronze. */
  if(!aparelhoNovo && remoto.nivel){
    const iL = LIGAS.findIndex(l => l.id === (local.nivel || "bronze"));
    const iR = LIGAS.findIndex(l => l.id === remoto.nivel);
    if(iR > iL) fora.nivel = remoto.nivel;
    if(iR > iL || (local.sala == null && remoto.sala != null)){
      fora.sala = remoto.sala; fora.semanaSala = remoto.semanaSala;
    }
  }

  ["apelido","emoji"].forEach(k => {
    fora[k] = aparelhoNovo ? (remoto[k] || local[k] || "") : (local[k] || remoto[k] || "");
  });
  fora.meta = SESSAO; fora.segPorQuestao = SEG_POR_QUESTAO; fora.esperaMin = ESPERA_MIN;
  return fora;
}

/* ============================================================
   O QUE O GRUPO VÊ

   Duas coisas saem do privado, cada uma numa coleção própria dentro do grupo:

     placar/{uid}  — apelido, emoji, XP, ofensiva, pódios, desafios, conquistas.
                     É o que faz existir ranking, liga e perfil das colegas.
     datas/{uid}   — as datas de prova que a pessoa marcou, para o app poder
                     sugerir a data que a maioria da turma escolheu.

   O progresso item a item continua em progresso/{uid}, que só a dona lê. Nada
   do que a pessoa errou sai daqui.
   ============================================================ */
async function publicarPlacar(){
  if(!N.ligado || !N.usuario || !N.grupo) return;
  const dados = {
    apelido: (S.apelido || "").trim().slice(0, 14),
    emoji: (S.emoji || "").slice(0, 8),
    xp: Math.max(0, Math.round(S.xp || 0)),
    xpSemana: Math.max(0, Math.round(S.xpSemana || 0)),
    semana: S.semana || domingoDa(hoje()),
    ofensiva: Math.max(0, Math.round(S.ofensiva || 0)),
    nivel: S.nivel || "bronze",
    sala: (S.semanaSala === (S.semana || domingoDa(hoje())) && S.sala != null) ? S.sala : -1,
    semanaSala: S.semanaSala || "",
    semanaPassada: S.semanaPassada || null,
    pod1: Math.max(0, S.pod1 || 0), pod2: Math.max(0, S.pod2 || 0),
    desafios: Math.max(0, S.desafiosGanhos || 0),
    /* Exercícios respondidos e dias estudados andam junto com o XP de propósito:
       XP alto com pouco exercício respondido não fecha, e o grupo inteiro vê.
       Como o servidor não consegue recalcular XP sem plano pago, é isto que
       transforma "confia" em "dá para conferir olhando". */
    feitos: Math.max(0, Math.round(totalRespondidas())),
    dias: Object.keys(S.historico || {}).length,
    conquistas: conquistasGanhas().map(c => c.id).slice(0, 60),
    atualizadoEm: N.api.serverTimestamp()
  };
  try{ await N.api.setDoc(ref("grupos", N.grupo, "placar", N.usuario.uid), dados, { merge:true }); }
  catch(e){ /* sem rede ou sem permissão: tenta na próxima */ }
}
async function publicarDatas(){
  if(!N.ligado || !N.usuario || !N.grupo) return;
  const datas = {};
  Object.entries(S.datas || {}).slice(0, 60).forEach(([k, v]) => { if(v) datas[k] = v; });
  try{
    await N.api.setDoc(ref("grupos", N.grupo, "datas", N.usuario.uid),
      { datas, atualizadoEm: N.api.serverTimestamp() });
  }catch(e){}
}
/* A data que a maioria do grupo marcou para cada prova. Só a mais votada, e só
   se pelo menos duas pessoas concordarem — uma pessoa só não é "a turma". */
let SUGESTOES = {};
async function baixarSugestoesDeData(){
  if(!N.ligado || !N.grupo) return;
  try{
    const q = await N.api.getDocs(cole("grupos", N.grupo, "datas"));
    const contagem = {};
    q.forEach(d => {
      const meu = d.id === (N.usuario && N.usuario.uid);
      Object.entries((d.data() || {}).datas || {}).forEach(([chave, data]) => {
        if(!data) return;
        contagem[chave] = contagem[chave] || {};
        contagem[chave][data] = (contagem[chave][data] || 0) + 1;
        if(meu) contagem[chave].__minha = data;
      });
    });
    const fora = {};
    Object.entries(contagem).forEach(([chave, votos]) => {
      const minha = votos.__minha;
      const lista = Object.entries(votos).filter(([d]) => d !== "__minha")
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      if(!lista.length) return;
      const [data, quantos] = lista[0];
      if(quantos < 2 || data === minha) return;   // sugestão só de turma, e só se for novidade
      fora[chave] = { data, quantos };
    });
    SUGESTOES = fora;
  }catch(e){ SUGESTOES = {}; }
}

/* ============================================================
   A LIGA

   Sem Cloud Functions ninguém "fecha a liga" no servidor no sábado à meia-noite.
   Cada aparelho vira a semana quando é aberto, e a liga tem que continuar
   fazendo sentido mesmo assim. Três decisões seguram isso de pé:

   1. VAGA SÓ QUANDO JOGA. Ninguém entra numa sala até completar a primeira
      bateria que vale ranking da semana. Quem não abriu o app não ocupa cadeira,
      e a lista nunca parece vazia.

   2. A SALA FICA GRAVADA. Ao entrar, o aparelho procura no placar do grupo a
      primeira sala do seu nível com menos de oito pessoas e grava o número no
      próprio placar. Depois disso a sala não muda mais naquela semana — é o que
      impede a lista de embaralhar enquanto a turma vai chegando.
      Duas pessoas entrando no mesmo segundo podem escolher a mesma última vaga
      e a sala fica com nove. Isso é aceitável: acerta sozinho na semana seguinte,
      e nove numa lista é melhor do que travar a entrada de alguém.

   3. O RETRATO DA SEMANA. Quem vira a semana guarda em `semanaPassada` o que
      fez na anterior, antes de zerar. É assim que quem abre domingo à noite
      ainda enxerga a classificação de sábado, com metade da turma já zerada.
   ============================================================ */
/* Um XP que não fecha com o número de exercícios respondidos.

   O servidor não consegue recalcular XP sem plano pago, mas a conta é simples e
   o app pode fazer: mesmo acertando tudo, com sequência cheia e bônus de tempo,
   um exercício não passa de uns 25 de XP. Quarenta por exercício é folgado o
   bastante para nunca acusar quem estudou de verdade, e apertado o bastante para
   um número inventado aparecer sozinho na lista, com uma ⚠️ ao lado, sem
   ninguém precisar acusar ninguém. */
function naoFecha(p){
  if(!p) return null;
  const feitos = p.feitos || 0, xp = p.xp || 0;
  if(xp < 500) return null;                       // pouco XP não dá para julgar
  if(feitos > 0 && xp <= feitos * 40) return null;
  return "Este XP não fecha com o número de exercícios respondidos.";
}
function nivelDe(id){ return LIGAS.find(l => l.id === id) || LIGAS[0]; }
function subirDescer(id, delta){
  const i = LIGAS.findIndex(l => l.id === id);
  const j = Math.max(0, Math.min(LIGAS.length - 1, (i < 0 ? 0 : i) + delta));
  return LIGAS[j].id;
}
/* O que cada pessoa fez numa semana dada, olhando o placar atual OU o retrato
   que ela guardou ao virar a semana. */
function daSemanaDe(p, semana){
  if(!p) return null;
  if(p.semana === semana) return { xpSemana: p.xpSemana || 0, nivel: p.nivel || "bronze",
                                   sala: (p.sala == null ? -1 : p.sala) };
  const r = p.semanaPassada;
  if(r && r.semana === semana) return { xpSemana: r.xpSemana || 0, nivel: r.nivel || "bronze",
                                        sala: (r.sala == null ? -1 : r.sala) };
  return null;
}
let CACHE_PLACAR = null;
async function lerPlacar(){
  if(!N.ligado || !N.grupo) return {};
  try{
    const q = await N.api.getDocs(cole("grupos", N.grupo, "placar"));
    const fora = {};
    q.forEach(d => fora[d.id] = d.data());
    CACHE_PLACAR = fora;
    return fora;
  }catch(e){ return CACHE_PLACAR || {}; }
}
/* Entra numa sala do meu nível, se ainda não estou em nenhuma nesta semana. */
async function entrarNaLiga(){
  if(!N.ligado || !N.usuario || !N.grupo) return;
  const semana = S.semana || domingoDa(hoje());
  if(S.semanaSala === semana && S.sala != null) return;      // já tenho vaga
  const placar = await lerPlacar();
  const meuNivel = S.nivel || "bronze";
  const porSala = {};
  Object.entries(placar).forEach(([uid, p]) => {
    if(uid === N.usuario.uid) return;
    const d = daSemanaDe(p, semana);
    if(!d || d.nivel !== meuNivel || d.sala < 0) return;
    porSala[d.sala] = (porSala[d.sala] || 0) + 1;
  });
  let sala = 0;
  while((porSala[sala] || 0) >= TAM_LIGA) sala++;
  S.sala = sala; S.semanaSala = semana; salvar();
  await publicarPlacar();
}
/* Quem está comigo nesta semana, em ordem de XP. */
function minhaLiga(placar, semana, membros){
  const meuNivel = S.nivel || "bronze";
  const minhaSala = (S.semanaSala === semana) ? S.sala : null;
  if(minhaSala == null) return [];
  /* Só entra quem ainda é membro. A liga é montada a partir do placar, e o
     placar de quem saiu do grupo pode sobrar por um tempo — sem este filtro,
     alguém removido continuaria disputando a semana. */
  const doGrupo = membros ? new Set(membros.map(m => m.uid)) : null;
  const gente = [];
  Object.entries(placar || {}).forEach(([uid, p]) => {
    if(doGrupo && !doGrupo.has(uid)) return;
    const d = daSemanaDe(p, semana);
    if(!d || d.nivel !== meuNivel || d.sala !== minhaSala) return;
    gente.push({ uid, placar:p, xpSemana:d.xpSemana });
  });
  return gente.sort((a, b) => b.xpSemana - a.xpSemana
    || String(a.uid).localeCompare(String(b.uid)));
}
/* Fecha a semana que passou: descobre em que lugar eu fiquei, sobe ou desce de
   nível, e conta o pódio. Roda uma vez só por semana, no primeiro app que abrir. */
async function fecharSemanaSePreciso(){
  if(!N.ligado || !N.usuario || !N.grupo) return null;
  const r = S.semanaPassada;
  if(!r || !r.semana || S.ligaVista === r.semana) return null;
  if(r.sala == null || r.sala < 0 || !r.xpSemana){
    S.ligaVista = r.semana; salvar(); return null;           // não joguei aquela semana
  }
  const placar = await lerPlacar();
  const gente = [];
  Object.entries(placar).forEach(([uid, p]) => {
    const d = daSemanaDe(p, r.semana);
    if(!d || d.nivel !== r.nivel || d.sala !== r.sala) return;
    gente.push({ uid, xpSemana: d.xpSemana, placar: p });
  });
  if(!gente.some(x => x.uid === N.usuario.uid))
    gente.push({ uid: N.usuario.uid, xpSemana: r.xpSemana, placar: null });
  gente.sort((a, b) => b.xpSemana - a.xpSemana || String(a.uid).localeCompare(String(b.uid)));
  const pos = gente.findIndex(x => x.uid === N.usuario.uid) + 1;
  if(!pos){ S.ligaVista = r.semana; salvar(); return null; }

  const sobe = pos <= 2 && gente.length >= 3;
  const desce = gente.length >= 4 && pos >= gente.length - 1;
  const nivelAntigo = r.nivel;
  S.nivel = sobe ? subirDescer(nivelAntigo, 1) : desce ? subirDescer(nivelAntigo, -1) : nivelAntigo;
  if(pos === 1) S.pod1 = (S.pod1 || 0) + 1;
  if(pos === 2) S.pod2 = (S.pod2 || 0) + 1;
  ganharMoedas(MOEDAS_LIGA[pos] != null ? MOEDAS_LIGA[pos] : MOEDAS_LIGA_RESTO);
  const gelos = pos === 1 ? nivelDe(nivelAntigo).gelos : 0;
  if(gelos) S.gelos = Math.min(MAX_GELOS, (S.gelos || 0) + gelos);
  S.ligaVista = r.semana;
  salvar(); publicarPlacar();
  return { pos, total: gente.length, xpSemana: r.xpSemana, gelos,
           nivelAntigo: nivelDe(nivelAntigo), nivelNovo: nivelDe(S.nivel), sobe, desce,
           lider: gente[0] ? gente[0].xpSemana : 0 };
}

/* ============================================================
   DESAFIO

   Duas pessoas fazem a MESMA bateria de cinco, na mesma ordem. As cinco são
   sorteadas na hora de criar e ficam gravadas no documento — quem desafia não
   escolhe, senão dava para montar uma bateria fácil combinada.

   Ganha quem acerta mais; empatou, ganha quem levou menos tempo. Quem vence
   leva XP_VITORIA além do XP normal da bateria, e isso conta no ranking. O
   desafio não gasta a espera de 30 minutos: é o outro jeito de pontuar enquanto
   ela corre, que foi o motivo de a Isabela querer que ele valesse ranking.
   ============================================================ */
let CACHE_DESAFIOS = null;
function ehMeuDesafio(d){
  const eu = N.usuario && N.usuario.uid;
  return d.de === eu || d.para === eu;
}
function meuLado(d){ return d.de === (N.usuario && N.usuario.uid) ? "De" : "Para"; }
function outroLado(d){ return meuLado(d) === "De" ? "Para" : "De"; }
function desafioVencido(d){ return emMilissegundos(d.expiraEm) < Date.now(); }
function desafioAberto(d){
  return !desafioVencido(d) && (!d.resDe || !d.resPara);
}
function quemVenceu(d){
  if(!d.resDe || !d.resPara) return null;
  if(d.resDe.acertos !== d.resPara.acertos)
    return d.resDe.acertos > d.resPara.acertos ? d.de : d.para;
  if(d.resDe.ms !== d.resPara.ms) return d.resDe.ms < d.resPara.ms ? d.de : d.para;
  return "empate";
}
async function lerDesafios(){
  if(!N.ligado || !N.usuario || !N.grupo) return [];
  try{
    const col = cole("grupos", N.grupo, "desafios");
    const [a, b] = await Promise.all([
      N.api.getDocs(N.api.query(col, N.api.where("de", "==", N.usuario.uid))),
      N.api.getDocs(N.api.query(col, N.api.where("para", "==", N.usuario.uid)))
    ]);
    const fora = [];
    a.forEach(d => fora.push({ id:d.id, ...d.data() }));
    b.forEach(d => fora.push({ id:d.id, ...d.data() }));
    CACHE_DESAFIOS = fora.sort((x, y) => emMilissegundos(y.criadoEm) - emMilissegundos(x.criadoEm));
    return CACHE_DESAFIOS;
  }catch(e){ return CACHE_DESAFIOS || []; }
}
/* Por que não dá para mandar mais um agora. Devolve o motivo em português, ou
   null se pode. As três travas são as que a Isabela desenhou. */
function porQueNaoPossoDesafiar(lista, alvoUid){
  const eu = N.usuario && N.usuario.uid;
  const abertos = (lista || []).filter(d => desafioAberto(d));
  if(abertos.filter(d => d.de === eu).length >= MAX_ENVIADOS)
    return "Você já tem um desafio esperando resposta. Quando ele for respondido, dá para mandar outro.";
  const ultimo = (lista || []).filter(d => d.de === eu)
    .map(d => emMilissegundos(d.criadoEm)).sort((a, b) => b - a)[0];
  if(ultimo && Date.now() - ultimo < HORAS_ENTRE_DESAFIOS * 3600000){
    const faltam = Math.ceil((HORAS_ENTRE_DESAFIOS * 3600000 - (Date.now() - ultimo)) / 3600000);
    return `Falta ${plural(faltam, "hora", "horas")} para você poder mandar outro desafio.`;
  }
  if(alvoUid && abertos.some(d => (d.de === alvoUid || d.para === alvoUid)))
    return "Vocês duas já têm um desafio em andamento.";
  return null;
}
async function criarDesafio(alvoUid, alvoNome){
  const pool = CURSO.itens.filter(i => i && i.id);
  if(pool.length < DESAFIO_TAM) throw new Error("Não há exercícios suficientes no grupo.");
  const itens = embaralhar(pool.slice()).slice(0, DESAFIO_TAM).map(i => i.id);
  const id = "d" + Date.now().toString(36) + sorteioCodigo().toLowerCase();
  const dados = {
    de: N.usuario.uid, para: alvoUid,
    nomeDe: (S.apelido || "").trim() || N.usuario.displayName || "alguém",
    emojiDe: S.emoji || "🧠",
    itens, resDe: null, resPara: null,
    criadoEm: N.api.serverTimestamp(),
    expiraEm: N.api.Timestamp.fromMillis(Date.now() + 48 * 3600000)
  };
  await N.api.setDoc(ref("grupos", N.grupo, "desafios", id), dados);
  CACHE_DESAFIOS = null;
  return { id, ...dados, criadoEm: Date.now(),
           expiraEm: { toMillis: () => Date.now() + 48 * 3600000 } };
}
/* Começa — ou retoma — a bateria do desafio.

   O relógio do desafio é de parede: começa a correr quando a pessoa abre a
   bateria e não para mais, nem quando ela sai do app, nem enquanto ela lê a
   explicação. Sair no meio não devolve tempo nenhum.

   Sem isso existia uma saída larga: sair do desafio, procurar a resposta com
   calma, e voltar com o cronômetro zerado. Como o tempo é o critério de
   desempate, isso não seria só trapaça de conteúdo — seria trapaça de placar.

   Quem volta dentro do tempo continua de onde parou, com o que já acertou e com
   o tempo que sobrou. Quem volta depois do fim recebe o que tinha acertado até
   sair, e o tempo máximo — como se tivesse errado as últimas e usado a bateria
   inteira. É o mesmo resultado de quem simplesmente deixou o relógio acabar na
   tela, que é como tem que ser. */
function duracaoDoDesafio(fila){
  return (SEG_POR_QUESTAO * 1000) * (fila.length || DESAFIO_TAM);
}
async function jogarDesafio(d){
  const fila = d.itens.map(id => porId[id]).filter(Boolean);
  if(fila.length < 2){
    return caixaAviso("Não deu para montar",
      "As questões deste desafio não estão mais no banco do grupo. Ele vai expirar sozinho.");
  }
  fecharCaixa();
  const emCurso = (S.desafioEmCurso && S.desafioEmCurso.id === d.id) ? S.desafioEmCurso : null;
  const duracao = duracaoDoDesafio(fila);
  const fim = emCurso ? emCurso.fim : Date.now() + duracao;

  if(fim <= Date.now()){
    /* o tempo acabou enquanto a pessoa estava fora */
    const acertos = emCurso ? (emCurso.acertos || 0) : 0;
    SES = { fila, i:fila.length, acertos, total:fila.length, respondido:true, vistos:fila.map(i => i.id),
            estourou: fila.length - (emCurso ? (emCurso.feitas || []).length : 0), log:[],
            inicio: fim - duracao, fim, valeRanking:true, xpAntes:S.xpSemana, modo:"desafio",
            seq:0, xpDaSeq:0, maiorSeq: emCurso ? (emCurso.maiorSeq || 0) : 0,
            xpGanho:0, desafio:d };
    await gravarResultadoDoDesafio(duracao);
    S.desafioEmCurso = null; salvar();
    SES = null;
    return caixaAviso("O tempo deste desafio acabou",
      `Você tinha ${plural(acertos, "acerto", "acertos")} de ${fila.length} quando saiu, e foi isso `
      + "que valeu. O relógio do desafio não para quando você fecha o app — é o que impede sair, "
      + "procurar a resposta e voltar.");
  }

  const feitas = emCurso ? (emCurso.feitas || []) : [];
  SES = { fila, i:feitas.length, acertos: emCurso ? (emCurso.acertos || 0) : 0,
          total:fila.length, respondido:false, vistos: feitas.slice(), estourou:0, log:[],
          inicio: fim - duracao, fim, valeRanking:true, xpAntes:S.xpSemana, modo:"desafio",
          seq: emCurso ? (emCurso.seq || 0) : 0, xpDaSeq: emCurso ? (emCurso.xpDaSeq || 0) : 0,
          maiorSeq: emCurso ? (emCurso.maiorSeq || 0) : 0,
          xpGanho: emCurso ? (emCurso.xpGanho || 0) : 0, desafio:d };
  S.desafioEmCurso = { id:d.id, fim, acertos:SES.acertos, feitas:feitas.slice(),
                       seq:SES.seq, xpDaSeq:SES.xpDaSeq, maiorSeq:SES.maiorSeq, xpGanho:SES.xpGanho };
  salvar();
  render(); tocarRelogio();
}
async function gravarResultadoDoDesafio(msForcado){
  const d = SES && SES.desafio;
  if(!d || !N.ligado) return;
  const campo = "res" + meuLado(d);
  const dados = {};
  dados[campo] = { acertos: SES.acertos,
                   ms: msForcado != null ? msForcado : Math.max(0, Date.now() - SES.inicio) };
  try{
    await N.api.updateDoc(ref("grupos", N.grupo, "desafios", d.id), dados);
    d[campo] = dados[campo];
    CACHE_DESAFIOS = null;
    S.desafioEmCurso = null; salvar();      // acabou: não há mais o que retomar
  }catch(e){}
}
/* O bônus de vitória é dado pelo aparelho de quem venceu, na primeira vez que
   ele vê o desafio fechado. `desafiosVistos` guarda quais já foram contados,
   para o bônus não repetir a cada abertura do app. */
function acertarContasDosDesafios(lista){
  const eu = N.usuario && N.usuario.uid;
  const vistos = new Set(S.desafiosVistos || []);
  let mudou = false, ganhos = [];
  (lista || []).forEach(d => {
    if(desafioAberto(d) || vistos.has(d.id)) return;
    const venc = quemVenceu(d);
    vistos.add(d.id); mudou = true;
    if(venc === eu){
      S.xp += XP_VITORIA; S.xpSemana += XP_VITORIA;
      S.desafiosGanhos = (S.desafiosGanhos || 0) + 1;
      ganharMoedas(MOEDAS_DESAFIO);
      ganhos.push(d);
    }
  });
  if(mudou){ S.desafiosVistos = [...vistos].slice(-200); salvar(); publicarPlacar(); }
  return ganhos;
}

/* ---------- sincronia ----------

   Como isto estava errado, e por que a Isabela viu 176 XP no tablet e 586 no
   celular no mesmo build: a subida era um setDoc com merge:true, e merge:true
   junta CAMPOS, não junta VALORES. Quem escrevia por último mandava o número
   dele por cima do outro. E a leitura acontecia uma vez só, na abertura — o
   aparelho que ficasse aberto nunca mais via o que o outro tinha feito.

   Agora toda subida é lê → junta → grava, com a mesma juntarProgresso da
   abertura, e o app também puxa da nuvem quando volta a ficar visível. Dois
   aparelhos abertos ao mesmo tempo convergem em vez de se atropelar.

   Não é transação: entre a leitura e a escrita cabe a escrita do outro
   aparelho. Na prática isso custa, no máximo, os 15 segundos de uma janelinha
   — e a próxima sincronia de qualquer um dos dois traz o maior de volta,
   porque todo campo aqui junta pelo maior ou pelo mais recente. Sem servidor
   próprio (Cloud Functions pede plano pago), é o mais correto que dá para
   fazer só com regra do Firestore. */
let sincPendente = null, sincUltimo = 0, sincEmCurso = false, ultimoRemoto = null;
function agendarSincronia(){
  /* Escrever a cada questão gastaria cota à toa. Uma escrita a cada 15s,
     mais uma garantida ao fechar o app, dá conta com folga. */
  if(!N.ligado || !N.usuario) return;
  if(sincEmCurso) return;   /* o salvar() de dentro da própria sincronia não reagenda */
  clearTimeout(sincPendente);
  const espera = Math.max(0, 15000 - (Date.now() - sincUltimo));
  sincPendente = setTimeout(sincronizarAgora, espera);
}

/* Junta o que veio da nuvem no que está aqui. Devolve true se algum número
   mudou, para a tela poder se redesenhar. */
function aplicarRemoto(remoto){
  if(!remoto) return false;
  ultimoRemoto = remoto;
  const antes = JSON.stringify(CAMPOS_SINC.map(k => S[k]));
  const junto = juntarProgresso(S, remoto);
  const depois = JSON.stringify(CAMPOS_SINC.map(k => junto[k]));
  if(antes === depois) return false;
  S = { ...S, ...junto };
  return true;
}

async function sincronizarAgora(op){
  if(!N.ligado || !N.usuario) return;
  if(sincEmCurso) return;
  sincEmCurso = true;
  sincUltimo = Date.now();
  clearTimeout(sincPendente);
  let mudou = false;
  /* Fechando o app não dá tempo de ler e depois gravar: o navegador congela a
     página no meio. Então o caminho de saída pula a leitura e junta com o
     último retrato que a gente trouxe da nuvem — assim a última gravação do
     dia continua sendo uma junção, e não um número menor por cima do maior. */
  if(op && op.rapido){
    mudou = aplicarRemoto(ultimoRemoto);
  }else{
    try{
      const d = await N.api.getDoc(ref("progresso", N.usuario.uid));
      if(d.exists()) mudou = aplicarRemoto(d.data());
    }catch(e){ /* sem rede: sobe o que tem, e na próxima a gente lê */ }
  }
  const dados = {};
  CAMPOS_SINC.forEach(k => { if(S[k] !== undefined) dados[k] = S[k]; });
  dados.atualizadoEm = N.api.serverTimestamp();
  try{ await N.api.setDoc(ref("progresso", N.usuario.uid), dados, { merge: true }); }
  catch(e){ /* sem rede: fica local e sobe na próxima */ }
  sincEmCurso = false;
  if(mudou){ salvar(); redesenhar(); }
  publicarPlacar();
}

/* Redesenha a tela em que a pessoa está, sem tirá-la do lugar. Durante uma
   sessão de exercícios não mexe em nada: o número na tela é o da rodada, e
   trocar a tela debaixo de quem está respondendo seria pior que o problema. */
function redesenhar(){
  if(SES) return;                                   /* no meio da rodada, não */
  if(document.getElementById("caixa")) return;      /* com caixa aberta, não */
  /* Ajustes fica de fora de propósito: lá tem campo de texto, e redesenhar
     apagaria o apelido no meio da digitação. */
  if(aba === "inicio")      telaInicio();
  else if(aba === "perfil") telaPerfil();
}

addEventListener("visibilitychange", () => {
  if(document.hidden) sincronizarAgora();
  /* Voltando para o app: puxa antes de qualquer outra coisa. É este o momento
     em que a pessoa pega o tablet depois de ter estudado no celular. */
  else sincronizarAgora();
});
addEventListener("pagehide", () => sincronizarAgora({ rapido:true }));

     e-mail que abre o seletor de contas. A Isabela confirmou que alterna entre a
     conta pessoal e a que organiza o grupo por ali. Um segundo caminho para a
     mesma coisa só ocuparia a tela — e, no iPhone, levaria de volta ao
     redirecionamento que a gente acabou de tirar. */
  const caixa = $("#caixaGoogle");
  const mostrarReserva = () => {
    const b = $("#bGoogle");
    if(b) b.classList.remove("hide");
    if(caixa) caixa.remove();
  };
  if(caixa && window.GOOGLE_CLIENT_ID) botaoDoGoogle(caixa, mostrarReserva);
  else mostrarReserva();
}

function traduzErro(e){
  const c = (e && (e.code || e.message)) || "";
  if(/unauthorized-domain/.test(c))
    return "Este endereço não está autorizado no Firebase. Se você abriu o arquivo direto do "
         + "computador, use o endereço do app na internet. Se já está no endereço certo, "
         + "falta liberá-lo em Authentication → Settings → Authorized domains.";
  if(/operation-not-allowed|configuration-not-found/.test(c))
    return "Esta forma de entrar não está ligada no Firebase. Ative em Authentication → Sign-in method.";
  if(/popup-closed|cancelled-popup/.test(c))
    return "A janela do Google fechou antes de terminar. É só tocar de novo em Entrar com Google.";
  if(/popup-blocked/.test(c))
    return "O navegador bloqueou a janela do Google. Libere os pop-ups para este endereço e tente de novo — "
         + "no iPhone fica em Ajustes → Safari → Bloquear pop-ups.";
  if(/operation-not-supported|web-storage-unsupported/.test(c))
    return "Este navegador está com o armazenamento bloqueado, então o login não consegue se completar. "
         + "Saia da navegação privada, ou abra o app no Safari ou no Chrome normal.";
  if(/too-many-requests/.test(c))   return "Muitas tentativas seguidas. Espere um minuto e tente de novo.";
  if(/network-request-failed|unavailable/.test(c))
                                    return "Sem conexão com o servidor. Confira sua internet.";
  if(/permission-denied/.test(c))   return "Você não tem acesso a esse conteúdo.";
  return (e && e.message) ? String(e.message).replace(/^Firebase:\s*/, "") : "Não consegui completar. Tente de novo.";
}

   Criar o grupo, emitir o código de convite e publicar as questões.
   ============================================================ */
function sorteioCodigo(){
  const letras = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";   // sem I, O, 0, 1: confundem ao ditar
  let f = "";
  const r = new Uint8Array(4);
  crypto.getRandomValues(r);
  for(let i = 0; i < 4; i++) f += letras[r[i] % letras.length];
  return f;
}

      .toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "").slice(0, 6);
    const ano = new Date().getFullYear();
    const codigo = `${base}${ano}-${sorteioCodigo()}`;
    const quantos = +($("#quantos") || {}).value || 60;
    const dias    = +($("#valeAte") || {}).value || 21;

      if(convite) await N.api.updateDoc(ref("convites", convite.codigo), { ativo:false });
      await N.api.setDoc(ref("convites", codigo), {

      });

    }catch(e){ telaAdmin(traduzErro(e)); }
