  async function publicar(curso){
    if(!curso || !curso.itens || !curso.itens.length)
      return telaAdmin("Esse arquivo não parece um banco de questões válido.");
    const porProva = {};
    curso.itens.forEach(i => {
      const k = (i.disc || "geral") + "_" + (i.prova || "p");
      (porProva[k] = porProva[k] || []).push(paraNuvem(i));
    });
    const provasAntigas = (curso.provas || []).map(pv =>
      ({ ...pv, questoes: (pv.questoes || []).map(paraNuvem) }));
    // confere antes de mandar: erro do Firestore aqui não diz qual questão é
    for(const k of Object.keys(porProva)){
      const ruim = acharListaAninhada(porProva[k], k);
      if(ruim) return telaAdmin("Uma questão tem lista dentro de lista, que o Firestore não aceita: " + ruim);
    }
    /* Publicar substitui o que está no ar. Enquanto existir um grupo só, errar
       aqui é chato; com vários grupos, é publicar a prova de uma turma na turma
       errada. Então antes de gravar o app diz, em português, para qual grupo vai
       e o que exatamente vai mudar — e espera a confirmação. */
    const nomeDisc = id => {
      const d = (curso.disciplinas || []).find(x => x.id === id);
      return d ? d.nome : id;
    };
    const nomeProva = (discId, provaId) => {
      const d = (curso.disciplinas || []).find(x => x.id === discId);
      const p = d && (d.provas || []).find(x => x.id === provaId);
      return p ? p.nome : String(provaId || "").toUpperCase();
    };
    const resumoProvas = provasAntigas.length
      ? `<li><b>Provas anteriores</b>: ${provasAntigas.length} (${
          provasAntigas.reduce((n,pv) => n + (pv.questoes||[]).length, 0)} questões)</li>` : "";
    const resumo = resumoProvas + Object.keys(porProva).sort().map(k => {
      const corte = k.lastIndexOf("_");
      const discId = k.slice(0, corte), provaId = k.slice(corte + 1);
      const antes = (jaPublicado[k] || 0);
      const agora = porProva[k].length;
      const nota = !antes ? "novo" : agora === antes ? "sem mudança no total"
                 : agora > antes ? "+" + (agora - antes) : String(agora - antes);
      return `<li><b>${esc(nomeDisc(discId))} ${esc(nomeProva(discId, provaId))}</b>: ${agora} exercícios (${nota})</li>`;
    }).join("");
    const some = Object.keys(jaPublicado).filter(k => !porProva[k]);
    const aviso = some.length
      ? `<p class="muted" style="margin:10px 0 0">Continua no ar, sem ser tocado: ${esc(some.join(", "))}.</p>`
      : "";
    const querPublicar = await new Promise(resolve => {
      abrirCaixa(`<h3>Publicar no grupo?</h3>
        <p class="cxSub">${esc(dono.nome)}</p>
        <ul class="desLista" style="margin-top:12px">${resumo}</ul>
        ${aviso}
        <p class="muted" style="margin:10px 0 0">Cada prova acima é substituída pela versão do
          arquivo. Quem já estuda recebe as questões novas na próxima vez que abrir o app.</p>`,
        `<button class="btn" id="pubSim">Publicar</button>
         <div style="height:8px"></div>
         <button class="btn ghost" id="pubNao">Cancelar</button>`);
      document.getElementById("pubSim").onclick = () => { fecharCaixa(); resolve(true); };
      document.getElementById("pubNao").onclick = () => { fecharCaixa(); resolve(false); };
    });
    if(!querPublicar) return telaAdmin();
    try{
      for(const k of Object.keys(porProva)){
        await N.api.setDoc(ref("grupos", dono.id, "banco", k), {
          disciplinas: curso.disciplinas || [],
          topicos: curso.topicos || [],
          itens: porProva[k],
          atualizadoEm: N.api.serverTimestamp()
        });
      }
      if(provasAntigas.length){
        await N.api.setDoc(ref("grupos", dono.id, "banco", "__provas"), {
          provas: provasAntigas, itens: [],
          atualizadoEm: N.api.serverTimestamp()
        });
      }
      localStorage.removeItem(CHAVE_CACHE);
      telaAdmin();
    }catch(e){ telaAdmin(traduzErro(e)); }
  }

  /* Remover alguém do grupo.

     Faltava, e a Isabela encontrou o buraco do jeito mais direto: pediu para uma
     amiga de fora testar o app, e depois não tinha como tirar ela da lista.
     Desativar a conta no Firebase não resolve — aquilo impede a pessoa de entrar,
     mas o registro de membro continua, e a lista do grupo lê o registro.

     Apaga três coisas: o registro de membro, o placar (senão a pessoa continua
     na liga, que é montada a partir do placar) e as datas de prova que ela tinha
     compartilhado com a turma. O progresso de estudo dela NÃO é tocado: mora na
     conta dela, e se ela voltar com o código, volta de onde parou. */
  /* Reportes: marcar como resolvido (ou reabrir) só grava `lido` no
     documento — nunca apaga, então o histórico de "já corrigi isso" fica
     preservado se você quiser conferir depois. */
  document.querySelectorAll("[data-marcarLido]").forEach(b => b.onclick = async () => {
    const id = b.dataset.marcarLido;
    try{ await N.api.setDoc(ref("grupos", dono.id, "reportes", id), { lido:true }, { merge:true }); }
    catch(e){}
    telaAdmin();
  });
  document.querySelectorAll("[data-reabrir]").forEach(b => b.onclick = async () => {
    const id = b.dataset.reabrir;
    try{ await N.api.setDoc(ref("grupos", dono.id, "reportes", id), { lido:false }, { merge:true }); }
    catch(e){}
    telaAdmin();
  });

  document.querySelectorAll("[data-tirar]").forEach(b => b.onclick = () => {
    const m = listaMembros.find(x => x.uid === b.dataset.tirar);
    if(!m) return;
    caixaConfirma(`Remover ${esc(m.nome || "esta pessoa")}?`,
      "Essa pessoa sai da lista, da liga e do ranking deste grupo, e o placar aqui é apagado. "
      + "O progresso de estudo continua na conta — voltando com o código, volta de onde parou.",
      "Remover do grupo", async () => {
        try{
          await N.api.deleteDoc(ref("grupos", dono.id, "membros", m.uid));
          try{ await N.api.deleteDoc(ref("grupos", dono.id, "placar", m.uid)); }catch(e){}
          try{ await N.api.deleteDoc(ref("grupos", dono.id, "datas", m.uid)); }catch(e){}
          CACHE_MEMBROS = null; CACHE_PLACAR = null;
          telaAdmin();
        }catch(e){ telaAdmin(traduzErro(e)); }
      }, true);
  });

  const bMostrar = $("#bMostrar");
  if(bMostrar) bMostrar.onclick = async () => {
    const querAparecer = !(meuRegistro && meuRegistro.oculto === false);
    bMostrar.disabled = true;
    try{
      await N.api.updateDoc(ref("grupos", dono.id, "membros", N.usuario.uid), { oculto: !querAparecer });
      CACHE_MEMBROS = null;             // a lista do grupo precisa ser lida de novo
      telaAdmin();
    }catch(e){ telaAdmin(traduzErro(e)); }
  };

  $("#bMandarPresente").onclick = async () => {
    const uid = $("#presenteQuem").value;
    const moedas = Math.max(0, Math.round(+$("#presenteMoedas").value || 0));
    const gelos = Math.max(0, Math.round(+$("#presenteGelos").value || 0));
    if(!uid || (!moedas && !gelos)) return;
    const btn = $("#bMandarPresente"); btn.disabled = true; btn.textContent = "Mandando...";
    try{
      /* Soma em cima do que já estiver pendente — se a pessoa ainda não abriu
         o app pra receber o presente anterior, o novo se junta ao invés de
         sobrescrever. */
      let antes = { moedas:0, gelos:0 };
      try{
        const d = await N.api.getDoc(ref("grupos", dono.id, "presentes", uid));
        if(d.exists()) antes = d.data();
      }catch(e){}
      await N.api.setDoc(ref("grupos", dono.id, "presentes", uid), {
        moedas: (antes.moedas || 0) + moedas,
        gelos: (antes.gelos || 0) + gelos,
        de: N.usuario.uid,
        quando: N.api.serverTimestamp()
      });
      caixaAviso("Presente mandado!",
        "A pessoa recebe assim que abrir o app (ou sincronizar, se já estiver aberto).");
    }catch(e){ caixaAviso("Não consegui mandar", esc(traduzErro(e))); }
    btn.disabled = false; btn.textContent = "Mandar";
  };

  $("#bEnviarZip").onclick = () => {
    if(!N.storage) return caixaAviso("Sem conexão de imagem",
      "O envio de imagens não carregou nesta sessão. Feche e abra o app de novo.");
    $("#arqZip").click();
  };
  $("#arqZip").onchange = async () => {
    const zipArq = $("#arqZip").files[0];
    if(!zipArq) return;
    const alvo = $("#resultadoImagem");
    alvo.innerHTML = `<p class="muted">Abrindo o zip…</p>`;

    let JSZip;
    try{
      /* Só carrega essa biblioteca quando alguém realmente vai usar o zip —
         ninguém mais no app paga o custo dela. */
      if(!window.JSZip){
        await new Promise((okResolve, falhou) => {
          const s = document.createElement("script");
          s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
          s.onload = okResolve; s.onerror = falhou;
          document.head.appendChild(s);
        });
      }
      JSZip = window.JSZip;
    }catch(e){
      alvo.innerHTML = `<p class="muted">Não consegui carregar o abridor de zip. Confere a internet e tenta de novo.</p>`;
      return;
    }

    let zip;
    try{ zip = await JSZip.loadAsync(zipArq); }
    catch(e){
      alvo.innerHTML = `<p class="muted">Esse arquivo não parece ser um zip válido.</p>`;
      return;
    }

    /* Só as imagens de dentro — zip de Mac às vezes traz uma pasta
       "__MACOSX" cheia de lixo junto, e pastas não são arquivo nenhum. */
    const entradas = Object.values(zip.files).filter(f =>
      !f.dir && !f.name.startsWith("__MACOSX/") && /\.(jpe?g|png|webp|gif)$/i.test(f.name));

    if(!entradas.length){
      alvo.innerHTML = `<p class="muted">Não achei nenhuma imagem dentro desse zip.</p>`;
      return;
    }

    const mapa = {};
    const erros = [];
    /* Se o Storage não estiver ativado no console (ou as regras não tiverem
       sido publicadas), o pedido de upload fica esperando pra sempre, sem dar
       erro nenhum — e a tela parece travada em "enviando 1 de N" pro resto da
       vida. Um limite de tempo transforma isso num erro visível. */
    const comLimite = (promessa, ms) => Promise.race([
      promessa,
      new Promise((_, falhou) => setTimeout(() => falhou(new Error("Demorou demais — o Storage pode não estar ativado, ou as regras não publicadas.")), ms))
    ]);
    for(let i = 0; i < entradas.length; i++){
      const entrada = entradas[i];
      const nome = entrada.name.split("/").pop();   // tira qualquer pasta do meio, só o nome do arquivo
      alvo.innerHTML = `<p class="muted">Enviando ${i + 1} de ${entradas.length}: ${esc(nome)}…</p>`;
      try{
        const blob = await entrada.async("blob");
        if(blob.size > 5 * 1024 * 1024){
          erros.push(`${nome} (maior que 5 MB)`);
          continue;
        }
        const caminho = N.api.ref(N.storage, `grupos/${dono.id}/imagens/${nome}`);
        await comLimite(N.api.uploadBytes(caminho, blob), 20000);
        mapa[nome] = await comLimite(N.api.getDownloadURL(caminho), 15000);
      }catch(e){
        erros.push(`${nome} (${traduzErro(e)})`);
      }
    }
    const jsonPronto = JSON.stringify(mapa, null, 2);
    alvo.innerHTML = `
      <p class="muted">${Object.keys(mapa).length} de ${entradas.length} enviadas.${
        erros.length ? ` ${erros.length} falharam.` : ""}</p>
      <textarea readonly style="width:100%;height:160px;font-size:11.5px;font-family:monospace"
        id="mapaImagensPronto" onclick="this.select()">${esc(jsonPronto)}</textarea>
      <button class="minibt" id="bCopiarMapa" style="width:100%;margin-top:8px">📋 Copiar tudo</button>
      <p class="muted" style="margin:6px 0 0;font-size:12px">É esse mapa que você cola na conversa
        que está montando as questões.</p>
      ${erros.length ? `<p class="muted" style="margin-top:8px;color:var(--red)">Falharam: ${
        esc(erros.join(", "))}</p>` : ""}`;
    $("#arqZip").value = "";
    $("#bCopiarMapa").onclick = async () => {
      const btn = $("#bCopiarMapa");
      try{
        await navigator.clipboard.writeText(jsonPronto);
        btn.textContent = "✓ Copiado!";
      }catch(e){
        /* Alguns navegadores recusam a área de transferência fora de HTTPS
           ou sem permissão — cai pro jeito antigo, que sempre funciona. */
        const t = $("#mapaImagensPronto"); t.select();
        try{ document.execCommand("copy"); btn.textContent = "✓ Copiado!"; }
        catch(e2){ btn.textContent = "Toque no texto acima e copie manualmente"; }
      }
      setTimeout(() => { btn.textContent = "📋 Copiar tudo"; }, 2500);
    };
  };

  $("#bPubArq").onclick = () => $("#arq").click();
  $("#arq").onchange = async ev => {
    const f = ev.target.files[0];
    if(!f) return;
    try{ await publicar(JSON.parse(await f.text())); }
    catch(e){ telaAdmin("Não consegui ler esse arquivo: " + e.message); }
  };
  $("#bIr").onclick = () => { N.grupo = dono.id; abrirComGrupo(dono.id); };
  $("#bSair").onclick = sairDaConta;
}

/* ---------- abrir o app já com grupo ---------- */
async function abrirComGrupo(g){
  telaCarregando("Baixando as questões");
  try{
    const gd = await N.api.getDoc(ref("grupos", g));
    if(gd.exists()) N.grupoNome = gd.data().nome || null;
  }catch(e){ N.grupoNome = null; }
  /* N.papel decide quem é isenta de pagar moeda (souDonoDoGrupo). Sem ler o
     próprio registro de membro, isso ficava sempre null e a isenção nunca
     funcionava — nem para quem realmente organiza o grupo. */
  try{
    const md = await N.api.getDoc(ref("grupos", g, "membros", N.usuario.uid));
    N.papel = md.exists() ? (md.data().papel || "membro") : "membro";
  }catch(e){ N.papel = "membro"; }
  let curso = null;
  try{ curso = await lerBancoDoGrupo(g); }catch(e){ curso = null; }
  if(curso && curso.itens.length){ guardarBanco(curso); }
  else { curso = bancoGuardado(); }
  if(!curso || !curso.itens.length) return telaSemBanco();

  window.CURSO = curso;
  indexarBanco();

  const remoto = await baixarProgresso();
  if(remoto){ S = { ...S, ...juntarProgresso(S, remoto) }; salvar(); }
  aplicarPaleta();

  if(!S.onboardingCompleto){ telaOnboarding(); sincronizarAgora(); return; }
  telaInicio();
  sincronizarAgora();
  conferirPresentePendente();
  /* O resultado da semana espera a pessoa onde ela abre o app, não escondido na
     aba do grupo — é a notícia mais importante da segunda-feira. */
  lerPlacar().then(fecharSemanaSePreciso).then(r => { if(r) caixaResultadoDaSemana(r); });
  publicarDatas();
  baixarSugestoesDeData().then(() => { if(aba === "ajustes") telaAjustes(); });
}

/* ============================================================
   Arranque
   Em arquivo único o banco já veio embutido; na PWA ele chega
   por fetch — e, mais adiante, do Firestore. Um ponto de entrada só.
   ============================================================ */
async function iniciar(){
  /* Com Firebase configurado (a versão publicada), o caminho é
     entrar → convite → questões. Sem Firebase (o arquivo único que roda
     offline no computador), o banco já veio junto e o app abre direto. */
  if(window.FIREBASE_CONFIG){
    try{ await nuvemCarregar(); }
    catch(e){
      const guardado = bancoGuardado();
      if(guardado){ window.CURSO = guardado; indexarBanco(); aplicarPaleta();
        return S.onboardingCompleto ? telaInicio() : telaOnboarding(); }
      return molduraEntrada('<h1>Sem conexão</h1><p class="sub">Não consegui falar com o servidor. ' +
        'Conecte-se à internet e abra de novo.</p>');
    }
    telaCarregando("Entrando");
    N.api.onAuthStateChanged(N.auth, async (u) => {
      N.usuario = u;
      if(!u) return telaEntrar(N.erroRedirecionamento);
      try{ await registrarUsuario(); }catch(e){}
      let g = localStorage.getItem(CHAVE_GRUPO);
      if(!g){
        try{ g = (await meusGrupos())[0] || null; }catch(e){ g = null; }
        if(g) localStorage.setItem(CHAVE_GRUPO, g);
      }
      if(location.hash === "#organizar") return telaAdmin();
      if(!g) return telaConvite();
      N.grupo = g;
      await abrirComGrupo(g);
    });
    return;
  }

  if(typeof CURSO === "undefined" || !CURSO){
    try{
      const r = await fetch("banco.json?v=" + (window.VERSAO_BANCO || "0"), { cache:"no-cache" });
      if(!r.ok) throw new Error("HTTP " + r.status);
      window.CURSO = await r.json();
    }catch(e){
      const local = location.protocol === "file:";
      document.getElementById("app").innerHTML =
        '<div style="padding:28px;font:600 15px/1.6 system-ui;color:#16202b">' +
        '<h2 style="margin:0 0 10px">Não consegui carregar as questões</h2>' +
        (local
          ? '<p style="color:#5a6b7c">Este arquivo não funciona abrindo direto do computador — ' +
            'ele precisa estar publicado num endereço. Use o <b>arquivo único</b> se quiser ' +
            'estudar offline pelo computador, ou abra o app pelo endereço da internet.</p>'
          : '<p style="color:#5a6b7c">Verifique sua conexão e recarregue. ' +
            'Se o problema continuar, me avise.</p>') +
        '</div>';
      return;
    }
  }
  indexarBanco();
  aplicarPaleta();
  if(!S.onboardingCompleto) telaOnboarding();
  else telaInicio();
}
iniciar();
</script>
