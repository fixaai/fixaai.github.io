      const aberta = discsAbertas.has(d.id);
      return `
      <button class="dhead ${aberta ? "on" : ""}" data-disc-abre2="${d.id}">
        <span class="ic">${esc(d.emoji)}</span>
        <span class="tx"><b>${esc(d.nome)}${discsComNovidade.has(d.id)
          ? ` <span class="selNovo">novos</span>` : ""}</b>
          <span>${plural(its.length, "exercício", "exercícios")} · ${plural(tops.length, "assunto", "assuntos")}</span></span>
        <span class="dbar"><i style="width:${pcD}%"></i></span>
        <span class="dpc">${pcD}%</span>
        <span class="dseta">${aberta ? "⌄" : "›"}</span>
      </button>
      ${aberta ? `<div class="cardz">
        ${tops.map(t => { const lista = its.filter(i => i.top === t.id); const pc = progresso(lista); return `
          <button class="tp" data-topo-ir="${d.id}/${t.id}" title="Estudar só este assunto">
            <div class="nm">${esc(t.nome)}</div>
            <div class="mini"><i style="width:${pc}%"></i></div>
            <div class="pc">${pc}%</div>
          </button>`; }).join("")}
      </div>` : ""}`;
    }).join("");
  })()}`;

  const esperando = S.proximaSessao && Date.now() < S.proximaSessao;
  const fr = focoValeRanking();
  montarTela(corpo, { manterRolagem: !!(op && op.manterRolagem), rodape: esperando
    ? `<button class="btn" id="go" disabled>Aguarde<small id="contaEspera"></small></button>
       <div style="height:8px"></div>
       <button class="btn ghost sm" id="pular" style="width:100%">Estudar mesmo assim<small>não conta para o ranking</small></button>`
    : `<button class="btn" id="go">${S.feitosHoje >= S.meta ? "Sessão extra" : "Estudar agora"}<small>${
        esc(nomeDoFoco())}${fr.vale ? "" : " · fora do ranking"}</small></button>` });
  if(esperando){
    const tick = () => {
      const falta = Math.round((S.proximaSessao - Date.now())/1000);
      const el = $("#contaEspera");
      if(!el){ clearInterval(espera); return; }
      if(falta <= 0){ clearInterval(espera); telaInicio(); return; }
      el.textContent = "libera em " + mmss(falta);
    };
    const espera = setInterval(tick, 1000); tick();
    $("#pular").onclick = () => { clearInterval(espera); iniciarSessao(); };
  } else {
    $("#go").onclick = iniciarSessao;
  }
  $("#trocar").onclick = () => { aba = "estudar"; telaEstudar(); };
  if($("#irDatas")) $("#irDatas").onclick = () => { aba = "ajustes"; telaAjustes({ irPara:"datas" }); };
  $("#irCalendario").onclick = () => caixaCalendario();
  /* Tocar numa prova mudava o foco e redesenhava a tela — que subia para o topo,
     longe de onde o dedo estava, e a única coisa que mudava era um texto lá em
     cima. Dava a impressão exata de que o toque não fez nada. Agora a tela fica
     no lugar e o cartão avisa o que mudou. */
  document.querySelectorAll("[data-prova-ir]").forEach(b => b.onclick = () => {
    const [d, pr] = b.dataset.provaIr.split("/");
    S.foco = { ...S.foco, disc:d, prova:pr, tops:[], soRevisao:false, soErros:false };
    salvar(); telaInicio({ manterRolagem:true });
  });
  /* No assunto, mudar o foco em silêncio era ainda pior: o botão diz "estudar só
     este assunto" e não começava nada. Agora começa. */
  document.querySelectorAll("[data-topo-ir]").forEach(b => b.onclick = () => {
    const [d, t] = b.dataset.topoIr.split("/");
    perguntarAssunto(d, t);
  });
  document.querySelectorAll("[data-disc-abre2]").forEach(b => b.onclick = () => {
    const id = b.dataset.discAbre2;
    if(discsAbertas.has(id)){ discsAbertas.delete(id); }
    else { discsAbertas.add(id); jaViANovidade(id); }   // abriu, viu: o selo cumpriu o papel
    telaInicio({ manterRolagem:true });
  });
}

/* ============================================================
   CAIXA DE DIÁLOGO

   Perguntar levando a pessoa para outra tela faz ela perder o lugar onde
   estava e o fio do que ia fazer — a Isabela tocou num assunto, foi parar
   numa tela nova e teve a impressão de já ter saído do início. A caixa por
   cima resolve isso: o que estava embaixo continua ali, visível, e fechar
   devolve exatamente o mesmo lugar.
   ============================================================ */
/* Enquanto a caixa está aberta, a tela de trás não rola. Sem isto o dedo
   arrastava as duas ao mesmo tempo: a Isabela rolava o perfil de alguém e o
   grupo escorregava junto atrás. */
function travarFundo(travar){
  const el = areaRolavel();
  if(el) el.style.overflow = travar ? "hidden" : "";
}
function fecharCaixa(){
  const c = document.getElementById("caixa");
  if(c) c.remove();
  travarFundo(false);
}
function abrirCaixa(dentro, botoes, topo, classe){
  fecharCaixa();
  const d = document.createElement("div");
  d.id = "caixa"; d.className = "caixa" + (classe ? " " + classe : "");
  /* O ✕ mora numa barra própria, fora da área que rola. Antes ele era absoluto
     por cima do conteúdo, e os dias do calendário passavam na frente dele ao
     rolar — o botão de fechar sumia embaixo dos números. */
  d.innerHTML = `<div class="caixaFundo"></div>
    <div class="caixaCorpo" role="dialog" aria-modal="true">
      <div class="caixaTopo">${topo || ""}<button class="caixaX" id="caixaFecha" aria-label="Fechar">✕</button></div>
      <div class="caixaRol">${dentro}</div>
      ${botoes ? `<div class="caixaBt">${botoes}</div>` : ""}
    </div>`;
  document.getElementById("app").appendChild(d);
  travarFundo(true);
  /* a roda do mouse e o arrasto param na caixa: o que estiver embaixo não se mexe */
  d.addEventListener("wheel", ev => ev.stopPropagation(), { passive:true });
  d.addEventListener("pointerdown", ev => ev.stopPropagation());
  d.querySelector(".caixaFundo").onclick = fecharCaixa;
  d.querySelector("#caixaFecha").onclick = fecharCaixa;
  const esc = ev => { if(ev.key === "Escape"){ fecharCaixa(); removeEventListener("keydown", esc); } };
  addEventListener("keydown", esc);
  return d;
}

/* `alert` e `confirm` do navegador não servem mais para nada aqui.

   Eles travam a página inteira, não têm a cara do app, e — o que custou caro —
   somem sem avisar quando a página roda dentro de um quadro com restrições:
   a Isabela tocou no ✕ para sair da bateria e nada aconteceu, porque o
   `confirm` que ia perguntar "quer mesmo sair?" foi bloqueado pelo navegador e
   devolveu "não" em silêncio. O botão parecia quebrado e não estava.

   Toda pergunta e todo aviso passam por estas duas daqui em diante. */
function caixaAviso(titulo, texto, sub){
  abrirCaixa(`<h3>${titulo}</h3>${sub ? `<p class="cxSub">${sub}</p>` : ""}
    <p style="margin:14px 0 0">${texto}</p>`,
    `<button class="btn ghost" id="cxOk">Entendi</button>`);
  document.getElementById("cxOk").onclick = fecharCaixa;
}
function caixaConfirma(titulo, texto, rotulo, aoConfirmar, perigo){
  abrirCaixa(`<h3>${titulo}</h3><p style="margin:14px 0 0">${texto}</p>`,
    `<button class="btn ${perigo ? "danger" : ""}" id="cxSim">${esc(rotulo)}</button>
     <div style="height:8px"></div>
     <button class="btn ghost" id="cxNao">Cancelar</button>`);
  document.getElementById("cxSim").onclick = () => { fecharCaixa(); aoConfirmar(); };
  document.getElementById("cxNao").onclick = fecharCaixa;
}

/* Começar a estudar é uma coisa que a pessoa tem que decidir, não descobrir. A
   primeira versão disparava a bateria no toque, e a Isabela levou um susto:
   tocou para ver o assunto e caiu dentro do exercício. */
function perguntarAssunto(discId, topId){
  const t = CURSO.topicos.find(x => x.id === topId);
  const lista = CURSO.itens.filter(i => i.top === topId);
  const pc = progresso(lista);
  const um = lista[0];
  const fr = focoValeRanking({ tops:[topId], tipos:[] });
  abrirCaixa(`
    <h3>${esc(t ? t.nome : "Este assunto")}</h3>
    <p class="cxSub">${esc((discPorId[discId] || {}).nome || "")}</p>
    <p style="margin:14px 0 0;font-weight:700">Começar uma bateria só deste assunto?</p>
    <p class="muted" style="margin:6px 0 0">${plural(lista.length, "exercício", "exercícios")} no assunto ·
      ${pc}% dominado · a bateria traz ${SESSAO}.</p>
    ${fr.vale ? "" : `<p class="muted" style="margin:10px 0 0">Assunto sozinho <b>não conta para o
      ranking</b> — é recorte estreito demais para comparar com as outras pessoas. O seu XP total
      sobe normalmente, e a espera do ranking não começa a correr.</p>`}`,
    `<button class="btn" id="vai">Começar</button>
     <div style="height:8px"></div>
     <button class="btn ghost" id="volta">Agora não</button>`);
  document.getElementById("vai").onclick = () => {
    fecharCaixa();
    S.foco = { ...S.foco, disc:discId, prova:(um ? um.prova : null), tops:[topId],
               soRevisao:false, soErros:false };
    salvar(); iniciarSessao();
  };
  document.getElementById("volta").onclick = fecharCaixa;
}

/* ============================================================
   CALENDÁRIO

   Um mês por vez, com tudo o que já estava espalhado pelo app junto num lugar
   só: o dia que você estudou, o dia que você deixou passar, o dia congelado e
   o dia de prova. Ver a fileira de foguinhos com um buraco no meio explica a
   ofensiva melhor do que qualquer texto.

   O dia congelado ainda não existe de verdade — o prêmio de congelar ofensiva
   vem com as ligas. O desenho já o prevê, e `S.congelados` guarda as datas.
   ============================================================ */
const MESES = ["janeiro","fevereiro","março","abril","maio","junho",
               "julho","agosto","setembro","outubro","novembro","dezembro"];
const DIAS_SEM = ["D","S","T","Q","Q","S","S"];
function provasDoDia(){
  const m = {};
  Object.entries(S.datas || {}).forEach(([chave, data]) => {
    if(!data) return;
    const [discId, provaId] = chave.split("/");
    const d = discPorId[discId]; if(!d) return;
    (m[data] = m[data] || []).push({ disc:d, prova: provaDe(d, provaId) });
  });
  return m;
}
function caixaCalendario(desloc, lado){
  const passo = desloc || 0;
  const hj = hoje();
  const [ay, am] = hj.split("-").map(Number);
  const base = new Date(Date.UTC(ay, am - 1 + passo, 1));
  const ano = base.getUTCFullYear(), mes = base.getUTCMonth();
  const primeiro = new Date(Date.UTC(ano, mes, 1)).getUTCDay();
  const quantos = new Date(Date.UTC(ano, mes + 1, 0)).getUTCDate();
  const provas = provasDoDia();
  const congelados = new Set(S.congelados || []);
  const dd = n => `${ano}-${String(mes+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`;

  let celulas = "";
  for(let i = 0; i < primeiro; i++) celulas += `<div class="dia vazio"></div>`;
  let usadas = primeiro;
  for(let n = 1; n <= quantos; n++){
    const data = dd(n);
    const estudou = (S.historico || {})[data] > 0;
    const gelo = congelados.has(data);
    const prova = provas[data];
    const futuro = data > hj;
    const classes = ["dia"];
    if(data === hj) classes.push("hoje");
    if(prova) classes.push("prova");
    if(estudou) classes.push("fez");
    else if(gelo) classes.push("gelo");
    else if(!futuro && (S.historico && Object.keys(S.historico).length)) classes.push("furou");
    const marca = estudou ? "🔥" : gelo ? "🧊" : "";
    celulas += `<div class="${classes.join(" ")}" ${prova ? `data-dia-prova="${data}"` : ""}
      title="${prova ? prova.map(x => x.disc.nome + " " + x.prova.nome).join(" · ") : data}">
      ${marca ? `<span class="mk">${marca}</span>` : ""}
      <span class="n">${n}</span>
      ${prova ? `<span class="pv">${prova[0].disc.emoji}</span>` : ""}</div>`;
    usadas++;
  }
  /* Sempre seis fileiras, mesmo que o mês caiba em cinco. Sem isto a caixa
     mudava de altura de um mês para o outro e a tela inteira pulava para cima
     e para baixo a cada seta — fevereiro cabe em cinco, agosto às vezes precisa
     de seis. Fileira sobrando fica invisível, só ocupando o lugar. */
  for(let i = usadas; i < 42; i++) celulas += `<div class="dia vazio"></div>`;

  const doMes = Object.keys(provas).filter(d => d.startsWith(`${ano}-${String(mes+1).padStart(2,"0")}`)).sort();
  const diasFeitos = Object.keys(S.historico || {})
    .filter(d => d.startsWith(`${ano}-${String(mes+1).padStart(2,"0")}`)).length;

  const seta = (lado, alvo) => `<button class="calSeta" data-mes="${alvo}"
    aria-label="${lado < 0 ? "Mês anterior" : "Próximo mês"}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="${lado < 0 ? "M15 5l-7 7 7 7" : "M9 5l7 7-7 7"}"
      fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>`;
  abrirCaixa(`
    <div class="calSem">${DIAS_SEM.map(d => `<span>${d}</span>`).join("")}</div>
    <div class="cal ${lado === 1 ? "vemDaDireita" : lado === -1 ? "vemDaEsquerda" : ""}">${celulas}</div>
    <div class="calLeg">
      <span><span class="lg fez">🔥</span> estudou</span>
      <span><span class="lg gelo">🧊</span> congelado</span>
      <span><span class="lg furou"></span> deixou passar</span>
      <span><span class="lg prova"></span> prova</span>
    </div>
    ${doMes.length ? `<div class="secao" style="margin-top:16px">Provas deste mês</div>
      <div class="calProvas">${doMes.map(d => {
        const dias = difDias(hj, d);
        return provas[d].map(x => `<div class="calPr">
          <span class="ic">${x.disc.emoji}</span>
          <span class="tx"><b>${esc(x.disc.nome)} ${esc(x.prova.nome)}</b>
            <span>${d.slice(8,10)}/${d.slice(5,7)} · ${dias < 0 ? "já passou" : dias === 0 ? "é hoje" : "faltam " + plural(dias, "dia", "dias")}</span></span>
        </div>`).join("");
      }).join("")}</div>` : `<p class="muted" style="margin-top:14px">Nenhuma prova marcada neste mês.</p>`}`,
    `<button class="btn ghost" id="calDatas">Marcar datas de prova</button>`,
    `<div class="calCab">
       ${seta(-1, passo - 1)}
       <div class="calTit">
         <h3>${MESES[mes]} de ${ano}</h3>
         <p class="cxSub">${plural(diasFeitos, "dia estudado neste mês", "dias estudados neste mês")}</p>
       </div>
       ${seta(1, passo + 1)}
     </div>`,
    /* altura travada: os meses têm 5 ou 6 semanas e um número diferente de provas
       embaixo, e sem isto a caixa inteira crescia e encolhia a cada seta. O que
       não couber rola por dentro. */
    "caixaAlta");

  document.querySelectorAll("[data-mes]").forEach(b => b.onclick = () =>
    caixaCalendario(+b.dataset.mes, +b.dataset.mes > passo ? 1 : -1));
  document.getElementById("calDatas").onclick = () => {
    fecharCaixa(); aba = "ajustes"; telaAjustes({ irPara:"datas" });
  };
}

/* ============================================================
   TELA: Grupo — quem estuda junto, e de onde vão sair os desafios

   Os nomes vêm da lista de membros do grupo, que só quem é membro consegue ler.
   XP, pódios e desafios ganhos ainda aparecem em branco: hoje o progresso de
   cada pessoa é privado, e mostrar o XP das outras exige um lugar novo no
   servidor que o grupo inteiro possa ler. É o próximo pedaço, e é o mesmo que
   destranca ranking e desafio.
   ============================================================ */
let CACHE_MEMBROS = null;
async function telaGrupo(){
  aba = "grupo";
  if(!N.ligado || !N.grupo){
    return montarTela(`
      <div class="hero"><h1>Seu grupo ⚔️</h1></div>
      <div class="cardz" style="border-style:dashed">
        <b style="font-size:15px">Esta é a versão sem conta</b>
        <p class="muted" style="margin:6px 0 0">Aqui você estuda só neste aparelho, sem entrar com
          o Google e sem grupo. Liga, ranking e desafio aparecem na versão que roda no endereço
          do app.</p>
      </div>`);
  }
  if(!CACHE_MEMBROS){
    montarTela(`<div class="hero"><h1>Seu grupo ⚔️</h1></div>
      <p class="muted" style="text-align:center;padding:20px 0">Carregando quem está aqui...</p>`);
    try{
      const q = await N.api.getDocs(cole("grupos", N.grupo, "membros"));
      CACHE_MEMBROS = [];
      q.forEach(d => CACHE_MEMBROS.push({ uid:d.id, ...d.data() }));
    }catch(e){ CACHE_MEMBROS = []; }
    /* o placar é outra coleção: quem não publicou ainda simplesmente não tem
       números, e a lista continua funcionando sem eles */
    const porUid = await lerPlacar();
    CACHE_MEMBROS.forEach(m => { m.placar = porUid[m.uid] || null; });
  }
  const eu = N.usuario ? N.usuario.uid : null;
  /* A conta que organiza o grupo não é necessariamente alguém que estuda. A
     "fixa aí" foi criada só para publicar questões, e ficava na lista recebendo
     desafio que nunca ia ser respondido. Então quem é dona do grupo fica fora da
     lista por padrão, e pode se mostrar pelo interruptor em #organizar — o caso
     de quem organiza E estuda no mesmo grupo. */
  const escondida = m => m.oculto === true || (m.oculto === undefined && m.papel === "dono");
  const lista = CACHE_MEMBROS.filter(m => m.uid === eu || !escondida(m)).sort((a, b) =>
    (a.uid === eu ? -1 : b.uid === eu ? 1 : 0) ||
    String(a.nome || "").localeCompare(String(b.nome || ""), "pt-BR"));

  const semanaAtual = S.semana || domingoDa(hoje());
  const resultado = await fecharSemanaSePreciso();
  const desafios = await lerDesafios();
  const ganhos = acertarContasDosDesafios(desafios);
  const euUid = N.usuario ? N.usuario.uid : null;
  /* Desafios em que falta EU responder — mandados por mim ou recebidos.

     Antes esta lista só trazia os recebidos, e isso era um beco sem saída: quem
     mandava o desafio não ganhava em lugar nenhum um jeito de responder as
     próprias cinco questões, então o desafio nunca fechava. Quem manda responde
     na hora, e se largar no meio encontra o desafio aqui esperando. */
  const aResponder = desafios.filter(d => desafioAberto(d) && !d["res" + meuLado(d)]);
  const placar = CACHE_PLACAR || {};
  const naLiga = minhaLiga(placar, semanaAtual);
  const meuNivel = nivelDe(S.nivel);
  const falta = faltaParaFechar();
  const nome = m => m.uid === eu
    ? ((S.apelido || "").trim() || (m.placar && m.placar.apelido) || m.nome || "você")
    : ((m.placar && m.placar.apelido) || m.nome || "sem nome");
  const cara = m => m.uid === eu ? (S.emoji || "🧠") : ((m.placar && m.placar.emoji) || "👤");
  const daSemana = m => (m.placar && m.placar.semana === semanaAtual) ? (m.placar.xpSemana || 0) : 0;
  /* O ranking da semana é a lista ordenada por XP desta semana, e só entra quem
     estudou nela — quem não abriu o app não ocupa cadeira. Ainda não é a liga
     com níveis e limite de oito; é o placar cru, que já é o que estava faltando. */
  const medalha = i => i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i + 1}º`;

  montarTela(`
  <div class="hero"><h1>Seu grupo ⚔️</h1>
    <div class="sub">${esc(N.grupoNome || "")} · ${plural(lista.length, "pessoa", "pessoas")}</div>
  </div>

  <div class="ligaTopo" style="--lc:${meuNivel.cor}">
    <span class="ligaEmoji">${meuNivel.emoji}</span>
    <div><b>Liga ${meuNivel.nome}</b><span>fecha no fim de sábado</span></div>
  </div>
  ${falta.horas <= 24 ? `<div class="ligaConta ${falta.horas <= 1 ? "urgente" : ""}">
    ⏳ A liga fecha em <b>${falta.txt}</b>${falta.horas <= 1

/* Maquete: como a tela do grupo vai ficar quando houver turma e placar. Os nomes
   são inventados e estão marcados como tal. Serve para decidir o desenho —
   ordem, o que aparece em cada linha, onde fica o botão de desafiar — antes de
   existir uma pessoa cadastrada para olhar. */
/* A liga da semana, e por que ela é assim.

   Ideia da Isabela: numa sala de cinquenta, um ranking único deixa quarenta e
   cinco pessoas olhando de longe para sempre os mesmos três nomes. Então o
   ranking da semana não é a sala inteira: é uma liga de no máximo oito, montada
   só com quem estudou naquela semana.

   Duas consequências, as duas boas. Quem não abriu o app não ocupa vaga, então
   a lista nunca parece um lugar vazio. E cinquenta pessoas viram seis ou sete
   ligas, o que dá seis ou sete primeiros lugares por semana em vez de um.

   A lista de todo mundo continua existindo, separada, e é de lá que sai o
   desafio: dá para desafiar qualquer pessoa do grupo, esteja ela na sua liga
   ou não.

   Aqui existiu uma maquete com gente inventada, que serviu para a Isabela
   decidir o desenho antes de a turma entrar. Saiu quando a liga passou a ter
   gente de verdade: manter nomes de mentira num app em uso só confunde. */
const TAM_LIGA = 8;
const LIGAS = [
  { id:"bronze", nome:"Bronze",  emoji:"🥉", cor:"#a9713f", gelos:1 },
  { id:"prata",  nome:"Prata",   emoji:"🥈", cor:"#8b95a3", gelos:2 },
  { id:"ouro",   nome:"Ouro",    emoji:"🥇", cor:"#d4a017", gelos:3 }
];
/* Congelamentos guardados de uma vez. Três é o prêmio do primeiro lugar do Ouro,
   então ele cabe inteiro; mais do que isso e a ofensiva viraria saldo bancário. */
const MAX_GELOS = 3;

/* A liga fecha no fim de sábado e a semana nova começa no domingo — a mesma
   virada que o XP da semana já usa, para não existirem duas contagens no app. */
function fimDaLiga(){
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + ((7 - d.getDay()) % 7 || 7));
  return d.getTime();
}
function faltaParaFechar(){
  const ms = fimDaLiga() - Date.now();
  const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000);
  return { ms, h, m, horas: ms / 3600000,
           txt: h >= 1 ? `${h}h ${String(m).padStart(2,"0")}min` : `${m} min` };
}

/* Desafio pontua no ranking — sem isso ninguém desafiaria ninguém. O que impede
   de virar fábrica de XP entre duas amigas são três travas juntas: um desafio
   mandado por vez, um dia entre um e o próximo, e a bateria sorteada do banco
   em vez de escolhida por quem desafia. Vencer ainda exige acertar as questões. */
const MAX_ENVIADOS  = 1;     // desafios que você mandou e ainda estão de pé
const MAX_RECEBIDOS = 1;     // desafios que te mandaram e você ainda não respondeu
const HORAS_ENTRE_DESAFIOS = 24;
const MAX_DESAFIOS = MAX_ENVIADOS + MAX_RECEBIDOS;
const DESAFIO_TAM  = 5;      // metade de uma bateria: cabe num intervalo entre aulas
const XP_VITORIA   = 30;     // bônus de quem vence, além do XP normal da bateria
/* O resultado de verdade, com os números da semana que fechou. */
function caixaResultadoDaSemana(r){
  const medalha = r.pos === 1 ? "🥇" : r.pos === 2 ? "🥈" : r.pos === 3 ? "🥉" : `${r.pos}º`;
  abrirCaixa(`
    <div class="fimTopo">
      <div class="fimMedalha">${medalha}</div>
      <h3>${r.pos === 1 ? "Você ganhou a semana!" : `Você ficou em ${r.pos}º`}</h3>
      <p class="cxSub">Liga ${esc(r.nivelAntigo.nome)} · semana encerrada</p>
    </div>
    <div class="fimNums">
      <div><b>${r.xpSemana}</b><span>XP na semana</span></div>
      <div><b>${r.pos}º</b><span>de ${r.total}</span></div>
      <div><b>${r.sobe ? "↑" : r.desce ? "↓" : "="}</b><span>${
        r.sobe ? "subiu" : r.desce ? "desceu" : "ficou"}</span></div>
    </div>
    ${r.gelos ? `<div class="fimPremio">🧊 <b>${plural(r.gelos, "congelamento de ofensiva", "congelamentos de ofensiva")}</b>
      <span>Guarde para a semana de prova ou a viagem — congelado, o dia sem estudar não quebra a
      sua sequência. Dá para ter até ${MAX_GELOS} guardados.</span></div>`
      : `<div class="fimPremio semPremio">Sem prêmio desta vez <span>Só o primeiro lugar leva
        congelamento. ${r.pos === 1 ? "" : `Faltaram ${Math.max(1, r.lider - r.xpSemana)} XP para alcançar quem ganhou.`}</span></div>`}`,
    `<button class="btn" id="proxima">Ver a liga da semana nova</button>`);
  document.getElementById("proxima").onclick = () => {
    fecharCaixa(); aba = "grupo"; telaGrupo();
  };
}

      <span class="ck">${escolhida?"✓":""}</span>

        </div>` : ""}`; }).join("")}
    </div>` : ""}`;
  }).join("")}

  <div class="secao">Tipo de exercício</div>
  <div class="tipos">
    <button class="tipo ${f.tipos.length?"":"on"}" data-tipo="">Todos</button>
    ${Object.keys(NOMES_TIPO).map(k =>
      `<button class="tipo ${f.tipos.includes(k)?"on":""}" data-tipo="${k}">${NOMES_TIPO[k]}</button>`).join("")}
  </div>
  <p class="muted" style="margin-top:9px">Dá para marcar mais de um. Sem nenhum marcado, entram todos.</p>`;

  const pool = itensDoFoco();
  const disponivel = f.soErros ? errados(pool).length : f.soRevisao ? vencidos(pool).length : pool.length;
  montarTela(corpo, { rodape:
    `<button class="btn" id="ir" ${disponivel?"":"disabled"}>${disponivel ? "Começar" : "Nada para estudar aqui"}
     <small>${esc(nomeDoFoco())} · ${esc(resumoTipos())} · ${disponivel} disponíveis</small></button>` });

  if(rolagemAnterior){                 // volta para onde ela estava, sem pular para o topo
    const el = areaRolavel();
    if(el){ el.scrollTop = rolagemAnterior; atualizaSombra(); }
  }

  document.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => {
    const m = b.dataset.modo;
    if(m === "mix"){ S.foco.disc = null; S.foco.prova = null; S.foco.tops = []; S.foco.soRevisao = false; S.foco.soErros = false; }
    else if(m === "erros"){ S.foco.soErros = !S.foco.soErros; S.foco.soRevisao = false; }
    else { S.foco.soRevisao = !S.foco.soRevisao; S.foco.soErros = false; }
    salvar(); redesenhaEstudar();
  });
  document.querySelectorAll("[data-disc]").forEach(b => b.onclick = () => {
    const id = b.dataset.disc;
    S.foco.soRevisao = false; S.foco.soErros = false; S.foco.tops = [];
    if(S.foco.disc === id){ S.foco.disc = null; S.foco.prova = null; }
    else { S.foco.disc = id; S.foco.prova = null; }
    salvar(); redesenhaEstudar();
  });
  document.querySelectorAll("[data-prova]").forEach(b => b.onclick = () => {
    S.foco.disc = b.dataset.d; S.foco.prova = b.dataset.prova || null;
    S.foco.tops = []; S.foco.soRevisao = false; S.foco.soErros = false;
    salvar(); redesenhaEstudar();
  });
  document.querySelectorAll("[data-top]").forEach(b => b.onclick = () => {
    S.foco.disc = b.dataset.d; S.foco.prova = b.dataset.p;
    S.foco.soRevisao = false; S.foco.soErros = false;
    const t = b.dataset.top;
    const sel = S.foco.tops || [];
    S.foco.tops = sel.includes(t) ? sel.filter(x => x !== t) : sel.concat(t);
    salvar(); redesenhaEstudar();
  });
  document.querySelectorAll("[data-tops-todos]").forEach(b => b.onclick = () => {
    const [d, pr] = b.dataset.topsTodos.split("/");
    S.foco.disc = d; S.foco.prova = pr; S.foco.soRevisao = false; S.foco.soErros = false;
    const naProva = itensDaProva(d, pr);
    S.foco.tops = CURSO.topicos.filter(t => naProva.some(i => i.top === t.id)).map(t => t.id);
    salvar(); redesenhaEstudar();
  });
  document.querySelectorAll("[data-tops-limpar]").forEach(b => b.onclick = () => {
    S.foco.tops = []; salvar(); redesenhaEstudar();
  });
  document.querySelectorAll("[data-tipo]").forEach(b => b.onclick = () => {
    const t = b.dataset.tipo;
    if(!t) S.foco.tipos = [];
    else if(S.foco.tipos.includes(t)) S.foco.tipos = S.foco.tipos.filter(x => x !== t);
    else S.foco.tipos = S.foco.tipos.concat(t);
    salvar(); redesenhaEstudar();
  });
  if($("#ir")) $("#ir").onclick = iniciarSessao;
}

/* ============================================================
   SESSÃO
   ============================================================ */
let SES = null;
let relogio = null;

const mmss = seg => Math.floor(Math.max(0,seg)/60) + ":" + String(Math.floor(Math.max(0,seg)%60)).padStart(2,"0");

function pararRelogio(){ if(relogio){ clearInterval(relogio); relogio = null; } }

/* O cronômetro para enquanto a explicação está na tela.

   O tempo existe para medir quanto se leva para RESOLVER, e ler por que a
   resposta é aquela não é resolver — é a parte que mais vale a pena da sessão,
   e correr contra o relógio aqui é o incentivo errado. Ao tocar em Continuar o
   relógio volta do ponto em que parou: o fim da sessão é empurrado para a
   frente pelo tanto que ficou parado, então nada de tempo é perdido nem
   ganhado.

   O que impede de usar a pausa para consultar a resposta em outro lugar é que
   ela só existe DEPOIS de responder — nunca antes. */
function pausarRelogio(){
  /* No desafio o relógio não para. Ele é o critério de desempate, e pausar
     enquanto se lê a explicação abriria a mesma porta de sair e voltar. */
  if(SES && SES.desafio) return;
  if(!SES || !SES.fim || SES.pausa) return;
  SES.pausa = Date.now();
  pararRelogio();
}
function voltarRelogio(){
  if(!SES || !SES.fim || !SES.pausa) return;
  SES.fim += Date.now() - SES.pausa;
  SES.pausa = null;
  tocarRelogio();
}
function tocarRelogio(){
  pararRelogio();
  if(!SES || !SES.fim) return;
  const passo = () => {
    /* a sessão pode ter sido abandonada entre dois tiques — sair da bateria,
       trocar de tela, zerar o progresso. Sem esta guarda o relógio continuava
       batendo em cima de uma sessão que não existe mais. */
    if(!SES || !SES.fim || SES.pausa){ pararRelogio(); return; }
    const falta = Math.round((SES.fim - Date.now())/1000);
    const el = document.querySelector("#cron");
    if(el){
      el.textContent = "⏱ " + mmss(falta);
      el.classList.toggle("apertado", falta <= 30);
    }
    if(falta <= 0) encerrarPorTempo();
  };
  passo();
  relogio = setInterval(passo, 1000);
}

function encerrarPorTempo(){
  pararRelogio();
  const pendentes = [];
  SES.fila.forEach(it => {
    if(!SES.vistos.includes(it.id) && !pendentes.some(x => x.id === it.id)) pendentes.push(it);
  });
  pendentes.forEach(it => { registrar(it.id, false); SES.vistos.push(it.id); });
  SES.estourou = pendentes.length;
  SES.i = SES.fila.length;
  S.historico[hoje()] = (S.historico[hoje()] || 0) + pendentes.length;
  salvar();
  telaFim();
}

function iniciarSessao(){
  const { fila, modo } = montarSessao();
  if(!fila.length){
    caixaAviso("Nada para estudar aqui",
      "Este recorte está sem exercício disponível agora. Tente outro modo na aba Estudar.");
    return;
  }
  const furou = !!(S.proximaSessao && Date.now() < S.proximaSessao);   // começou antes da espera acabar
  const foco = focoValeRanking();
  SES = { fila, i:0, acertos:0, total:fila.length, respondido:false, vistos:[], estourou:0, log:[],
          inicio:Date.now(), valeRanking: !furou && foco.vale, xpAntes: S.xpSemana, modo,
          motivoSemRanking: furou ? "a espera entre sessões ainda não acabou" : foco.porque };
  SES.fim = S.segPorQuestao ? Date.now() + S.segPorQuestao * 1000 * fila.length : null;
  /* A espera é disparada AQUI, no clique, e não no fim da bateria. Dois motivos:
     1) quem estuda fora do ranking enquanto espera não pode zerar o relógio do ranking;
     2) desistir da bateria no meio e recomeçar não devolve a chance de nota cheia.

     E ela só corre para a sessão que de fato vale ranking. Estava correndo em
     qualquer sessão, o que era incoerente e a Isabela pegou: ela fez uma bateria
     de um assunto só, que já saía avisada como fora do ranking, e mesmo assim
     ficou meia hora sem poder fazer uma que valesse. Cobrava o preço do ranking
     por uma sessão que não dava o prêmio dele. */
  if(SES.valeRanking && !SES.desafio && S.esperaMin > 0){
    S.proximaSessao = Date.now() + S.esperaMin * 60000; salvar();
  }
  render();
  tocarRelogio();
}

/* A barra de progresso virou dez blocos, um por exercício. Barra lisa mostra que
   você avançou, mas não quantos faltam — e saber que faltam dois muda o ânimo
   de quem está na oitava questão. */
function barraHTML(){
  const total = SES.total || SES.fila.length;
  const feitos = (SES.vistos || []).length;
  let blocos = "";
  for(let i = 0; i < total; i++) blocos += `<i class="${i < feitos ? "ok" : ""}"></i>`;
  return `<div class="bar" id="barra">${blocos}</div>`;
}
/* O raio da sequência só aparece a partir do segundo acerto seguido, que é
   quando o bônus começa de fato. Fica no canto de cima da questão, perto de
   onde os olhos já estão. */
function raioHTML(){
  const n = SES && SES.seq || 0;
  if(n < 2) return "";
  return `<span class="raio" title="${n} acertos seguidos">⚡ ×${multiploDaSequencia(n).toFixed(1).replace(".", ",")}</span>`;
}
/* Relógio e aviso de ranking moram no rodapé, numa faixa fina que continua
   visível enquanto se lê a explicação — parado, para ficar claro que o tempo
   não está correndo ali. */
function barraTempoHTML(){
  if(!SES) return "";
  const parado = !!SES.pausa;
  return `<div class="tempoBar">
    ${SES.fim ? `<span class="cron ${parado ? "parado" : ""}" id="cron">⏱ ${
        mmss(Math.max(0, Math.round((SES.fim - (SES.pausa || Date.now())) / 1000)))}</span>`
              : `<span class="flame">🔥 ${S.ofensiva} de ofensiva</span>`}
    ${parado ? `<span class="tbNota">tempo parado enquanto você lê</span>` : ""}
    ${SES.valeRanking === false
      ? `<span class="semrank" title="Este recorte não pontua no ranking">sem ranking</span>` : ""}
  </div>`;
}
function render(){
  if(SES.i >= SES.fila.length) return telaFim();
  const it = SES.fila[SES.i];
  /* A barra de cima é só dos tracinhos, e a razão é aritmética: com o relógio,
     o aviso de "sem ranking" e o raio da sequência disputando a mesma linha,
     sobravam uns 90 pixels para dez tracinhos — que viravam risquinhos verticais
     impossíveis de contar. Saber que faltam dois é a única coisa que essa barra
     precisa dizer, então ela ficou com a linha inteira.
     O relógio desceu para o rodapé e o raio foi para o canto da questão. */
  montarTela('<div class="q" id="q"></div>', {
    topo: `<div class="topbar">
             <button class="xbtn" id="sair">✕</button>
             ${(SES.log && SES.log.length) ? `<button class="xbtn" id="voltarQ" title="Rever as questões que já passaram" aria-label="Rever as questões anteriores">‹</button>` : ""}
             ${barraHTML()}
           </div>`,
    rodape: barraTempoHTML(), comNav:false });
  $("#sair").onclick = () => caixaConfirma("Sair da bateria?",
    "O que você já respondeu fica salvo — as questões que sobraram voltam na próxima vez.",
    "Sair", () => { pararRelogio(); aba = "inicio"; telaInicio(); });
  const bv = $("#voltarQ"); if(bv) bv.onclick = () => telaRever(SES.log.length - 1);
  SES.respondido = false;
  if(SES.fim) tocarRelogio();
  ({ vf:rVF, mcq:rMCQ, multi:rMulti, escrita:rEscrita, cloze:rCloze, ordem:rOrdem, relacionar:rRel })[it.t](it);
  const bt = $("#btInfo");
  if(bt) bt.onclick = () => {
    const cx = $("#boxFonte");
    cx.classList.toggle("hide");
    bt.classList.toggle("on", !cx.classList.contains("hide"));
    ligarCue();
  };
  ligarCue();
}

const ROTULO_FONTE = {
  simulado:"📄 Questão de prova antiga",
  guia:"📋 Guia de estudos da professora",
  dirigido:"📝 Estudo dirigido da monitoria",
  lista:"📚 Lista de questões da professora",
  aula:"🖥️ Slide da aula",
  audio:"🎧 Áudio da revisão da professora",
  elaborada:"✍️ Elaborada a partir do material",
  corrigido:"✅ Resposta sua, com visto da professora",
  livro:"📖 Livro-texto, conferido na bibliografia"
};
function blocoFonte(it){
  const f = it.fonte;
  if(!f) return "";
  if(typeof f === "string")
    return `<div class="fonte hide" id="boxFonte"><b class="rot">Origem</b><p>${esc(f)}</p></div>`;
  return `<div class="fonte hide" id="boxFonte">
      <b class="rot">${ROTULO_FONTE[f.t] || "Origem"}</b>
      ${f.ref ? `<div class="ref">${esc(f.ref)}</div>` : ""}
      ${f.txt ? `<p>${f.txt}</p>` : ""}
    </div>`;
}
function cabecalho(it, titulo){
  const d = discPorId[it.disc];
  return `<div class="qhead">
      <div class="qtag">${TITULO_TIPO[it.t]}${d ? " · " + esc(d.nome) : ""}</div>
      <span class="raiobox">${raioHTML()}</span>
      ${it.fonte ? `<button class="info" id="btInfo" title="De onde veio esta questão" aria-label="De onde veio esta questão">i</button>` : ""}
    </div>
    <div class="qtitle">${esc(titulo)}</div>
    ${blocoFonte(it)}`;
}
function pedirVerificar(fn, ativo){
  $(".foot").innerHTML = barraTempoHTML()
    + `<button class="btn" id="ver" ${ativo?"":"disabled"}>Verificar</button>`;
  $("#ver").onclick = fn;
}
function atualizaVerificar(ativo){ const b = $("#ver"); if(b) b.disabled = !ativo; ligarCue(); }

function concluir(it, acertou, textoExtra){
  if(SES.respondido) return;
  SES.respondido = true;
  if(!SES.vistos) SES.vistos = [];
  virarODia();
  const ganho = registrar(it.id, acertou);
  const primeiraVez = !SES.vistos.includes(it.id);   // repetição do erro não conta como acerto de primeira
  if(primeiraVez) SES.vistos.push(it.id);
  if(acertou && primeiraVez) SES.acertos++;
  S.feitosHoje++;
  if(S.feitosHoje === S.meta){
    const h = hoje();
    if(S.ultimoDia !== h){ S.ofensiva = (S.ultimoDia && difDias(S.ultimoDia,h) === 1) ? S.ofensiva + 1 : 1; S.ultimoDia = h; }
  }
  S.historico[hoje()] = (S.historico[hoje()] || 0) + 1;
  /* O andamento do desafio fica guardado a cada resposta: quem fechar o app no
     meio volta com os acertos que já tinha e o tempo que sobrou. */
  if(SES.desafio) S.desafioEmCurso = { id:SES.desafio.id, fim:SES.fim, acertos:SES.acertos,
    feitas:SES.vistos.slice(), seq:SES.seq || 0, xpDaSeq:SES.xpDaSeq || 0,
    maiorSeq:SES.maiorSeq || 0, xpGanho:SES.xpGanho || 0 };
  salvar();

  const exp = textoExtra || it.exp || it.just || "";
  if(!SES.log) SES.log = [];
  SES.log.push({ id: it.id, acertou, exp });     // guarda para a pessoa poder reler depois
  pausarRelogio();                       // agora é hora de ler, não de correr
  rodapeFeedback(it, acertou, exp, null, ganho);
  const barra = $("#barra");
  if(barra) barra.outerHTML = barraHTML();
  const cx = document.querySelector(".raiobox");
  if(cx) cx.innerHTML = raioHTML();      // a sequência pode ter crescido ou zerado
}

/* ---------- rodapé de feedback e reporte de problema ---------- */
function avancar(it, acertou){
  /* A questão errada NÃO volta no fim da mesma bateria.

     Ela voltava, e isso era herança de quando a sessão não tinha tamanho fixo.
     Com a bateria de dez, criava três problemas que a Isabela viu de uma vez:
     a sessão passava de dez sem aviso, a barra continuava com dez tracinhos, e
     a sequência de acertos engordava com repetições — dava para errar quatro,
     acertar as mesmas quatro logo depois e sair com "7 seguidas" tendo acertado
     6 de 10 de primeira. Os números não se contradiziam por engano de conta:
     contavam coisas diferentes, e a tela não dizia isso.

     Além do mais, repetir a mesma questão três minutos depois de ler a resposta
     testa memória curta, que é justamente o que este app existe para não fazer.
     Quem errou já sai com a caixa zerada e volta a ver a questão amanhã.

     Se um dia fizer falta, é esta linha que volta:
       if(!acertou && SES.fila.filter(x => x.id === it.id).length < 2) SES.fila.push(it); */
  SES.i++;
  voltarRelogio();
  render();
}
function rodapeFeedback(it, acertou, exp, aviso, ganho){
  const jaReportou = (S.reportes || []).some(r => r.id === it.id);
  const seq = SES ? (SES.seq || 0) : 0;
  const selo = (ganho == null) ? "" : `<span class="xpg">+${ganho} XP${
    seq >= 2 ? ` <b>⚡ ${seq} seguidas</b>` : ""}</span>`;
  $(".foot").innerHTML = `
    ${barraTempoHTML()}
    ${aviso ? `<div class="fb good"><p>${aviso}</p></div>` : `
    <div class="fb ${acertou?"good":"bad"}">
      <h3>${acertou ? "✅ Isso aí!" : "❌ Quase"}${selo}</h3>
      ${exp ? `<p>${exp}</p>` : ""}
      ${(!acertou && ganho != null && SES && SES.perdeuSeq)
        ? `<p class="perdeu">A sequência de ${SES.perdeuSeq} zerou.</p>` : ""}
    </div>`}
    <div class="acoes">
      <button class="btn ${acertou?"":"danger"}" id="prox">Continuar</button>
      <button class="flag ${jaReportou?"neutra":""}" id="btRep"
        title="${jaReportou ? "Você já reportou esta questão" : "Reportar um problema nesta questão"}"
        aria-label="Reportar problema nesta questão">${jaReportou ? "✓" : "🚩"}</button>
    </div>`;
  ligarCue();
  $("#prox").onclick = () => avancar(it, acertou);
  $("#btRep").onclick = () => painelReporte(it, acertou, exp);
}

const MOTIVOS = [
  ["gabarito", "A resposta dada como certa está errada"],
  ["erro",     "Tem um erro no conteúdo da questão"],
  ["ambigua",  "Está confusa ou tem mais de uma resposta possível"],
  ["fonte",    "Não bate com o que a professora ensinou"],
  ["ofensiva", "É ofensiva ou inadequada"],
  ["outro",    "Outro motivo"]
];
function painelReporte(it, acertou, exp){
  let motivo = null;
  $(".foot").innerHTML = `
    <div class="rep">
      <h3>🚩 O que houve com esta questão?</h3>
      ${MOTIVOS.map(m => `<button class="mot" data-m="${m[0]}">${m[1]}</button>`).join("")}
      <textarea id="obs" rows="2" placeholder="Quer explicar melhor? (opcional)"></textarea>
    </div>
    <div class="acoes">
      <button class="btn danger" id="enviarRep" disabled>Enviar</button>
      <button class="flag neutra" id="cancelRep" aria-label="Cancelar">✕</button>
    </div>`;
  ligarCue();
  document.querySelectorAll(".mot").forEach(b => b.onclick = () => {
    document.querySelectorAll(".mot").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); motivo = b.dataset.m;
    $("#enviarRep").disabled = false;
  });
  $("#cancelRep").onclick = () => rodapeFeedback(it, acertou, exp);
  $("#enviarRep").onclick = () => {
    if(!motivo) return;
    S.reportes = (S.reportes || []).filter(r => r.id !== it.id);
    S.reportes.push({
      id: it.id, disc: it.disc, prova: it.prova, tipo: it.t,
      motivo, obs: ($("#obs").value || "").trim().slice(0, 500), quando: hoje()
    });
    salvar();
    rodapeFeedback(it, acertou, exp,
      "🚩 Anotado, obrigada. Fica guardado em Ajustes → Questões reportadas, para você me mandar depois.");
  };
}

/* ---------- 1. Verdadeiro ou falso ---------- */
function rVF(it){
  $("#q").innerHTML = cabecalho(it, "A afirmação é verdadeira ou falsa?") +
    `<div class="stem">${esc(it.frase)}</div>
     <div class="vfgrid">
       <button class="opt" data-v="1"><span>Verdadeiro</span></button>
       <button class="opt" data-v="0"><span>Falso</span></button>
     </div>`;
  $(".foot").innerHTML = barraTempoHTML();   // V/F responde no toque: rodapé é só o relógio
  document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
    if(SES.respondido) return;
    const resp = b.dataset.v === "1", acertou = resp === it.correta;
    document.querySelectorAll("[data-v]").forEach(x => {
      if((x.dataset.v === "1") === it.correta) x.classList.add("ok");
      else if(x === b) x.classList.add("no");
    });
    concluir(it, acertou, (it.correta ? "<b>Verdadeiro.</b> " : "<b>Falso.</b> ") + esc(it.just));
  });
}

/* ---------- 2. Múltipla escolha ---------- */
/* linha de alternativa: o botão da opção + o ✕ que risca o que a pessoa já descartou */
function linhaOpcao(idx, letra, txt){
  return `<div class="optrow">
      <button class="opt" data-i="${idx}"><span class="k">${letra}</span><span>${esc(txt)}</span></button>
      <button class="risca" data-r="${idx}" title="Riscar esta alternativa" aria-label="Riscar esta alternativa">✕</button>
    </div>`;
}
function ligarRiscar(aoRiscar){
  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    if(SES.respondido) return;
    const i = +b.dataset.r;
    const alvo = document.querySelector(`.opt[data-i="${i}"]`);
    const agora = !alvo.classList.contains("riscada");
    alvo.classList.toggle("riscada", agora);
    b.classList.toggle("on", agora);
    if(agora && alvo.classList.contains("sel")) aoRiscar(i, alvo);   // riscar o que estava marcado desmarca
  });
}
function travarRiscar(){ document.querySelectorAll("[data-r]").forEach(b => b.disabled = true); }

function rMCQ(it){
  const ordem = embaralhar(it.opcoes.map((o,i) => ({o, i})));
  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    ordem.map((x, n) => linhaOpcao(x.i, "ABCDE"[n], x.o)).join("");
  let sel = null;
  pedirVerificar(() => {
    if(sel === null) return;
    travarRiscar();
    document.querySelectorAll(".opt[data-i]").forEach(x => {
      if(+x.dataset.i === it.correta) x.classList.add("ok");
      else if(+x.dataset.i === sel) x.classList.add("no");
      x.classList.remove("sel");
    });
    concluir(it, sel === it.correta, `<b>Resposta: ${esc(it.opcoes[it.correta])}</b><br>${esc(it.exp)}`);
  }, false);
  document.querySelectorAll(".opt[data-i]").forEach(b => b.onclick = () => {
    if(SES.respondido) return;
    document.querySelectorAll(".opt[data-i]").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel"); sel = +b.dataset.i; atualizaVerificar(true);
  });
  ligarRiscar((i, alvo) => { alvo.classList.remove("sel"); sel = null; atualizaVerificar(false); });
}

/* ---------- 2b. Marque todas as corretas ---------- */
function rMulti(it){
  const ordem = embaralhar(it.opcoes.map((o,i) => ({o, i})));
  const gab = new Set(it.corretas);
  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<p class="dica">Pode haver mais de uma certa — marque todas.</p>` +
    ordem.map((x, n) => linhaOpcao(x.i, "ABCDE"[n], x.o)).join("");
  const sel = new Set();
  pedirVerificar(() => {
    if(!sel.size) return;
    travarRiscar();
    document.querySelectorAll(".opt[data-i]").forEach(x => {
      const i = +x.dataset.i;
      x.classList.remove("sel");
      if(gab.has(i)) x.classList.add("ok");            // toda correta fica verde, marcada ou não
      else if(sel.has(i)) x.classList.add("no");       // marcou uma errada
    });
    const acertou = sel.size === gab.size && [...sel].every(i => gab.has(i));
    const listaOk = it.corretas.map(i => "• " + esc(it.opcoes[i])).join("<br>");
    concluir(it, acertou, `<b>${it.corretas.length > 1 ? "Corretas:" : "Correta:"}</b><br>${listaOk}<br>${esc(it.exp)}`);
  }, false);
  document.querySelectorAll(".opt[data-i]").forEach(b => b.onclick = () => {
    if(SES.respondido) return;
    const i = +b.dataset.i;
    if(sel.has(i)){ sel.delete(i); b.classList.remove("sel"); }
    else{
      sel.add(i); b.classList.add("sel");
      b.classList.remove("riscada");                   // marcar desfaz o risco
      const x = document.querySelector(`.risca[data-r="${i}"]`); if(x) x.classList.remove("on");
    }
    atualizaVerificar(sel.size > 0);
  });
  ligarRiscar((i, alvo) => { alvo.classList.remove("sel"); sel.delete(i); atualizaVerificar(sel.size > 0); });
}

/* ---------- 2c. Escrever a resposta ----------
   Comparação tolerante de propósito: a pessoa está treinando o conteúdo, não a ortografia.
   Ignora maiúscula, acento, pontuação e espaço sobrando; aceita as variantes de `aceita`;
   e perdoa UMA letra trocada, faltando ou sobrando em palavras de 6 letras ou mais —
   mas nesse caso mostra a grafia certa, para não fixar o erro. */
function normaliza(t){
  return String(t == null ? "" : t)
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")   // tira acento
    .replace(/[^a-z0-9\s]/g, " ")                       // hífen, ponto, aspas viram espaço
    .replace(/\s+/g, " ").trim()
    // "a adenosina", "o epitálamo", "no epitálamo" valem tanto quanto a palavra sozinha
    .replace(/^(?:o|a|os|as|um|uma|no|na|nos|nas|do|da|dos|das|de|em|pelo|pela)\s+/, "")
    .trim();
}
function distancia(a, b){            // Levenshtein, só até o que precisamos
  if(a === b) return 0;
  if(Math.abs(a.length - b.length) > 1) return 2;
  const m = a.length, k = b.length;
  let linha = new Array(k + 1);
  for(let j = 0; j <= k; j++) linha[j] = j;
  for(let i = 1; i <= m; i++){
    let ant = linha[0]; linha[0] = i;
    for(let j = 1; j <= k; j++){
      const tmp = linha[j];
      linha[j] = Math.min(linha[j] + 1, linha[j-1] + 1, ant + (a[i-1] === b[j-1] ? 0 : 1));
      ant = tmp;
    }
  }
  return linha[k];
}
function conferirEscrita(it, digitado){
  const d = normaliza(digitado);
  if(!d) return { certo:false, quase:false };
  const alvos = [it.resp].concat(it.aceita || []).map(normaliza);
  if(alvos.includes(d)) return { certo:true, quase:false };
  for(const a of alvos){
    if(a.length >= 6 && distancia(d, a) === 1) return { certo:true, quase:true };
  }
  return { certo:false, quase:false };
}

function rEscrita(it){
  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<p class="dica">Escreva a resposta — uma palavra basta.</p>
     <input class="resposta" id="txtResp" type="text" inputmode="text"
       autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
       placeholder="digite aqui" aria-label="Sua resposta">
     ${it.pista ? `<p class="pista">💡 ${esc(it.pista)}</p>` : ""}`;
  const campo = $("#txtResp");
  const responder = () => {
    if(SES.respondido) return;
    const r = conferirEscrita(it, campo.value);
    if(!campo.value.trim()) return;
    campo.disabled = true;
    campo.classList.add(r.certo ? "ok" : "no");
    const grafia = r.quase
      ? `<b>Quase na grafia — o certo é «${esc(it.resp)}».</b> Vou contar como acerto.<br>`
      : (r.certo ? "" : `<b>Resposta: ${esc(it.resp)}</b><br>`);
    concluir(it, r.certo, grafia + esc(it.exp));
  };
  pedirVerificar(responder, false);
  campo.oninput = () => atualizaVerificar(!!campo.value.trim());
  campo.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); responder(); } };
  setTimeout(() => { try{ campo.focus({ preventScroll:true }); }catch(e){ campo.focus(); } }, 60);
}

/* ---------- 3. Completar lacunas ---------- */
function rCloze(it){
  const partes = it.texto.split(/(\[\[\d+\]\])/g);
  const corpo = partes.map(p => {
    const m = p.match(/^\[\[(\d+)\]\]$/);
    return m ? `<span class="blank" data-b="${m[1]}"></span>` : esc(p);
  }).join("");

  const respostas = it.lacunas.map(l => l.resp);
  const extras = [];
  it.lacunas.forEach(l => (l.dist||[]).forEach(d => {
    if(!respostas.includes(d) && !extras.includes(d)) extras.push(d);
  }));
  const banco = embaralhar(respostas.concat(extras));

  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<div class="cloze">${corpo}</div>
     <div class="bank">${banco.map((w,i) => `<button class="chip" data-w="${i}">${esc(w)}</button>`).join("")}</div>`;

  const preenchido = new Array(it.lacunas.length).fill(null);
  const chips = [...document.querySelectorAll(".chip")];
  const blanks = [...document.querySelectorAll(".blank")];
  const completo = () => preenchido.every(x => x !== null);

  function pintar(){
    blanks.forEach((b, i) => {
      const ci = preenchido[i];
      b.textContent = ci === null ? "" : banco[ci];
      b.classList.toggle("filled", ci !== null);
    });
    chips.forEach((c, i) => c.classList.toggle("used", preenchido.includes(i)));
    atualizaVerificar(completo());
  }
  chips.forEach((c, i) => c.onclick = () => {
    if(SES.respondido) return;
    const vaga = preenchido.indexOf(null); if(vaga === -1) return;
    preenchido[vaga] = i; pintar();
  });
  blanks.forEach((b, i) => b.onclick = () => {
    if(SES.respondido) return;
    if(preenchido[i] !== null){ preenchido[i] = null; pintar(); }
  });

  pedirVerificar(() => {
    if(!completo()) return;
    let tudoOk = true;
    blanks.forEach((b, i) => {
      const dado = banco[preenchido[i]], certo = it.lacunas[i].resp;
      b.classList.remove("filled");
      if(dado === certo) b.classList.add("ok");
      else { tudoOk = false; b.classList.add("no"); b.insertAdjacentHTML("afterend", ` <span class="blank fix">${esc(certo)}</span>`); }
    });
    $(".bank").style.display = "none";
    concluir(it, tudoOk, esc(it.exp));
  }, false);
  pintar();
}

/* ---------- 4. Colocar em ordem ---------- */
function rOrdem(it){
  const baralho = embaralhar(it.seq.map((s, i) => ({s, i})));
  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<div class="slots" id="slots"></div>
     <div class="pool" id="pool">${baralho.map((x, k) => `<button class="prow" data-k="${k}">${esc(x.s)}</button>`).join("")}</div>`;

  const escolhidos = [];
  function pintar(){
    $("#slots").innerHTML = escolhidos.map((k, n) =>
      `<div class="srow" data-pos="${n}"><div class="n">${n+1}</div><div>${esc(baralho[k].s)}</div></div>`).join("");
    document.querySelectorAll("#pool .prow").forEach((b, k) => b.style.display = escolhidos.includes(k) ? "none" : "block");
    document.querySelectorAll(".srow").forEach(r => r.onclick = () => {
      if(SES.respondido) return;
      escolhidos.splice(+r.dataset.pos, 1); pintar();
    });
    atualizaVerificar(escolhidos.length === it.seq.length);
  }
  document.querySelectorAll("#pool .prow").forEach((b, k) => b.onclick = () => {
    if(SES.respondido) return;
    escolhidos.push(k); pintar();
  });

  pedirVerificar(() => {
    if(escolhidos.length !== it.seq.length) return;
    let tudoOk = true;
    escolhidos.forEach((k, n) => {
      const certo = baralho[k].i === n;
      if(!certo) tudoOk = false;
      $(`.srow[data-pos="${n}"]`).classList.add(certo ? "ok" : "no");
    });
    $("#pool").style.display = "none";
    if(!tudoOk) $("#slots").insertAdjacentHTML("afterend",
      `<div class="gab"><b style="font-size:14px">Ordem correta:</b><ol>${it.seq.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>`);
    concluir(it, tudoOk, esc(it.exp));
  }, false);
  pintar();
}

/* ---------- 5. Relacionar ---------- */
/* o gabarito do relacionar, escrito por extenso — as colunas ficam embaralhadas
   e depois de fechar tudo é difícil reler qual foi com qual */
function listaDePares(it){
  return `<div class="pares">${it.pares.map(p =>
    `<div class="par"><b>${esc(p[0])}</b><span class="seta">→</span><span>${esc(p[1])}</span></div>`).join("")}</div>`;
}
function rRel(it){
  const esqL = embaralhar(it.pares.map((p, i) => ({txt:p[0], i})));
  const dirL = embaralhar(it.pares.map((p, i) => ({txt:p[1], i})));
  $("#q").innerHTML = cabecalho(it, it.enunciado) +
    `<div class="mgrid">
       <div class="mcol">${esqL.map((x,k) => `<button class="mi" data-l="${k}" data-par="${x.i}">${esc(x.txt)}</button>`).join("")}</div>
       <div class="mcol">${dirL.map((x,k) => `<button class="mi" data-r="${k}" data-par="${x.i}">${esc(x.txt)}</button>`).join("")}</div>
     </div>`;
  $(".foot").innerHTML = barraTempoHTML()
    + `<p class="muted" style="text-align:center;margin:0 0 8px">Toque num item da esquerda e depois no par dele à direita.</p>`;

  let selE = null, feitos = 0, errou = false;
  const tot = it.pares.length;
  const todos = [...document.querySelectorAll(".mi")];
  todos.forEach(b => b.onclick = () => {
    if(SES.respondido) return;
    if(b.hasAttribute("data-l")){
      todos.forEach(x => x.classList.remove("sel"));
      b.classList.add("sel"); selE = b; return;
    }
    if(!selE) return;
    if(selE.dataset.par === b.dataset.par){
      selE.classList.remove("sel"); selE.classList.add("done"); b.classList.add("done");
      selE = null; feitos++;
      if(feitos === tot) concluir(it, !errou,
        (errou ? "Você fechou todos os pares, mas errou pelo caminho — volta amanhã.<br>" : "") +
        listaDePares(it) + esc(it.exp));
    }else{
      errou = true;
      const a = selE, c = b;
      a.classList.add("err"); c.classList.add("err");
      setTimeout(() => { a.classList.remove("err","sel"); c.classList.remove("err"); }, 400);
      selE = null;
    }
  });
}

/* ============================================================
   TELA: rever uma questão já respondida
   Só leitura: não pontua de novo nem mexe no agendamento. O objetivo é
   reler a explicação que passou rápido demais.
   ============================================================ */
function gabaritoLegivel(it){
  switch(it.t){
    case "mcq":   return `<div class="pares"><div class="par"><b>Resposta</b><span class="seta">→</span><span>${esc(it.opcoes[it.correta])}</span></div></div>`;
    case "multi": return `<div class="pares">${it.corretas.map(i =>
                    `<div class="par"><b>✓</b><span>${esc(it.opcoes[i])}</span></div>`).join("")}</div>`;
    case "vf":    return `<div class="pares"><div class="par"><b>${it.correta ? "Verdadeiro" : "Falso"}</b></div></div>`;
    case "escrita": return `<div class="pares"><div class="par"><b>Resposta</b><span class="seta">→</span><span>${esc(it.resp)}</span></div></div>`;
    case "cloze": return `<div class="pares">${it.lacunas.map((l, k) =>
                    `<div class="par"><b>${k+1}</b><span class="seta">→</span><span>${esc(l.resp)}</span></div>`).join("")}</div>`;
    case "ordem": return `<div class="pares">${it.seq.map((p, k) =>
                    `<div class="par"><b>${k+1}</b><span class="seta">→</span><span>${esc(p)}</span></div>`).join("")}</div>`;
    case "relacionar": return listaDePares(it);
    default: return "";
  }
}

/* ============================================================
   TELA: fim de sessão
   ============================================================ */
function telaFim(){
  pararRelogio();
  const pc = SES.total ? Math.round(100 * SES.acertos / SES.total) : 0;
  const bateuMeta = S.feitosHoje >= S.meta;
  const respondidas = SES.vistos.length - SES.estourou;
  const segMedio = respondidas > 0 ? Math.round((Date.now() - SES.inicio) / 1000 / respondidas) : null;
  /* Bônus de tempo: só para quem acertou a sessão inteira. Rapidez com erro é
     chute, não domínio — uma questão errada apaga o bônus por completo. Duas
     faixas fixas, para dar para saber de cabeça o que se está perseguindo. */
  const semErro = SES.total > 0 && SES.acertos === SES.total;
  let bonus = 0, faixaBonus = null;
  if(SES.valeRanking !== false && !SES.estourou && semErro && segMedio != null){
    faixaBonus = BONUS_TEMPO.find(f => segMedio < f.seg) || null;
    if(faixaBonus){ bonus = faixaBonus.xp; S.xp += bonus; S.xpSemana += bonus;
                    SES.xpGanho = (SES.xpGanho || 0) + bonus; }
  }
  let novoRecorde = false;
  if(segMedio && !SES.estourou && SES.acertos === SES.total && SES.total >= 5){
    if(!S.recorde || segMedio < S.recorde){ S.recorde = segMedio; novoRecorde = true; }
  }
  /* marcos que não dá para recalcular depois: uma vez acontecidos, ficam */
  S.marcos = S.marcos || {};
  if(semErro) S.marcos.perfeitas = (S.marcos.perfeitas || 0) + 1;
  S.marcos.ofensivaMax = Math.max(S.marcos.ofensivaMax || 0, S.ofensiva || 0);
  const prox = provaMaisProxima();
  if(prox && prox.dias <= 1) S.marcos.vespera = true;
  const antesDasConquistas = S.marcos.conquistas || [];
  const agora = conquistasGanhas().map(c => c.id);
  const novasConquistas = agora.filter(id => !antesDasConquistas.includes(id));
  S.marcos.conquistas = agora;
  /* Vaga na liga só depois de uma bateria que vale ranking — é o que impede
     cadeira ocupada por quem não jogou. */
  if(SES.valeRanking !== false && SES.total > 0) entrarNaLiga();
  if(SES.desafio) gravarResultadoDoDesafio();
  const faltaEspera = S.proximaSessao ? Math.max(0, Math.round((S.proximaSessao - Date.now())/1000)) : 0;
  salvar();

  const corpo = `
    <div class="done">
      <div class="big">${SES.estourou ? "⏰" : pc >= 80 ? "🎉" : pc >= 50 ? "💪" : "🌱"}</div>
      <h2>${SES.estourou ? "O tempo acabou" : pc >= 80 ? "Sessão redonda!" : pc >= 50 ? "Boa, tá fixando" : "Repetição é isso aí"}</h2>
      <p>${SES.estourou
            ? plural(SES.estourou, "questão ficou sem resposta e contou como erro", "questões ficaram sem resposta e contaram como erro") + ". Elas voltam amanhã."
            : bateuMeta ? "Meta do dia batida. Volta amanhã que o app já separa o que precisa revisar."
                        : "Faltam " + (S.meta - S.feitosHoje) + " para bater a meta de hoje."}</p>
      <div class="fimGrade">
        <div><b>${SES.acertos}/${SES.total}</b><span>acertos de primeira</span></div>
        <div><b>⚡ ${SES.maiorSeq || 0}</b><span>maior sequência</span></div>
        <div><b>⭐ ${SES.xpGanho || 0}</b><span>XP nesta rodada</span></div>
        <div><b>${segMedio != null ? segMedio + "s" : "—"}</b><span>por questão</span></div>
      </div>
      <div>
        ${bonus ? `<span class="pill" style="color:var(--gold)">⏱ +${bonus} de bônus por velocidade —
          menos de ${faixaBonus.seg}s por questão, sem errar nenhuma</span>` : ""}
        ${(!bonus && !SES.estourou && !semErro && SES.valeRanking !== false)
          ? `<span class="pill muted">o bônus de tempo pede a sessão inteira sem erro</span>` : ""}
        ${(!bonus && semErro && segMedio != null && SES.valeRanking !== false)
          ? `<span class="pill muted">a ${segMedio}s por questão — o bônus começa abaixo de ${BONUS_TEMPO[BONUS_TEMPO.length-1].seg}s</span>` : ""}
      </div>
      ${SES.modo === "treino" ? `<p class="muted" style="margin-top:16px">Você já viu tudo o que havia de novo e nada estava vencendo:
        esta foi uma sessão de <b>treino livre</b>, com exercícios repetidos. Treina bem, mas o "dominado" quase não anda —
        ele depende de você voltar em outro dia.</p>` : ""}
      ${SES.valeRanking === false ? `<p class="muted" style="margin-top:16px">Esta sessão entrou só no seu XP total —
        para valer no ranking, é preciso respeitar a espera entre sessões.</p>` : ""}
      ${novoRecorde ? `<p style="margin-top:16px;font-weight:800;color:var(--gold)">🏅 Novo recorde de tempo, sem errar nenhuma!</p>` : ""}
      ${SES.desafio ? (() => {
        const d = SES.desafio, meu = "res" + meuLado(d), dela = "res" + outroLado(d);
        const nomeDela = d.de === (N.usuario && N.usuario.uid) ? "sua adversária" : esc(d.nomeDe || "quem te desafiou");
        if(!d[dela]) return `<div class="desFim">⚔️ <b>Resultado enviado</b>
          <span>Você fez ${SES.acertos} de ${SES.total}. Falta ${nomeDela} responder — quando ela
          responder, o resultado aparece na aba do grupo.</span></div>`;
        const venc = quemVenceu(d);
        const eu = N.usuario && N.usuario.uid;
        return `<div class="desFim ${venc === eu ? "ganhou" : venc === "empate" ? "" : "perdeu"}">
          ${venc === eu ? "🏆" : venc === "empate" ? "🤝" : "⚔️"}
          <b>${venc === eu ? "Você venceu!" : venc === "empate" ? "Empate" : "Você perdeu essa"}</b>
          <span>${SES.acertos} × ${d[dela].acertos} em acertos${
            d[meu] && d[dela] && d[meu].acertos === d[dela].acertos
              ? ` · ${Math.round(d[meu].ms/1000)}s contra ${Math.round(d[dela].ms/1000)}s` : ""}.
            ${venc === eu ? `Você leva ${XP_VITORIA} de bônus.` : ""}</span></div>`;
      })() : ""}
      ${novasConquistas.length ? `<div class="novaConq">
        <b>${novasConquistas.length === 1 ? "Conquista nova!" : novasConquistas.length + " conquistas novas!"}</b>
        ${novasConquistas.map(id => {
          const c = CONQUISTAS.find(x => x.id === id);
          return `<div class="cq"><span class="sel">${c.emoji}</span>
            <span class="cqtx"><b>${esc(c.nome)}</b><span>${esc(c.desc)}</span></span></div>`;
        }).join("")}
      </div>` : ""}
      ${faltaEspera > 0 ? `<p class="muted" style="margin-top:18px">A próxima sessão que vale ranking libera em <b>${mmss(faltaEspera)}</b> —
        a espera começou a correr quando você abriu esta bateria, então o tempo que você levou aqui já está descontado.</p>`
        : (S.esperaMin > 0 && SES.valeRanking === false
            ? `<p class="muted" style="margin-top:18px">A espera do ranking segue correndo normalmente — esta sessão não mexeu nela.</p>` : "")}
    </div>`;
  montarTela(corpo, { comNav:false, rodape:
    `<button class="btn" id="mais">${bateuMeta ? "Mais uma rodada" : "Continuar estudando"}</button>
     <div style="height:10px"></div>
     <button class="btn ghost" id="home">Voltar ao início</button>` });
  $("#mais").onclick = iniciarSessao;
  $("#home").onclick = telaInicio;
}

/* ============================================================
   NUVEM — Firebase (autenticação + Firestore)

   Só liga se window.FIREBASE_CONFIG existir. No arquivo único ele não
   existe, e o app roda exatamente como antes: banco embutido, progresso
   no próprio aparelho, sem login. É de propósito — é a versão que
   funciona offline no computador, sem depender de nada.

   Nada aqui decide permissão. Quem decide é o Firestore, pelas regras
   em firestore.rules. O que está deste lado é só a experiência.
   ============================================================ */
/* O endereço do SDK é trocável para os testes poderem rodar contra um dublê
   que obedece às mesmas regras. Em produção, window.SDK_BASE não existe. */
const SDK = window.SDK_BASE || "https://www.gstatic.com/firebasejs/12.17.1/";
const N = { ligado:false, pronto:false, auth:null, db:null, api:{},
            usuario:null, grupo:null, papel:null };

const CHAVE_CACHE  = "fixaai_cache_banco";
const CHAVE_GRUPO  = "fixaai_grupo";

async function nuvemCarregar(){
  if(!window.FIREBASE_CONFIG) return false;
  const [a, au, fs] = await Promise.all([
    import(SDK + "firebase-app.js"),
    import(SDK + "firebase-auth.js"),
    import(SDK + "firebase-firestore.js")
  ]);
  const app = a.initializeApp(window.FIREBASE_CONFIG);
  N.auth = au.getAuth(app);
  N.db   = fs.getFirestore(app);
  N.api  = { ...au, ...fs };
  N.ligado = true;
  /* Quem estava no meio de um redirecionamento de uma versão antiga do app
     ainda pode voltar por aqui. Recolhemos o resultado para não deixar essa
     pessoa presa, mas nenhum caminho novo produz redirecionamento. */
  if(sessionStorage.getItem("fixaai_redirecionando")){
    sessionStorage.removeItem("fixaai_redirecionando");
    try{ await N.api.getRedirectResult(N.auth); }
    catch(e){ N.erroRedirecionamento = traduzErro(e); }
  }
  return true;
}

/* ---------- entrar e sair ----------

   AQUI MORAVA O BUG DO "SAÍ DA CONTA E NÃO CONSIGO MAIS ENTRAR".

   A versão anterior mandava iPhone, Safari e app instalado na tela de início
   entrarem por `signInWithRedirect`. Esse caminho está quebrado para nós, e a
   quebra é silenciosa: o redirecionamento passa por um iframe hospedado em
   fixaai-59643.firebaseapp.com, que é um domínio DIFERENTE do endereço do app
   (fixaai.github.io). Chrome 115+, Safari 16.1+ e Firefox 109+ bloqueiam o
   acesso a armazenamento de terceiros, o iframe não consegue guardar o estado,
   e a pessoa volta do Google exatamente para a tela de login — sem erro nenhum
   na tela e sem erro nenhum no console.

   A documentação do próprio Firebase lista `signInWithPopup` como a alternativa
   recomendada para esse caso, porque o pop-up é uma janela de verdade: ela
   devolve a credencial por postMessage para quem a abriu, sem depender de
   armazenamento de terceiros. Então é pop-up em toda plataforma, sem exceção.

   Se algum dia o app ganhar domínio próprio e o authDomain passar a ser o mesmo
   endereço, o redirecionamento volta a funcionar e pode ser reconsiderado. Até
   lá, oferecê-lo seria oferecer um caminho que não chega a lugar nenhum. */

/* ---------- entrar sem sair do endereço do app ----------

   O caminho antigo mandava a pessoa para fixaai-59643.firebaseapp.com e trazia
   de volta. Dois endereços diferentes — e o Safari do iPhone separa o
   armazenamento por site, então o pedaço do login que rodava lá não enxergava o
   que tinha sido guardado aqui. O resultado era a tela "missing initial state",
   que a Yasmin viu, e não havia jeito de contornar de dentro do app.

   Agora quem cuida da identificação é a biblioteca do próprio Google, rodando
   NESTA página. Ela devolve um bilhete assinado (o "credential"), e o Firebase
   aceita esse bilhete direto. Nenhum momento do login sai de fixaai.github.io,
   então a separação de armazenamento deixa de importar — no iPhone, no Android
   e no computador igualmente.

   O caminho antigo continua no código como reserva: se a biblioteca do Google
   não carregar (rede ruim, bloqueador de anúncios), aparece o botão de sempre.
   Ficar sem nenhuma forma de entrar seria pior do que qualquer um dos dois. */
function carregarGoogle(){
  if(window.__gsiPromessa) return window.__gsiPromessa;
  window.__gsiPromessa = new Promise((ok, falhou) => {
    if(!window.GOOGLE_CLIENT_ID) return falhou(new Error("sem client id"));
    if(window.google && google.accounts && google.accounts.id) return ok();
    const t = setTimeout(() => falhou(new Error("demorou")), 6000);
    const sc = document.createElement("script");
    sc.src = "https://accounts.google.com/gsi/client";
    sc.async = true; sc.defer = true;
    sc.onload = () => { clearTimeout(t); ok(); };
    sc.onerror = () => { clearTimeout(t); falhou(new Error("não carregou")); };
    document.head.appendChild(sc);
  });
  return window.__gsiPromessa;
}
async function botaoDoGoogle(onde, aoFalhar){
  try{
    await carregarGoogle();
    google.accounts.id.initialize({
      client_id: window.GOOGLE_CLIENT_ID,
      auto_select: false,
      callback: async (resp) => {
        try{
          telaCarregando("Entrando");
          const cred = N.api.GoogleAuthProvider.credential(resp.credential);
          await N.api.signInWithCredential(N.auth, cred);
        }catch(e){ telaEntrar(traduzErro(e)); }
      }
    });
    const largura = Math.min(360, Math.max(240, onde.getBoundingClientRect().width || 300));
    google.accounts.id.renderButton(onde, {
      type:"standard", theme:"outline", size:"large", shape:"pill",
      text:"signin_with", logo_alignment:"center", locale:"pt-BR", width: Math.round(largura)
    });
    return true;
  }catch(e){ aoFalhar && aoFalhar(); return false; }
}

function provedorGoogle(){
  const p = new N.api.GoogleAuthProvider();
  p.setCustomParameters({ prompt: "select_account" });
  return p;
}

async function entrarComGoogle(){
  /* Reserva, para quando a biblioteca do Google não carrega. Chamado direto do
     clique, sem nenhum await antes: navegador só deixa abrir janela enquanto o
     gesto da pessoa ainda está "quente". */
  return N.api.signInWithPopup(N.auth, provedorGoogle());
}
/* Não existe entrada por e-mail e senha, de propósito. Ter um campo de senha
   fazia o navegador oferecer "salvar senha neste site", o que dá a impressão de
   que o app quer a senha do e-mail da pessoa — e criava um beco sem saída para
   quem digitava um endereço já cadastrado pelo Google. Com o Google, nenhuma
   senha passa por aqui. */
async function sairDaConta(){

/* A data vem como Timestamp do Firestore, mas pode chegar como número em
   cache ou em teste. Uma função só evita a comparação silenciosamente errada
   que deixaria passar um convite vencido. */
function emMilissegundos(v){
  if(v == null) return 0;
  if(typeof v === "number") return v;
  if(typeof v.toMillis === "function") return v.toMillis();
  if(v.seconds != null) return v.seconds * 1000;
  const d = new Date(v);
  return isNaN(d) ? 0 : d.getTime();
}

async function entrarNoGrupoPorCodigo(codigo){
  codigo = String(codigo || "").trim().toUpperCase();
  if(!codigo) throw new Error("Digite o código do convite.");

  const cv = await N.api.getDoc(ref("convites", codigo));
  if(!cv.exists()) throw new Error("Não encontrei esse código. Confira se digitou certo.");
  const c = cv.data();
  if(!c.ativo) throw new Error("Este convite foi desativado.");
  if(c.usos >= c.maxUsos) throw new Error("Este convite já atingiu o limite de pessoas.");
  if(emMilissegundos(c.expiraEm) && emMilissegundos(c.expiraEm) < Date.now())
    throw new Error("Este convite venceu. Peça um código novo.");

  const u = N.usuario;
  await N.api.setDoc(ref("grupos", c.grupo, "membros", u.uid), {
    nome: u.displayName || (u.email || "").split("@")[0],
    entrouEm: N.api.serverTimestamp(),
    papel: "membro",
    viaConvite: codigo
  });
  await N.api.updateDoc(ref("convites", codigo), { usos: N.api.increment(1) });
  await N.api.setDoc(ref("usuarios", u.uid),
    { grupos: N.api.arrayUnion(c.grupo) }, { merge: true });
  return c.grupo;
}

/* ---------- o banco de questões ----------

   O Firestore NÃO aceita lista dentro de lista. As questões de relacionar
   guardam os pares como [["esquerda","direita"], ...] — exatamente o formato
   proibido. Na ida cada par vira {e,d}; na volta, par de novo. O resto do app
   continua vendo pares como sempre viu.                                    */
function paraNuvem(it){
  if(!Array.isArray(it.pares)) return it;
  return { ...it, pares: it.pares.map(p => ({ e: p[0], d: p[1] })) };
}
function daNuvem(it){
  if(!Array.isArray(it.pares)) return it;
  return { ...it, pares: it.pares.map(p => Array.isArray(p) ? p : [p.e, p.d]) };
}
/* Rede de proteção: se um tipo novo de exercício trouxer outra lista aninhada,
   quero saber na hora de publicar, com o caminho exato, e não um erro genérico. */
function acharListaAninhada(v, caminho){
  if(Array.isArray(v)){
    for(let i = 0; i < v.length; i++){
      if(Array.isArray(v[i])) return caminho + "[" + i + "]";
      const f = acharListaAninhada(v[i], caminho + "[" + i + "]");
      if(f) return f;
    }
    return null;
  }
  if(v && typeof v === "object"){
    for(const k of Object.keys(v)){
      const f = acharListaAninhada(v[k], caminho + "." + k);
      if(f) return f;
    }
  }
  return null;
}

async function lerBancoDoGrupo(g){
  const q = await N.api.getDocs(cole("grupos", g, "banco"));
  if(q.empty) return null;
  const curso = { disciplinas:[], topicos:[], itens:[] };
  const vistos = new Set();
  q.forEach(d => {
    const b = d.data();
    (b.disciplinas || []).forEach(x => { if(!vistos.has("d"+x.id)){ vistos.add("d"+x.id); curso.disciplinas.push(x); } });
    (b.topicos || []).forEach(x => { if(!vistos.has("t"+x.id)){ vistos.add("t"+x.id); curso.topicos.push(x); } });
    (b.itens || []).forEach(x => { if(!vistos.has("i"+x.id)){ vistos.add("i"+x.id); curso.itens.push(daNuvem(x)); } });
  });
  return curso;
}

/* ---------- progresso na nuvem ---------- */
const CAMPOS_SINC = ["prog","xp","xpSemana","semana","ofensiva","ultimoDia","dia",
                     "feitosHoje","recorde",
                     "datas","foco","historico","reportes","apelido","emoji",
                     "horizonte","marcos","congelados",
                     "nivel","sala","semanaSala","semanaPassada","ligaVista","pod1","pod2","gelos",
                     "desafiosVistos","desafiosGanhos"];

function juntarProgresso(local, remoto){
  /* Mesma conta em dois aparelhos: fica o mais adiantado de cada questão,
     e o maior de cada contador. Nunca perde acerto de ninguém. */
  if(!remoto) return local;
  const fora = { ...local };
  const p = { ...(remoto.prog || {}) };
  Object.keys(local.prog || {}).forEach(id => {
    const a = local.prog[id], b = p[id];
    p[id] = (!b || (a.reps || 0) >= (b.reps || 0)) ? a : b;
  });
  fora.prog = p;
  ["xp","xpSemana","ofensiva","feitosHoje"].forEach(k =>
    fora[k] = Math.max(local[k] || 0, remoto[k] || 0));
  fora.historico = { ...(remoto.historico || {}), ...(local.historico || {}) };
  fora.datas     = { ...(remoto.datas || {}), ...(local.datas || {}) };
  if(remoto.recorde) fora.recorde = Math.min(local.recorde || 1e9, remoto.recorde);
  /* Apelido, emoji e ajustes de estudo viajam com a conta. A regra é simples:
     num aparelho recém-instalado, tudo vem da nuvem — é o tablet novo que tem
     que ficar igual ao celular. Num aparelho já em uso, o que está aqui é o que
     a pessoa acabou de escolher aqui, e não pode ser sobrescrito por um valor
     antigo que estava lá em cima. */
  const aparelhoNovo = !Object.keys(local.prog || {}).length
                    && !Object.keys(local.datas || {}).length
                    && !(local.apelido || "").trim();
  /* marcos são acumulados: o que foi conquistado num aparelho vale nos dois */
  const m = { ...(remoto.marcos || {}), ...(local.marcos || {}) };
  m.perfeitas   = Math.max((local.marcos||{}).perfeitas   || 0, (remoto.marcos||{}).perfeitas   || 0);
  m.ofensivaMax = Math.max((local.marcos||{}).ofensivaMax || 0, (remoto.marcos||{}).ofensivaMax || 0);
  m.vespera     = !!((local.marcos||{}).vespera || (remoto.marcos||{}).vespera);
  m.conquistas  = [...new Set([ ...((local.marcos||{}).conquistas || []),
                                ...((remoto.marcos||{}).conquistas || []) ])];
  fora.marcos = m;
  ["apelido","emoji"].forEach(k => {
    fora[k] = aparelhoNovo ? (remoto[k] || local[k] || "") : (local[k] || remoto[k] || "");
  });
  fora.meta = SESSAO; fora.segPorQuestao = SEG_POR_QUESTAO; fora.esperaMin = ESPERA_MIN;
  return fora;
}

/* ============================================================
   O QUE O GRUPO VÊ

   Duas coisas saem do privado, cada uma numa coleção própria dentro do grupo:

     placar/{uid}  — apelido, emoji, XP, ofensiva, pódios, desafios, conquistas.
                     É o que faz existir ranking, liga e perfil das colegas.
     datas/{uid}   — as datas de prova que a pessoa marcou, para o app poder
                     sugerir a data que a maioria da turma escolheu.

   O progresso item a item continua em progresso/{uid}, que só a dona lê. Nada
   do que a pessoa errou sai daqui.
   ============================================================ */
async function publicarPlacar(){
  if(!N.ligado || !N.usuario || !N.grupo) return;
  const dados = {
    apelido: (S.apelido || "").trim().slice(0, 14),
    emoji: (S.emoji || "").slice(0, 8),
    xp: Math.max(0, Math.round(S.xp || 0)),
    xpSemana: Math.max(0, Math.round(S.xpSemana || 0)),
    semana: S.semana || domingoDa(hoje()),
    ofensiva: Math.max(0, Math.round(S.ofensiva || 0)),
    nivel: S.nivel || "bronze",
    sala: (S.semanaSala === (S.semana || domingoDa(hoje())) && S.sala != null) ? S.sala : -1,
    semanaSala: S.semanaSala || "",
    semanaPassada: S.semanaPassada || null,
    pod1: Math.max(0, S.pod1 || 0), pod2: Math.max(0, S.pod2 || 0),
    desafios: Math.max(0, S.desafiosGanhos || 0),
    /* Exercícios respondidos e dias estudados andam junto com o XP de propósito:
       XP alto com pouco exercício respondido não fecha, e o grupo inteiro vê.
       Como o servidor não consegue recalcular XP sem plano pago, é isto que
       transforma "confia" em "dá para conferir olhando". */
    feitos: Math.max(0, Math.round(totalRespondidas())),
    dias: Object.keys(S.historico || {}).length,
    conquistas: conquistasGanhas().map(c => c.id).slice(0, 60),
    atualizadoEm: N.api.serverTimestamp()
  };
  try{ await N.api.setDoc(ref("grupos", N.grupo, "placar", N.usuario.uid), dados, { merge:true }); }
  catch(e){ /* sem rede ou sem permissão: tenta na próxima */ }
}
